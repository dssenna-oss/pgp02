  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>LGPD — Artigos 21 a 30 | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--blue2:#1976D2;--lblue:#E3F2FD;--lblue2:#BBDEFB;\n  --teal:#00695C;--lteal:#E0F2F1;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --red:#C62828;--lred:#FFEBEE;\n  --purple:#6A1B9A;--lpurp:#F3E5F5;\n  --indigo:#283593;--lindigo:#E8EAF6;\n  --gov:#1A237E;--lgov:#E8EAF6;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}\nh1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2}\nh2{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;line-height:1.3}\nh3{font-size:1rem;font-weight:700;line-height:1.4}\nh4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\np{color:var(--muted)}\nstrong{color:var(--text);font-weight:600}\nul{padding-left:18px;color:var(--muted)}\nli+li{margin-top:5px}\n\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n.sec{padding:56px 0}\n.sec:nth-child(odd){background:#fff}\n.sec:nth-child(even){background:var(--bg)}\n\n.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}\n.art-num{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:800;color:#fff}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:5px}\n\n.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}\n.tcol{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}\n\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.icard{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}\n.icard-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff}\n.dcard{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05)}\n.dcard .dn{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}\n.dcard .dt{font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--text)}\n.dcard .dd{font-size:.8rem;color:var(--muted)}\n\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n.cat-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:2px solid;margin:24px 0 12px}\n\n/* Chapter divider */\n.chap-divider{padding:32px 0;background:linear-gradient(135deg,var(--gov) 0%,var(--indigo) 100%);color:#fff;margin:0}\n.chap-divider h2{color:#fff}\n.chap-divider p{color:rgba(255,255,255,.75)}\n\n/* Vetado card */\n.vetado{background:#F5F5F5;border:2px dashed #BDBDBD;border-radius:var(--r);padding:28px;text-align:center}\n.vetado h3{color:#9E9E9E;font-size:1.2rem;margin-bottom:8px}\n.vetado p{color:#BDBDBD}\n.vetado-badge{display:inline-block;background:#E0E0E0;color:#757575;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:20px;margin-bottom:14px}\n\n/* Traffic light (allow/deny) */\n.traffic{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.traffic-allow{background:var(--lgreen);border:1px solid #A5D6A7;border-radius:var(--r);padding:18px}\n.traffic-deny{background:var(--lred);border:1px solid #FFCDD2;border-radius:var(--r);padding:18px}\n.traffic-allow h3{color:var(--green);margin-bottom:10px}\n.traffic-deny h3{color:var(--red);margin-bottom:10px}\n.traffic-allow ul,.traffic-deny ul{color:var(--muted);padding-left:16px}\n\n/* Gov icon circle */\n.gov-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#fff;margin-bottom:12px;flex-shrink:0}\n\n/* Flow */\n.flow{display:flex;flex-direction:column;gap:0}\n.flow-step{display:flex;gap:16px;align-items:flex-start;padding:14px 0}\n.flow-step+.flow-step{border-top:1px solid var(--border)}\n.flow-icon{flex-shrink:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff}\n\n/* Intro band */\n.intro-band{background:linear-gradient(135deg,#0D1B4B 0%,#283593 100%);color:#fff;padding:48px 0}\n.intro-band h1{color:#fff}\n.intro-band p{color:rgba(255,255,255,.8)}\n.progress-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:24px}\n.prog-pill{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700}\n.prog-done{background:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}\n.prog-now{background:#fff;color:var(--navy)}\n\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--gov);color:#fff}\n\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\nfooter a{color:rgba(255,255,255,.55);text-decoration:none;font-size:.8rem;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;display:inline-block;margin:4px}\n\n@media(max-width:680px){\n  .tcol,.traffic{grid-template-columns:1fr}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"5684445a-dd28-4e08-8dd0-dbc4f8fdf5f4\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- INTRO BANNER -->\n<section class=\"intro-band\">\n  <div class=\"wrap\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;flex-wrap:wrap\">\n      <div>\n        <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Lei nº 13.709/2018 — Continuação<\u002Fdiv>\n        <h1>LGPD: Artigos 21 a 30<\u002Fh1>\n        <p style=\"margin-top:8px;max-width:560px\">Encerramento dos Direitos do Titular e o <strong style=\"color:#fff\">Capítulo IV: Tratamento de Dados pelo Poder Público<\u002Fstrong> — regras específicas para órgãos e entidades da administração pública.<\u002Fp>\n        <div class=\"progress-bar\">\n          <span class=\"prog-pill prog-done\">Art. 1–11 ✓<\u002Fspan>\n          <span class=\"prog-pill prog-done\">Art. 12–20 ✓<\u002Fspan>\n          <span class=\"prog-pill prog-now\">Art. 21–30 ← você está aqui<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:220px\">\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">10<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Artigos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">2<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Capítulos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">4<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Exceções ao Poder Público<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">1<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Artigo Vetado<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\" aria-label=\"Artigos 21 a 30\">\n  <ul>\n    <li><a href=\"#a21\">Art. 21 — Dados Irregulares<\u002Fa><\u002Fli>\n    <li><a href=\"#a22\">Art. 22 — Defesa em Juízo<\u002Fa><\u002Fli>\n    <li><a href=\"#a23\">Art. 23 — Poder Público<\u002Fa><\u002Fli>\n    <li><a href=\"#a24\">Art. 24 — Empresas Públicas<\u002Fa><\u002Fli>\n    <li><a href=\"#a25\">Art. 25 — Interoperabilidade<\u002Fa><\u002Fli>\n    <li><a href=\"#a26\">Art. 26 — Uso Compartilhado<\u002Fa><\u002Fli>\n    <li><a href=\"#a27\">Art. 27 — Comunicação<\u002Fa><\u002Fli>\n    <li><a href=\"#a28\">Art. 28 — Vetado<\u002Fa><\u002Fli>\n    <li><a href=\"#a29\">Art. 29 — Órgão Competente<\u002Fa><\u002Fli>\n    <li><a href=\"#a30\">Art. 30 — Registro de Operações<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- ===== CHAPTER DIVIDER: CAP. III ===== -->\n<div style=\"background:linear-gradient(90deg,#6A1B9A,#9C27B0);padding:20px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.15);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Capítulo III<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Dos Direitos do Titular — Conclusão<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Proteção e tutela do titular no exercício de seus direitos<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 21 ============ -->\n<section id=\"a21\" class=\"sec\" data-screen-label=\"Art. 21 — Dados Tratados Irregularmente\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--purple)\">21<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lpurp);color:var(--purple)\">Artigo 21º<\u002Fdiv>\n        <h2>Dados Tratados em Desconformidade com a Lei<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\">\n      <div>\n        <p style=\"margin-bottom:20px\">Os dados pessoais referentes ao <strong>exercício regular de direitos pelo titular<\u002Fstrong> não podem ser utilizados em seu prejuízo.<\u002Fp>\n        <div style=\"background:linear-gradient(135deg,#6A1B9A,#4527A0);border-radius:var(--r);padding:28px;color:#fff;margin-bottom:16px\">\n          <h4 style=\"color:rgba(255,255,255,.7);margin-bottom:8px\">Princípio Fundamental<\u002Fh4>\n          <p style=\"color:rgba(255,255,255,.9);font-size:1rem;line-height:1.6\">O titular que exerce seus <strong style=\"color:#CE93D8\">direitos legalmente previstos<\u002Fstrong> — como solicitação de acesso, correção ou revogação de consentimento — não pode sofrer qualquer <strong style=\"color:#CE93D8\">represália, discriminação ou prejuízo<\u002Fstrong> decorrente desse exercício.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"g2\">\n          <div class=\"card\" style=\"border-left:4px solid var(--red)\">\n            <h3>É Vedado ao Controlador<\u002Fh3>\n            <ul>\n              <li>Negar serviços ao titular por ter revogado consentimento<\u002Fli>\n              <li>Aplicar preços ou condições piores por exercício de direitos<\u002Fli>\n              <li>Usar dados fornecidos para um fim contra o próprio titular<\u002Fli>\n              <li>Criar barreiras para o exercício dos direitos do Art. 18<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"border-left:4px solid var(--green)\">\n            <h3>Garantia ao Titular<\u002Fh3>\n            <p>O exercício pleno dos direitos previstos na LGPD é <strong>inviolável e gratuito<\u002Fstrong>. Qualquer restrição ou penalização configura infração à lei, sujeita às sanções da ANPD.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"background:var(--lpurp);border:none;padding:24px\">\n          <h3 style=\"color:var(--purple);margin-bottom:16px\">Exemplos Práticos<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"background:#fff;border-radius:10px;padding:14px;border-left:3px solid var(--green)\">\n              <h3 style=\"color:var(--green);font-size:.88rem\">Permitido<\u002Fh3>\n              <p style=\"font-size:.83rem\">Empresa encerra contrato por inadimplência após o titular revogar consentimento de dados de crédito — desde que a rescisão tenha causa independente.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border-radius:10px;padding:14px;border-left:3px solid var(--red)\">\n              <h3 style=\"color:var(--red);font-size:.88rem\">Proibido<\u002Fh3>\n              <p style=\"font-size:.83rem\">App eleva tarifas de entrega para usuário que solicitou exclusão de seus dados de perfil comportamental — represália direta ao exercício de direito.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border-radius:10px;padding:14px;border-left:3px solid var(--red)\">\n              <h3 style=\"color:var(--red);font-size:.88rem\">Proibido<\u002Fh3>\n              <p style=\"font-size:.83rem\">Banco nega renovação de crédito e cita internamente que o cliente havia exercido o direito de portabilidade de dados — uso dos dados em prejuízo do titular.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 22 ============ -->\n<section id=\"a22\" class=\"sec\" data-screen-label=\"Art. 22 — Defesa em Juízo\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">22<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 22º<\u002Fdiv>\n        <h2>Defesa dos Direitos dos Titulares em Juízo<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A defesa dos interesses e dos direitos dos titulares de dados poderá ser exercida em juízo, <strong>individual ou coletivamente<\u002Fstrong>, na forma do disposto na legislação pertinente.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <h3>Ação Individual<\u002Fh3>\n        <p>O titular pode ingressar com ação judicial diretamente contra o controlador ou operador que violar seus direitos previstos na LGPD, buscando reparação de danos materiais e morais.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <h3>Ação Coletiva<\u002Fh3>\n        <p>Entidades de defesa do consumidor, associações e o Ministério Público podem propor <strong>ações coletivas<\u002Fstrong> em favor de um conjunto de titulares afetados por violações sistêmicas de dados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <h3>Legislação Aplicável<\u002Fh3>\n        <p>Aplicam-se os instrumentos do <strong>CDC<\u002Fstrong> (defesa coletiva do consumidor), da <strong>LACP<\u002Fstrong> (ação civil pública) e do <strong>CPC<\u002Fstrong>, além das disposições específicas da LGPD.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lred);border-color:var(--red)\">\n      <h4 style=\"color:var(--red)\">Cumulação de Instâncias<\u002Fh4>\n      <p>A tutela judicial não exclui a <strong>via administrativa perante a ANPD<\u002Fstrong>. O titular pode atuar simultaneamente em ambas as frentes — administrativa (ANPD) e judicial — para a proteção de seus dados pessoais.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CHAPTER DIVIDER: CAP. IV ===== -->\n<div class=\"chap-divider\" id=\"cap4\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.15);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Capítulo IV<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Do Tratamento de Dados Pessoais pelo Poder Público<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Regras específicas para órgãos e entidades da administração pública direta e indireta<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 23 ============ -->\n<section id=\"a23\" class=\"sec\" data-screen-label=\"Art. 23 — Tratamento pelo Poder Público\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--gov)\">23<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgov);color:var(--gov)\">Artigo 23º — Poder Público<\u002Fdiv>\n        <h2>Tratamento de Dados pelo Poder Público<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O tratamento de dados pessoais pelos órgãos e entidades do Poder Público deverá ser realizado para o <strong>atendimento de sua finalidade pública<\u002Fstrong>, na persecução do interesse público, com o objetivo de executar competências ou cumprir atribuições legais, desde que:<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:20px\">\n          <div class=\"icard\" style=\"border-left:4px solid var(--gov)\">\n            <div class=\"icard-num\" style=\"background:var(--gov)\">I<\u002Fdiv>\n            <div>\n              <h3>Transparência e Publicidade<\u002Fh3>\n              <p>Sejam informadas as hipóteses em que realizam tratamento de dados, com informações claras e atualizadas sobre <strong>previsão legal, finalidade, procedimentos e práticas<\u002Fstrong>, preferencialmente nos sítios eletrônicos oficiais.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--gov)\">\n            <div class=\"icard-num\" style=\"background:var(--gov)\">III<\u002Fdiv>\n            <div>\n              <h3>Designação de Encarregado (DPO)<\u002Fh3>\n              <p>Seja indicado um <strong>encarregado pelo tratamento de dados pessoais<\u002Fstrong> (DPO), nos termos do art. 39 da LGPD — obrigatório para todos os órgãos e entidades públicas.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cat-h\" style=\"color:var(--gov);border-color:var(--lgov)\">Parágrafos Importantes<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div class=\"dcard\" style=\"border-left:3px solid var(--gov)\">\n            <div class=\"dn\" style=\"color:var(--gov)\">§1º<\u002Fdiv>\n            <div class=\"dt\">Regulamentação da ANPD<\u002Fdiv>\n            <div class=\"dd\">A autoridade nacional poderá dispor sobre as formas de publicidade das operações de tratamento realizadas pelo Poder Público.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"dcard\" style=\"border-left:3px solid var(--gov)\">\n            <div class=\"dn\" style=\"color:var(--gov)\">§2º<\u002Fdiv>\n            <div class=\"dt\">Lei de Acesso à Informação<\u002Fdiv>\n            <div class=\"dd\">A LGPD não dispensa os órgãos públicos de cumprir as obrigações da <strong>Lei nº 12.527/2011 (LAI)<\u002Fstrong> — as duas leis coexistem e se complementam.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"dcard\" style=\"border-left:3px solid var(--gov)\">\n            <div class=\"dn\" style=\"color:var(--gov)\">§3º<\u002Fdiv>\n            <div class=\"dt\">Prazos e Procedimentos Especiais<\u002Fdiv>\n            <div class=\"dd\">Os prazos para exercício dos direitos do titular perante o Poder Público observarão a <strong>Lei do Habeas Data<\u002Fstrong>, a <strong>Lei do Processo Administrativo Federal<\u002Fstrong> e a <strong>LAI<\u002Fstrong>.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"dcard\" style=\"border-left:3px solid var(--amber)\">\n            <div class=\"dn\" style=\"color:var(--amber)\">§4º<\u002Fdiv>\n            <div class=\"dt\">Órgãos Notariais e de Registro<\u002Fdiv>\n            <div class=\"dd\">Os órgãos notariais e de registro exercerão suas atividades de tratamento de dados pessoais de forma independente, em consonância com a LGPD.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:linear-gradient(135deg,#1A237E,#283593);border-radius:var(--r);padding:24px;color:#fff\">\n          <h3 style=\"color:#fff;margin-bottom:16px\">Base Legal para o Poder Público<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"background:rgba(255,255,255,.1);border-radius:10px;padding:14px\">\n              <div style=\"font-size:.75rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Principal<\u002Fdiv>\n              <p style=\"color:#fff;font-size:.9rem\">Execução de <strong style=\"color:#90CAF9\">políticas públicas<\u002Fstrong> e cumprimento de competências legais — não precisa de consentimento do titular.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.1);border-radius:10px;padding:14px\">\n              <div style=\"font-size:.75rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Complementar<\u002Fdiv>\n              <p style=\"color:#fff;font-size:.9rem\">Os demais fundamentos do Art. 7º podem ser utilizados quando a atividade pública demandar, como <strong style=\"color:#90CAF9\">proteção da vida<\u002Fstrong> e <strong style=\"color:#90CAF9\">tutela da saúde<\u002Fstrong>.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.1);border-radius:10px;padding:14px\">\n              <div style=\"font-size:.75rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Vedação<\u002Fdiv>\n              <p style=\"color:#fff;font-size:.9rem\">O Poder Público <strong style=\"color:#EF9A9A\">não pode tratar dados<\u002Fstrong> com fundamento no <strong style=\"color:#EF9A9A\">legítimo interesse<\u002Fstrong> (base privada), nem para fins alheios às suas atribuições legais.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 24 ============ -->\n<section id=\"a24\" class=\"sec\" data-screen-label=\"Art. 24 — Empresas Públicas e Sociedades de Economia Mista\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--gov)\">24<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgov);color:var(--gov)\">Artigo 24º<\u002Fdiv>\n        <h2>Empresas Públicas e Sociedades de Economia Mista<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O regime jurídico aplicável às empresas públicas e sociedades de economia mista depende do <strong>papel que estão desempenhando<\u002Fstrong>:<\u002Fp>\n    <div class=\"g2\">\n      <div style=\"border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)\">\n        <div style=\"background:#1565C0;padding:18px 20px\">\n          <div style=\"font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:4px\">Atuação em Regime de Concorrência<\u002Fdiv>\n          <h3 style=\"color:#fff;font-size:1rem\">Tratamento Igual ao Setor Privado<\u002Fh3>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-radius:0;border-top:none\">\n          <p style=\"margin-bottom:10px\">Quando atuam em <strong>regime de concorrência com o mercado<\u002Fstrong>, sujeitas ao art. 173 da Constituição Federal, recebem o mesmo tratamento das pessoas jurídicas de direito privado.<\u002Fp>\n          <p style=\"font-size:.83rem;color:var(--muted)\">Exemplo: <strong>Banco do Brasil S.A.<\u002Fstrong> atuando como banco comercial concorrente com bancos privados.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)\">\n        <div style=\"background:var(--gov);padding:18px 20px\">\n          <div style=\"font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:4px\">Prestação de Serviços Públicos<\u002Fdiv>\n          <h3 style=\"color:#fff;font-size:1rem\">Tratamento Igual ao Poder Público<\u002Fh3>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-radius:0;border-top:none\">\n          <p style=\"margin-bottom:10px\">Quando estão <strong>operacionalizando políticas públicas ou prestando serviços públicos<\u002Fstrong>, recebem o mesmo tratamento dispensado aos órgãos e entidades do Poder Público.<\u002Fp>\n          <p style=\"font-size:.83rem;color:var(--muted)\">Exemplo: <strong>Caixa Econômica Federal<\u002Fstrong> operando o FGTS ou o Bolsa Família — atividade tipicamente pública.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lgov);border-color:var(--gov)\">\n      <h4 style=\"color:var(--gov)\">Como identificar o regime aplicável?<\u002Fh4>\n      <p>O critério é <strong>funcional<\u002Fstrong>, não formal. O mesmo ente pode estar sujeito a regimes distintos dependendo da atividade concreta que realiza no momento do tratamento dos dados.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 25 ============ -->\n<section id=\"a25\" class=\"sec\" data-screen-label=\"Art. 25 — Interoperabilidade\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">25<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 25º<\u002Fdiv>\n        <h2>Formato Interoperável dos Dados Públicos<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os dados pessoais tratados pelo Poder Público deverão ser mantidos em <strong>formato interoperável e estruturado para o uso compartilhado<\u002Fstrong>, com vistas a:<\u002Fp>\n    <div class=\"g4\">\n      <div class=\"card\" style=\"border-top:4px solid var(--teal);text-align:center\">\n        <div class=\"gov-icon\" style=\"background:var(--teal);margin:0 auto\">◊<\u002Fdiv>\n        <h3>Políticas Públicas<\u002Fh3>\n        <p>Execução eficiente de políticas públicas mediante integração de bases de dados entre órgãos.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--teal);text-align:center\">\n        <div class=\"gov-icon\" style=\"background:var(--teal);margin:0 auto\">◎<\u002Fdiv>\n        <h3>Serviços Públicos<\u002Fh3>\n        <p>Prestação de serviços públicos mais ágeis e integrados, sem exigir do cidadão a repetição de dados já fornecidos ao Estado.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--teal);text-align:center\">\n        <div class=\"gov-icon\" style=\"background:var(--teal);margin:0 auto\">▿<\u002Fdiv>\n        <h3>Descentralização<\u002Fh3>\n        <p>Descentralização da atividade pública e melhoria da eficiência administrativa entre os entes federativos.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--teal);text-align:center\">\n        <div class=\"gov-icon\" style=\"background:var(--teal);margin:0 auto\">■<\u002Fdiv>\n        <h3>Acesso da Sociedade<\u002Fh3>\n        <p>Disseminação e acesso às informações pelo público em geral, em linha com a Lei de Acesso à Informação.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lteal);border-color:var(--teal)\">\n      <h4 style=\"color:var(--teal)\">Interoperabilidade x Proteção de Dados<\u002Fh4>\n      <p>A exigência de interoperabilidade <strong>não autoriza o compartilhamento irrestrito<\u002Fstrong> de dados pessoais entre órgãos. A integração de bases deve sempre respeitar os princípios do Art. 6º, especialmente finalidade, necessidade e segurança.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 26 ============ -->\n<section id=\"a26\" class=\"sec\" data-screen-label=\"Art. 26 — Uso Compartilhado pelo Poder Público\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--gov)\">26<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgov);color:var(--gov)\">Artigo 26º<\u002Fdiv>\n        <h2>Uso Compartilhado de Dados pelo Poder Público<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O uso compartilhado de dados pessoais pelo Poder Público deve atender a <strong>finalidades específicas de execução de políticas públicas<\u002Fstrong> e atribuição legal, respeitados os princípios do Art. 6º da LGPD.<\u002Fp>\n\n    <div class=\"hl\" style=\"background:var(--lred);border-color:var(--red);margin-bottom:24px\">\n      <h4 style=\"color:var(--red)\">Vedação Central — §1º<\u002Fh4>\n      <p>É <strong>vedado ao Poder Público transferir a entidades privadas<\u002Fstrong> dados pessoais constantes de bases de dados públicas, salvo nas exceções previstas em lei.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"traffic\">\n      <div class=\"traffic-deny\">\n        <h3>Transferência Proibida<\u002Fh3>\n        <p style=\"margin-bottom:10px;font-size:.85rem\">Em regra, o Poder Público não pode compartilhar dados com entidades privadas. Exemplos de casos vedados:<\u002Fp>\n        <ul>\n          <li>Venda ou licenciamento de bases de dados públicas a empresas privadas<\u002Fli>\n          <li>Cessão de dados de beneficiários de programas sociais a anunciantes<\u002Fli>\n          <li>Repasse de dados de saúde de servidores a seguradoras<\u002Fli>\n          <li>Compartilhamento de dados para fins meramente comerciais<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"traffic-allow\">\n        <h3>Exceções Permitidas — §1º<\u002Fh3>\n        <p style=\"margin-bottom:10px;font-size:.85rem\">A transferência a entidades privadas é permitida apenas quando:<\u002Fp>\n        <ul>\n          <li><strong>Inciso I<\u002Fstrong> — Execução descentralizada de atividade pública que exija essa transferência, exclusivamente para esse fim específico<\u002Fli>\n          <li><strong>Inciso III<\u002Fstrong> — Os dados forem publicamente acessíveis, respeitadas as disposições da LGPD<\u002Fli>\n          <li><strong>Inciso IV<\u002Fstrong> — Houver previsão legal ou respeitados os princípios da LGPD<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hl\" style=\"background:var(--lgov);border-color:var(--gov)\">\n      <h4 style=\"color:var(--gov)\">Dados de Pessoas Jurídicas — §2º<\u002Fh4>\n      <p>Os dados de <strong>pessoas jurídicas<\u002Fstrong> não são abrangidos pelas restrições de compartilhamento previstas neste artigo. As limitações se aplicam apenas aos dados de <strong>pessoas naturais<\u002Fstrong> (titulares).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 27 ============ -->\n<section id=\"a27\" class=\"sec\" data-screen-label=\"Art. 27 — Comunicação a Entidades Privadas\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--gov)\">27<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgov);color:var(--gov)\">Artigo 27º<\u002Fdiv>\n        <h2>Comunicação de Dados do Poder Público a Entidades Privadas<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A comunicação ou o uso compartilhado de dados pessoais de órgão ou entidade pública a pessoa jurídica de <strong>direito privado<\u002Fstrong> será informado à ANPD e dependerá de <strong>consentimento do titular<\u002Fstrong>, exceto nos seguintes casos:<\u002Fp>\n    <div class=\"g2\" style=\"margin-bottom:20px\">\n      <div class=\"icard\" style=\"border-left:4px solid var(--gov);background:var(--lgov)\">\n        <div class=\"icard-num\" style=\"background:var(--gov)\">I<\u002Fdiv>\n        <div>\n          <h3>Consentimento Dispensado<\u002Fh3>\n          <p>Quando o consentimento for dispensado conforme as hipóteses do Art. 7º da LGPD — por exemplo, cumprimento de obrigação legal ou execução de contrato.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--gov);background:var(--lgov)\">\n        <div class=\"icard-num\" style=\"background:var(--gov)\">II<\u002Fdiv>\n        <div>\n          <h3>Dados Publicamente Acessíveis<\u002Fh3>\n          <p>Quando os dados forem acessíveis ao público em geral, nos termos do inciso III do §1º do Art. 26 da LGPD, observadas as restrições legais aplicáveis.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"background:var(--lgov);border:none\">\n      <h3 style=\"color:var(--gov);margin-bottom:12px\">Fluxo: Comunicação de Dados Público → Privado<\u002Fh3>\n      <div class=\"flow\">\n        <div class=\"flow-step\">\n          <div class=\"flow-icon\" style=\"background:var(--gov)\">1<\u002Fdiv>\n          <div><h3>Identificar a Base Legal<\u002Fh3><p>O órgão público identifica se há base legal para a comunicação (consentimento ou hipótese de dispensa do Art. 7º).<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-step\">\n          <div class=\"flow-icon\" style=\"background:var(--gov)\">2<\u002Fdiv>\n          <div><h3>Informar a ANPD<\u002Fh3><p>A comunicação deve ser informada à Autoridade Nacional de Proteção de Dados previamente ou conforme regulamentação específica.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-step\">\n          <div class=\"flow-icon\" style=\"background:var(--teal)\">3<\u002Fdiv>\n          <div><h3>Verificar o Consentimento<\u002Fh3><p>Se não houver hipótese de dispensa, obter consentimento livre, informado e específico do titular antes da comunicação.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-step\">\n          <div class=\"flow-icon\" style=\"background:var(--green)\">4<\u002Fdiv>\n          <div><h3>Registrar e Monitorar<\u002Fh3><p>Registrar a comunicação realizada e monitorar o cumprimento das condições estabelecidas pela entidade privada receptora.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 28 ============ -->\n<section id=\"a28\" class=\"sec\" data-screen-label=\"Art. 28 — Vetado\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:#9E9E9E\">28<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:#F5F5F5;color:#9E9E9E\">Artigo 28º<\u002Fdiv>\n        <h2 style=\"color:#9E9E9E\">Artigo Vetado<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vetado\">\n      <div class=\"vetado-badge\">VETADO<\u002Fdiv>\n      <h3>Artigo 28 foi vetado pelo Presidente da República<\u002Fh3>\n      <p style=\"max-width:500px;margin:8px auto 0\">Este artigo foi suprimido da lei no momento de sua sanção, por razões de interesse público. Não possui conteúdo vigente na LGPD.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 29 ============ -->\n<section id=\"a29\" class=\"sec\" data-screen-label=\"Art. 29 — Órgão Competente e Fiscalização\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--gov)\">29<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgov);color:var(--gov)\">Artigo 29º<\u002Fdiv>\n        <h2>Fiscalização e Requisição de Informações pela ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A Autoridade Nacional de Proteção de Dados (<strong>ANPD<\u002Fstrong>) poderá solicitar, a qualquer momento, aos agentes de tratamento — inclusive os órgãos públicos — informações específicas sobre o escopo e a natureza dos dados tratados, podendo emitir parecer técnico para garantir o cumprimento desta Lei.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div class=\"icard\" style=\"border-left:4px solid var(--gov)\">\n            <div class=\"icard-num\" style=\"background:var(--gov)\">1<\u002Fdiv>\n            <div>\n              <h3>Solicitação de Informações<\u002Fh3>\n              <p>A ANPD pode requisitar informações sobre tratamentos realizados por órgãos públicos, incluindo finalidade, base legal, volume e categorias de dados tratados.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--gov)\">\n            <div class=\"icard-num\" style=\"background:var(--gov)\">2<\u002Fdiv>\n            <div>\n              <h3>Parecer Técnico<\u002Fh3>\n              <p>A ANPD pode emitir <strong>parecer técnico complementar<\u002Fstrong> para os órgãos públicos quanto à adequação de suas práticas de tratamento de dados às disposições da LGPD.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--gov)\">\n            <div class=\"icard-num\" style=\"background:var(--gov)\">3<\u002Fdiv>\n            <div>\n              <h3>Obrigação de Resposta<\u002Fh3>\n              <p>Os órgãos e entidades públicas têm obrigação de responder às solicitações da ANPD, fornecendo as informações requisitadas dentro dos prazos estabelecidos em regulamento.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"background:var(--lgov);border:none;padding:24px\">\n          <h3 style=\"color:var(--gov);margin-bottom:16px\">ANPD e o Poder Público<\u002Fh3>\n          <p style=\"margin-bottom:14px\">A ANPD exerce papel fundamental de <strong>orientação e fiscalização<\u002Fstrong> sobre as práticas de tratamento de dados pelo Poder Público, assegurando que as garantias dos titulares sejam respeitadas mesmo nas relações Estado-cidadão.<\u002Fp>\n          <ul>\n            <li>Atua com caráter orientativo antes de punitivo<\u002Fli>\n            <li>Pode expedir recomendações de boas práticas<\u002Fli>\n            <li>Estimula a adoção de programas de governança de dados<\u002Fli>\n            <li>Coordena com os órgãos de controle (CGU, TCU)<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 30 ============ -->\n<section id=\"a30\" class=\"sec\" data-screen-label=\"Art. 30 — Registro de Operações de Tratamento\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--gov)\">30<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgov);color:var(--gov)\">Artigo 30º<\u002Fdiv>\n        <h2>Registro das Operações de Tratamento pelo Poder Público<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os órgãos e entidades do Poder Público deverão manter o <strong>registro das operações de tratamento de dados pessoais<\u002Fstrong> que realizam, especialmente quando baseado no legítimo interesse, nos termos de regulamentação da autoridade nacional.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--gov)\">\n        <h3>O que deve ser registrado<\u002Fh3>\n        <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n          <li>Categorias de dados pessoais tratados<\u002Fli>\n          <li>Base legal utilizada para cada tratamento<\u002Fli>\n          <li>Finalidade e prazo de retenção<\u002Fli>\n          <li>Agentes de tratamento envolvidos<\u002Fli>\n          <li>Medidas de segurança adotadas<\u002Fli>\n          <li>Transferências realizadas e seus destinatários<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--gov)\">\n        <h3>Finalidade do Registro<\u002Fh3>\n        <p style=\"margin-bottom:10px\">O registro de operações é instrumento central da <strong>accountability<\u002Fstrong> (prestação de contas), permitindo:<\u002Fp>\n        <ul style=\"display:flex;flex-direction:column;gap:6px\">\n          <li>Demonstrar conformidade com a LGPD<\u002Fli>\n          <li>Facilitar auditorias da ANPD e órgãos de controle<\u002Fli>\n          <li>Subsidiar o Relatório de Impacto (RIPD)<\u002Fli>\n          <li>Responder às requisições dos titulares<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--gov)\">\n        <h3>Regulamentação pela ANPD<\u002Fh3>\n        <p style=\"margin-bottom:10px\">A ANPD definirá em regulamento específico:<\u002Fp>\n        <ul style=\"display:flex;flex-direction:column;gap:6px\">\n          <li>Formato e estrutura do registro<\u002Fli>\n          <li>Periodicidade de atualização<\u002Fli>\n          <li>Nível de detalhe exigido por tipo de operação<\u002Fli>\n          <li>Forma de compartilhamento com a autoridade<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lgov);border-color:var(--gov)\">\n      <h4 style=\"color:var(--gov)\">Conexão com o RIPD<\u002Fh4>\n      <p>O registro de operações de tratamento é o ponto de partida para a elaboração do <strong>Relatório de Impacto à Proteção de Dados Pessoais (RIPD)<\u002Fstrong> — documento que aprofunda a análise de riscos para tratamentos que possam afetar direitos e liberdades fundamentais dos titulares.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"5684445a-dd28-4e08-8dd0-dbc4f8fdf5f4\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei nº 13.709, de 14 de agosto de 2018 — Artigos 21 a 30<\u002Fp>\n  <div style=\"margin-top:14px\">\n    <a href=\"/lgpd/artigos-1-11\">← Art. 1 a 11<\u002Fa>\n    <a href=\"/lgpd/artigos-12-20\">← Art. 12 a 20<\u002Fa>\n  <\u002Fdiv>\n  <p style=\"margin-top:12px;font-size:.72rem;opacity:.45\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\nconst secs = [...document.querySelectorAll('section[id]')];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = secs[0]?.id;\n  secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n  const active = links.find(a => a.getAttribute('href') === '#' + cur);\n  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth', block: 'nearest' });\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
