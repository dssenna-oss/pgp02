  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Simulado LGPD — 15 Questões | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--lblue:#E3F2FD;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --red:#C62828;--lred:#FFEBEE;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;font-size:15px}\n\n/* LAYOUT */\n.wrap{max-width:760px;margin:0 auto;padding:24px}\n\n/* HEADER */\n.quiz-header{background:linear-gradient(135deg,#0D1B4B,#1565C0);color:#fff;padding:40px 24px 32px;text-align:center}\n.quiz-header h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;color:#fff}\n.quiz-header p{color:rgba(255,255,255,.8);margin-top:8px;font-size:.95rem}\n.quiz-meta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:20px}\n.meta-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:6px 16px;font-size:.8rem;color:rgba(255,255,255,.9);font-weight:600}\n\n/* PROGRESS */\n.progress-wrap{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;position:sticky;top:0;z-index:50}\n.progress-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}\n.progress-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}\n.progress-bar-fill{height:100%;background:linear-gradient(90deg,#1565C0,#00897B);border-radius:3px;transition:width .4s}\n.progress-label{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}\n\n/* QUESTION CARD */\n.q-card{background:var(--card);border-radius:var(--r);padding:28px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:20px;display:none}\n.q-card.active{display:block}\n.q-num{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:8px}\n.q-text{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.4}\n.q-ref{font-size:.75rem;color:var(--muted);margin-bottom:20px;font-style:italic}\n.q-options{display:flex;flex-direction:column;gap:10px}\n\n/* OPTION */\n.option{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;border:2px solid var(--border);cursor:pointer;transition:all .2s;background:var(--card)}\n.option:hover{border-color:var(--blue);background:var(--lblue)}\n.option.selected{border-color:var(--blue);background:var(--lblue)}\n.option.correct{border-color:var(--green);background:var(--lgreen);cursor:default}\n.option.wrong{border-color:var(--red);background:var(--lred);cursor:default}\n.option.disabled{cursor:default;opacity:.7}\n.opt-circle{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:var(--muted);transition:all .2s}\n.option.selected .opt-circle{background:var(--blue);border-color:var(--blue);color:#fff}\n.option.correct .opt-circle{background:var(--green);border-color:var(--green);color:#fff}\n.option.wrong .opt-circle{background:var(--red);border-color:var(--red);color:#fff}\n.opt-text{font-size:.92rem;color:var(--text);padding-top:3px;line-height:1.4}\n\n/* FEEDBACK */\n.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:10px;border-left:4px solid;font-size:.88rem}\n.feedback.show{display:block}\n.feedback.ok{background:var(--lgreen);border-color:var(--green)}\n.feedback.err{background:var(--lred);border-color:var(--red)}\n.feedback h4{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}\n.feedback.ok h4{color:var(--green)}\n.feedback.err h4{color:var(--red)}\n.feedback p{color:var(--text);font-size:.85rem}\n\n/* BUTTONS */\n.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;border-radius:40px;font-size:.9rem;font-weight:700;border:none;cursor:pointer;transition:all .2s}\n.btn-primary{background:var(--blue);color:#fff}\n.btn-primary:hover{background:#1251a0}\n.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}\n.btn-outline{background:transparent;border:2px solid var(--blue);color:var(--blue)}\n.btn-outline:hover{background:var(--lblue)}\n.btn-wrap{display:flex;justify-content:flex-end;margin-top:20px;gap:10px}\n\n/* RESULT SCREEN */\n#result-screen{display:none;text-align:center;padding:40px 24px}\n.result-circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 4px 24px rgba(0,0,0,.12)}\n.result-score{font-size:2.2rem;font-weight:800;color:#fff;line-height:1}\n.result-label{font-size:.75rem;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.06em}\n.result-title{font-size:1.4rem;font-weight:800;margin-bottom:8px}\n.result-sub{color:var(--muted);font-size:.92rem;margin-bottom:28px}\n.result-detail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:400px;margin:0 auto 32px}\n.rdet{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--sh);border:1px solid var(--border)}\n.rdet-n{font-size:1.4rem;font-weight:800}\n.rdet-l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}\n\n/* INTRO SCREEN */\n#intro-screen{text-align:center;padding:40px 24px}\n#intro-screen h2{font-size:1.5rem;font-weight:800;margin-bottom:12px}\n.topic-list{display:flex;flex-direction:column;gap:8px;max-width:480px;margin:24px auto;text-align:left}\n.topic-item{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border-radius:10px;border:1px solid var(--border);font-size:.88rem}\n.topic-dot{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff}\n\nfooter{background:var(--navy);color:rgba(255,255,255,.55);text-align:center;padding:20px;font-size:.78rem}\nfooter a{color:rgba(255,255,255,.4);text-decoration:none;margin:0 6px}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<div class=\"quiz-header\">\n  <img src=\"0df67e37-aed4-42e6-829f-1ddbc10e5432\" alt=\"Clube do Servidor\" style=\"height:48px;border-radius:4px;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto\">\n  <h1>Simulado LGPD — 15 Questões<\u002Fh1>\n  <p>Lei Geral de Proteção de Dados — Lei nº 13.709/2018<\u002Fp>\n  <div class=\"quiz-meta\">\n    <span class=\"meta-pill\">15 Questões<\u002Fspan>\n    <span class=\"meta-pill\">Múltipla Escolha<\u002Fspan>\n    <span class=\"meta-pill\">Gabarito Comentado<\u002Fspan>\n    <span class=\"meta-pill\">Cobrança: Art. 1 ao 65<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PROGRESS BAR -->\n<div class=\"progress-wrap\" id=\"progress-section\" style=\"display:none\">\n  <div class=\"progress-inner\">\n    <div class=\"progress-bar-bg\"><div class=\"progress-bar-fill\" id=\"prog-fill\" style=\"width:0%\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"progress-label\" id=\"prog-label\">0 / 15<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"wrap\">\n\n  <!-- INTRO -->\n  <div id=\"intro-screen\">\n    <p style=\"color:var(--muted);font-size:.95rem;max-width:500px;margin:0 auto 4px\">Teste seus conhecimentos sobre todos os artigos da LGPD. O simulado cobre os seguintes temas:<\u002Fp>\n    <div class=\"topic-list\">\n      <div class=\"topic-item\"><div class=\"topic-dot\" style=\"background:#1565C0\">1<\u002Fdiv>Fundamentos, definições e princípios (Art. 1–6)<\u002Fdiv>\n      <div class=\"topic-item\"><div class=\"topic-dot\" style=\"background:#00695C\">2<\u002Fdiv>Bases legais, consentimento e dados sensíveis (Art. 7–11)<\u002Fdiv>\n      <div class=\"topic-item\"><div class=\"topic-dot\" style=\"background:#E65100\">3<\u002Fdiv>Crianças, término e direitos do titular (Art. 14–20)<\u002Fdiv>\n      <div class=\"topic-item\"><div class=\"topic-dot\" style=\"background:#C62828\">4<\u002Fdiv>Poder Público e transferência internacional (Art. 23–36)<\u002Fdiv>\n      <div class=\"topic-item\"><div class=\"topic-dot\" style=\"background:#6A1B9A\">5<\u002Fdiv>Agentes, responsabilidade e segurança (Art. 37–50)<\u002Fdiv>\n      <div class=\"topic-item\"><div class=\"topic-dot\" style=\"background:#004D40\">6<\u002Fdiv>Sanções, ANPD e disposições finais (Art. 52–65)<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn btn-primary\" style=\"margin-top:8px;padding:14px 40px;font-size:1rem\" onclick=\"startQuiz()\">Iniciar Simulado<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- QUESTIONS -->\n  <div id=\"quiz-body\" style=\"display:none\">\n\n    <!-- Q1 -->\n    <div class=\"q-card active\" data-q=\"1\">\n      <div class=\"q-num\">Questão 1 de 15<\u002Fdiv>\n      <div class=\"q-text\">De acordo com o Art. 1º da LGPD, a lei tem como objetivo proteger quais direitos fundamentais da pessoa natural?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 1º — Objeto e Finalidade<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,1,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Apenas o direito de propriedade intelectual sobre os próprios dados<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,1,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Os direitos fundamentais de liberdade e de privacidade, e o livre desenvolvimento da personalidade<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,1,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Apenas os direitos trabalhistas relacionados ao uso de dados no ambiente de trabalho<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,1,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Os direitos de expressão e comunicação em meios digitais<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"b\">\n        <h4>✓ Correto — Alternativa B<\u002Fh4>\n        <p>O Art. 1º estabelece que a LGPD tem como objetivo proteger os <strong>direitos fundamentais de liberdade e de privacidade<\u002Fstrong> e o livre desenvolvimento da personalidade da pessoa natural — indo além dos dados digitais, abrangendo qualquer meio de tratamento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q2 -->\n    <div class=\"q-card\" data-q=\"2\">\n      <div class=\"q-num\">Questão 2 de 15<\u002Fdiv>\n      <div class=\"q-text\">Quantos são os fundamentos da disciplina de proteção de dados pessoais previstos no Art. 2º da LGPD?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 2º — Fundamentos<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,2,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">5 fundamentos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,2,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">6 fundamentos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,2,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">7 fundamentos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,2,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">10 fundamentos<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O Art. 2º lista <strong>7 fundamentos<\u002Fstrong>: (I) respeito à privacidade; (II) autodeterminação informativa; (III) liberdade de expressão; (IV) inviolabilidade da intimidade; (V) desenvolvimento econômico e tecnológico; (VI) livre iniciativa e defesa do consumidor; (VII) direitos humanos e cidadania.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q3 -->\n    <div class=\"q-card\" data-q=\"3\">\n      <div class=\"q-num\">Questão 3 de 15<\u002Fdiv>\n      <div class=\"q-text\">Qual das alternativas abaixo NÃO é considerada dado pessoal sensível conforme o Art. 5º, inciso II da LGPD?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 5º, II — Definições<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,3,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Dado biométrico utilizado para identificação<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,3,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Endereço residencial do titular<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,3,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Convicção religiosa<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,3,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Dado referente à saúde do titular<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"b\">\n        <h4>✓ Correto — Alternativa B<\u002Fh4>\n        <p>O <strong>endereço residencial<\u002Fstrong> é um dado pessoal comum, não sensível. Dados sensíveis são os que envolvem: origem racial/étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou biométrico.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q4 -->\n    <div class=\"q-card\" data-q=\"4\">\n      <div class=\"q-num\">Questão 4 de 15<\u002Fdiv>\n      <div class=\"q-text\">Qual princípio do Art. 6º da LGPD determina que o tratamento de dados deve ser limitado ao mínimo necessário para a realização de suas finalidades?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 6º — Princípios<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,4,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Finalidade<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,4,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Adequação<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,4,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Necessidade<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,4,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Transparência<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O princípio da <strong>Necessidade<\u002Fstrong> (Art. 6º, III) determina a limitação do tratamento ao mínimo necessário para a realização de suas finalidades, com abrangência dos dados pertinentes, proporcionais e não excessivos em relação às finalidades do tratamento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q5 -->\n    <div class=\"q-card\" data-q=\"5\">\n      <div class=\"q-num\">Questão 5 de 15<\u002Fdiv>\n      <div class=\"q-text\">Quantas hipóteses (bases legais) para tratamento de dados pessoais estão previstas no Art. 7º da LGPD?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 7º — Hipóteses de Tratamento<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,5,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">7 hipóteses<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,5,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">8 hipóteses<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,5,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">9 hipóteses<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,5,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">10 hipóteses<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"d\">\n        <h4>✓ Correto — Alternativa D<\u002Fh4>\n        <p>O Art. 7º lista <strong>10 bases legais<\u002Fstrong>: consentimento, obrigação legal, políticas públicas, pesquisa, contrato, exercício de direitos, proteção da vida, tutela da saúde, interesses legítimos e proteção do crédito.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q6 -->\n    <div class=\"q-card\" data-q=\"6\">\n      <div class=\"q-num\">Questão 6 de 15<\u002Fdiv>\n      <div class=\"q-text\">De acordo com o Art. 8º, a quem cabe o ônus da prova de que o consentimento foi obtido em conformidade com a LGPD?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 8º — Validade do Consentimento<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,6,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Ao titular dos dados pessoais<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,6,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Ao controlador<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,6,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Ao operador<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,6,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">À Agência Nacional de Proteção de Dados (ANPD)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"b\">\n        <h4>✓ Correto — Alternativa B<\u002Fh4>\n        <p>Segundo o Art. 8º, §2º, cabe ao <strong>controlador<\u002Fstrong> o ônus da prova de que o consentimento foi obtido em conformidade com a lei. Essa regra protege o titular, que não precisa provar que não consentiu.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q7 -->\n    <div class=\"q-card\" data-q=\"7\">\n      <div class=\"q-num\">Questão 7 de 15<\u002Fdiv>\n      <div class=\"q-text\">Para o tratamento de dados pessoais sensíveis baseado no consentimento, a LGPD exige que ele seja:<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 11 — Dados Pessoais Sensíveis<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,7,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Genérico, podendo cobrir múltiplas finalidades não especificadas<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,7,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Específico e em destaque, para finalidade determinada<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,7,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Verbal, desde que registrado em ata<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,7,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Tácito, quando o titular não se manifestar contra o tratamento<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"b\">\n        <h4>✓ Correto — Alternativa B<\u002Fh4>\n        <p>O Art. 11, I exige para dados sensíveis o consentimento do titular ou responsável legal, de forma <strong>específica e em destaque<\u002Fstrong>, para finalidade específica — requisito mais rigoroso do que para dados pessoais comuns.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q8 -->\n    <div class=\"q-card\" data-q=\"8\">\n      <div class=\"q-num\">Questão 8 de 15<\u002Fdiv>\n      <div class=\"q-text\">O Art. 14 da LGPD determina que o tratamento de dados pessoais de crianças deve ser realizado no melhor interesse do menor. Para tanto, o consentimento deve ser fornecido por:<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 14 — Crianças e Adolescentes<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,8,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Pela própria criança, se tiver mais de 12 anos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,8,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Por qualquer familiar de primeiro grau<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,8,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Por ao menos um dos pais ou pelo responsável legal<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,8,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Pelo diretor da escola ou responsável pela instituição frequentada<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O Art. 14, §1º determina que o tratamento de dados de crianças deve ter o consentimento <strong>específico e em destaque de ao menos um dos pais ou pelo responsável legal<\u002Fstrong>. O controlador deve empregar todos os esforços razoáveis para verificar esse consentimento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q9 -->\n    <div class=\"q-card\" data-q=\"9\">\n      <div class=\"q-num\">Questão 9 de 15<\u002Fdiv>\n      <div class=\"q-text\">Quantos direitos estão listados no caput do Art. 18 da LGPD, que o titular pode exercer a qualquer momento mediante requisição ao controlador?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 18 — Direitos do Titular<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,9,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">7 direitos (incisos I ao VII)<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,9,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">8 direitos (incisos I ao VIII)<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,9,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">9 direitos (incisos I ao IX)<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,9,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">10 direitos (incisos I ao X)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O Art. 18 lista <strong>9 direitos<\u002Fstrong>: (I) confirmação da existência; (II) acesso; (III) correção; (IV) anonimização/bloqueio/eliminação; (V) portabilidade; (VI) eliminação (com consentimento); (VII) informação sobre compartilhamento; (VIII) informação sobre não consentir; (IX) revogação do consentimento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q10 -->\n    <div class=\"q-card\" data-q=\"10\">\n      <div class=\"q-num\">Questão 10 de 15<\u002Fdiv>\n      <div class=\"q-text\">Qual é o prazo máximo para que o controlador forneça ao titular uma declaração clara e completa sobre seus dados, incluindo origem, critérios e finalidade do tratamento (Art. 19)?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 19 — Prazo de Resposta<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,10,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">7 dias corridos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,10,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">10 dias úteis<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,10,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">15 dias corridos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,10,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">30 dias corridos<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O Art. 19, II prevê o prazo de <strong>até 15 (quinze) dias<\u002Fstrong> corridos contados da data do requerimento do titular para fornecimento de declaração clara e completa. O acesso em formato simplificado deve ser providenciado imediatamente.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q11 -->\n    <div class=\"q-card\" data-q=\"11\">\n      <div class=\"q-num\">Questão 11 de 15<\u002Fdiv>\n      <div class=\"q-text\">O Art. 23 da LGPD estabelece que o tratamento de dados pelo Poder Público deve ser realizado para atendimento de sua finalidade pública. Qual das alternativas abaixo representa uma base legal VEDADA ao Poder Público?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 23 — Tratamento pelo Poder Público<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,11,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Execução de políticas públicas previstas em lei<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,11,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Cumprimento de atribuições legais do serviço público<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,11,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Legítimo interesse do órgão público<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,11,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Obrigação legal ou regulatória<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O <strong>legítimo interesse<\u002Fstrong> é uma base legal privada (Art. 7º, IX) que não pode ser invocada pelo Poder Público. O tratamento público deve estar sempre fundamentado em finalidade pública explícita, atribuição legal ou política pública — nunca em interesse meramente institucional.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q12 -->\n    <div class=\"q-card\" data-q=\"12\">\n      <div class=\"q-num\">Questão 12 de 15<\u002Fdiv>\n      <div class=\"q-text\">Segundo o Art. 39, §1º da LGPD, qual das opções NÃO é uma atribuição prevista para o Encarregado pelo Tratamento de Dados (DPO)?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 39 — Encarregado (DPO)<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,12,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Aceitar reclamações dos titulares e prestar esclarecimentos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,12,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Aplicar multas e sanções administrativas aos infratores internos<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,12,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Receber comunicações da ANPD e adotar providências<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,12,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Orientar os funcionários sobre práticas de proteção de dados<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"b\">\n        <h4>✓ Correto — Alternativa B<\u002Fh4>\n        <p><strong>Aplicar sanções administrativas<\u002Fstrong> não é atribuição do DPO — compete exclusivamente à <strong>ANPD<\u002Fstrong>. O encarregado é um canal de comunicação e orientação, não um agente punitivo. Suas atribuições são: atender reclamações, receber comunicações da ANPD e orientar colaboradores.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q13 -->\n    <div class=\"q-card\" data-q=\"13\">\n      <div class=\"q-num\">Questão 13 de 15<\u002Fdiv>\n      <div class=\"q-text\">O Art. 43 da LGPD estabelece os excludentes de responsabilidade dos agentes de tratamento. Qual das alternativas abaixo NÃO está entre eles?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 43 — Excludentes de Responsabilidade<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,13,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Provar que não realizou o tratamento de dados que lhe é atribuído<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,13,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Provar que o dano decorreu de culpa exclusiva do titular ou de terceiro<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,13,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Demonstrar que não obteve vantagem econômica com o tratamento irregular<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,13,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Provar que, embora tenha realizado o tratamento, não houve violação à legislação<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>\"Não ter obtido vantagem econômica\" <strong>não é excludente de responsabilidade<\u002Fstrong> na LGPD. Os três excludentes do Art. 43 são: (I) não realizou o tratamento; (II) realizou o tratamento, mas não houve violação; (III) o dano decorreu exclusivamente de culpa do titular ou de terceiro.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q14 -->\n    <div class=\"q-card\" data-q=\"14\">\n      <div class=\"q-num\">Questão 14 de 15<\u002Fdiv>\n      <div class=\"q-text\">Conforme o Art. 52, inciso II da LGPD, qual é o valor máximo da multa simples que pode ser aplicada pela ANPD por infração à Lei?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 52 — Sanções Administrativas<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,14,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">R$ 10.000.000,00 (dez milhões de reais) por infração<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,14,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">R$ 20.000.000,00 (vinte milhões de reais) por infração<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,14,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">R$ 50.000.000,00 (cinquenta milhões de reais) por infração<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,14,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">R$ 100.000.000,00 (cem milhões de reais) por infração<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>O Art. 52, II prevê multa simples de <strong>até 2% do faturamento da pessoa jurídica no Brasil<\u002Fstrong> no último exercício fiscal, excluídos os tributos, limitada a <strong>R$ 50.000.000,00 (cinquenta milhões de reais) por infração<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q15 -->\n    <div class=\"q-card\" data-q=\"15\">\n      <div class=\"q-num\">Questão 15 de 15<\u002Fdiv>\n      <div class=\"q-text\">Qual órgão é responsável por zelar, implementar e fiscalizar o cumprimento da LGPD em todo o território nacional, conforme o Art. 5º, XIX e o Capítulo VIII da lei?<\u002Fdiv>\n      <div class=\"q-ref\">Referência: Art. 5º XIX e Art. 55-J — ANPD<\u002Fdiv>\n      <div class=\"q-options\">\n        <div class=\"option\" onclick=\"select(this,15,'a')\"><div class=\"opt-circle\">A<\u002Fdiv><div class=\"opt-text\">Ministério da Justiça e Segurança Pública<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,15,'b')\"><div class=\"opt-circle\">B<\u002Fdiv><div class=\"opt-text\">Conselho Nacional de Proteção de Dados (CNPD)<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,15,'c')\"><div class=\"opt-circle\">C<\u002Fdiv><div class=\"opt-text\">Agência Nacional de Proteção de Dados (ANPD)<\u002Fdiv><\u002Fdiv>\n        <div class=\"option\" onclick=\"select(this,15,'d')\"><div class=\"opt-circle\">D<\u002Fdiv><div class=\"opt-text\">Secretaria Nacional do Consumidor (SENACON)<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feedback\" data-correct=\"c\">\n        <h4>✓ Correto — Alternativa C<\u002Fh4>\n        <p>A <strong>ANPD (Agência Nacional de Proteção de Dados)<\u002Fstrong> é o órgão definido pelo Art. 5º, XIX como responsável por zelar, implementar e fiscalizar a LGPD. O CNPD (alternativa B) é apenas consultivo — sem poder sancionador.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- BOTÃO NAVEGAÇÃO -->\n    <div class=\"btn-wrap\">\n      <button class=\"btn btn-primary\" id=\"btn-next\" onclick=\"next()\" disabled=\"\">Próxima questão →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- RESULTADO -->\n  <div id=\"result-screen\">\n    <div class=\"result-circle\" id=\"result-circle\">\n      <div class=\"result-score\" id=\"result-score\"><\u002Fdiv>\n      <div class=\"result-label\">de 15<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"result-title\" id=\"result-title\"><\u002Fdiv>\n    <div class=\"result-sub\" id=\"result-sub\"><\u002Fdiv>\n    <div class=\"result-detail\">\n      <div class=\"rdet\"><div class=\"rdet-n\" id=\"res-correct\" style=\"color:var(--green)\"><\u002Fdiv><div class=\"rdet-l\">Acertos<\u002Fdiv><\u002Fdiv>\n      <div class=\"rdet\"><div class=\"rdet-n\" id=\"res-wrong\" style=\"color:var(--red)\"><\u002Fdiv><div class=\"rdet-l\">Erros<\u002Fdiv><\u002Fdiv>\n      <div class=\"rdet\"><div class=\"rdet-n\" id=\"res-pct\" style=\"color:var(--blue)\"><\u002Fdiv><div class=\"rdet-l\">Aproveitamento<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n      <button class=\"btn btn-primary\" onclick=\"restart()\">Refazer Simulado<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- /wrap -->\n\n<footer>\n  <p>Simulado LGPD — Clube do Servidor &nbsp;|&nbsp;\n    <a href=\"/lgpd/artigos-1-11\">Vol. 1<\u002Fa>\n    <a href=\"/lgpd/artigos-12-20\">Vol. 2<\u002Fa>\n    <a href=\"/lgpd/artigos-21-30\">Vol. 3<\u002Fa>\n    <a href=\"/lgpd/artigos-31-40\">Vol. 4<\u002Fa>\n    <a href=\"/lgpd/artigos-41-50\">Vol. 5<\u002Fa>\n    <a href=\"/lgpd/artigos-51-65\">Vol. 6<\u002Fa>\n  <\u002Fp>\n<\u002Ffooter>\n\n<script>\nconst TOTAL = 15;\nlet current = 1;\nlet score = 0;\nlet answered = new Array(TOTAL + 1).fill(false);\n\nconst CORRECT = {\n  1:'b', 2:'c', 3:'b', 4:'c', 5:'d',\n  6:'b', 7:'b', 8:'c', 9:'c', 10:'c',\n  11:'c', 12:'b', 13:'c', 14:'c', 15:'c'\n};\n\nfunction startQuiz() {\n  document.getElementById('intro-screen').style.display = 'none';\n  document.getElementById('quiz-body').style.display = 'block';\n  document.getElementById('progress-section').style.display = 'block';\n  updateProgress();\n}\n\nfunction select(el, qNum, letter) {\n  if (answered[qNum]) return;\n  answered[qNum] = true;\n\n  const card = el.closest('.q-card');\n  const correct = CORRECT[qNum];\n  const allOpts = card.querySelectorAll('.option');\n\n  // Mark all options\n  allOpts.forEach(opt => {\n    opt.classList.add('disabled');\n    opt.onclick = null;\n  });\n\n  // Mark correct in green\n  allOpts.forEach(opt => {\n    const optLetter = opt.querySelector('.opt-circle').textContent.toLowerCase();\n    if (optLetter === correct) opt.classList.add('correct');\n  });\n\n  // Mark selected (wrong if incorrect)\n  if (letter !== correct) {\n    el.classList.add('wrong');\n  } else {\n    score++;\n  }\n\n  // Show feedback\n  const fb = card.querySelector('.feedback');\n  fb.classList.add('show');\n  if (letter === correct) {\n    fb.classList.add('ok');\n    fb.querySelector('h4').textContent = '✓ Correto!';\n  } else {\n    fb.classList.add('err');\n    fb.querySelector('h4').textContent = '✗ Incorreto';\n  }\n\n  // Enable next button\n  const btn = document.getElementById('btn-next');\n  btn.disabled = false;\n  if (qNum === TOTAL) btn.textContent = 'Ver Resultado →';\n\n  updateProgress();\n}\n\nfunction next() {\n  if (current >= TOTAL) {\n    showResult();\n    return;\n  }\n  // Hide current, show next\n  document.querySelector(`.q-card[data-q=\"${current}\"]`).classList.remove('active');\n  current++;\n  document.querySelector(`.q-card[data-q=\"${current}\"]`).classList.add('active');\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n\n  const btn = document.getElementById('btn-next');\n  btn.disabled = true;\n  btn.textContent = current === TOTAL ? 'Ver Resultado →' : 'Próxima questão →';\n\n  updateProgress();\n}\n\nfunction updateProgress() {\n  const done = Object.values(answered).filter(Boolean).length;\n  const pct = Math.round((done / TOTAL) * 100);\n  document.getElementById('prog-fill').style.width = pct + '%';\n  document.getElementById('prog-label').textContent = done + ' / ' + TOTAL;\n}\n\nfunction showResult() {\n  document.getElementById('quiz-body').style.display = 'none';\n  document.getElementById('progress-section').style.display = 'none';\n  const rs = document.getElementById('result-screen');\n  rs.style.display = 'block';\n\n  const pct = Math.round((score / TOTAL) * 100);\n  document.getElementById('result-score').textContent = score;\n  document.getElementById('res-correct').textContent = score;\n  document.getElementById('res-wrong').textContent = TOTAL - score;\n  document.getElementById('res-pct').textContent = pct + '%';\n\n  let color, title, sub;\n  if (pct >= 90)      { color='linear-gradient(135deg,#2E7D32,#43A047)'; title='Excelente!'; sub='Domínio avançado da LGPD. Parabéns!'; }\n  else if (pct >= 70) { color='linear-gradient(135deg,#1565C0,#1976D2)'; title='Muito Bom!'; sub='Bom conhecimento — revise os pontos errados.'; }\n  else if (pct >= 50) { color='linear-gradient(135deg,#E65100,#F57C00)'; title='Regular'; sub='Você está no caminho certo — continue estudando!'; }\n  else                { color='linear-gradient(135deg,#C62828,#D32F2F)'; title='Precisa Estudar Mais'; sub='Revise os volumes da série LGPD e tente novamente.'; }\n\n  document.getElementById('result-circle').style.background = color;\n  document.getElementById('result-title').textContent = title;\n  document.getElementById('result-sub').textContent = sub;\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nfunction restart() {\n  current = 1; score = 0;\n  answered = new Array(TOTAL + 1).fill(false);\n\n  document.querySelectorAll('.q-card').forEach(c => {\n    c.classList.remove('active');\n    c.querySelectorAll('.option').forEach(o => {\n      o.classList.remove('correct','wrong','selected','disabled');\n      const letter = o.querySelector('.opt-circle').textContent.toLowerCase();\n      o.onclick = function(){ select(o, parseInt(c.dataset.q), letter); };\n    });\n    const fb = c.querySelector('.feedback');\n    fb.classList.remove('show','ok','err');\n    fb.querySelector('h4').textContent = '✓ Correto!';\n  });\n\n  document.querySelector('.q-card[data-q=\"1\"]').classList.add('active');\n  document.getElementById('result-screen').style.display = 'none';\n  document.getElementById('quiz-body').style.display = 'block';\n  document.getElementById('progress-section').style.display = 'block';\n\n  const btn = document.getElementById('btn-next');\n  btn.disabled = true;\n  btn.textContent = 'Próxima questão →';\n  updateProgress();\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
