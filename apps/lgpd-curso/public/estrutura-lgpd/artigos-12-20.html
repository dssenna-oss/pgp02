  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>LGPD — Artigos 12 a 20 | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--blue2:#1976D2;--lblue:#E3F2FD;--lblue2:#BBDEFB;\n  --teal:#00695C;--lteal:#E0F2F1;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --red:#C62828;--lred:#FFEBEE;\n  --purple:#6A1B9A;--lpurp:#F3E5F5;\n  --indigo:#283593;--lindigo:#E8EAF6;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}\nh1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2}\nh2{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;line-height:1.3}\nh3{font-size:1rem;font-weight:700;line-height:1.4}\nh4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\np{color:var(--muted)}\nstrong{color:var(--text);font-weight:600}\nul{padding-left:18px;color:var(--muted)}\nli+li{margin-top:5px}\n\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n.sec{padding:56px 0}\n.sec:nth-child(odd){background:#fff}\n.sec:nth-child(even){background:var(--bg)}\n\n.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}\n.art-num{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:#fff}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:5px}\n\n.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}\n.tcol{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}\n\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.icard{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}\n.icard-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff}\n.dcard{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05)}\n.dcard .dn{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}\n.dcard .dt{font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--text)}\n.dcard .dd{font-size:.8rem;color:var(--muted)}\n\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n\n.cat-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:2px solid;margin:24px 0 12px}\n\n/* Right card (Art. 18) */\n.right-card{border-radius:var(--r);padding:20px;color:#fff;box-shadow:var(--sh)}\n.right-card h3{color:#fff;margin-bottom:6px}\n.right-card p{color:rgba(255,255,255,.85);font-size:.88rem}\n.right-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);font-size:.8rem;font-weight:800;margin-bottom:10px}\n\n/* Process flow */\n.flow{display:flex;flex-direction:column;gap:0}\n.flow-step{display:flex;gap:16px;align-items:flex-start;padding:14px 0}\n.flow-step+.flow-step{border-top:1px solid var(--border)}\n.flow-icon{flex-shrink:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff}\n.flow-arrow{flex-shrink:0;width:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.2rem}\n\n/* Timeline */\n.timeline{position:relative;padding-left:32px}\n.timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--border)}\n.tl-item{position:relative;margin-bottom:20px}\n.tl-dot{position:absolute;left:-32px;top:2px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff}\n.tl-item h3{margin-bottom:4px}\n\n/* Intro banner */\n.intro-band{background:linear-gradient(135deg,#0D1B4B 0%,#283593 100%);color:#fff;padding:48px 0}\n.intro-band h1{color:#fff}\n.intro-band p{color:rgba(255,255,255,.8)}\n.progress-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:24px}\n.prog-pill{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700;cursor:default}\n.prog-done{background:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}\n.prog-now{background:#fff;color:var(--navy)}\n\n/* Header */\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n\n/* Nav */\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--indigo);color:#fff}\n\n/* Para menores badge */\n.alert-badge{display:inline-flex;align-items:center;gap:8px;background:var(--lamber);border:2px solid var(--amber);border-radius:10px;padding:10px 16px;margin-bottom:20px;font-weight:700;color:var(--amber);font-size:.9rem}\n\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\n\n@media(max-width:680px){\n  .tcol{grid-template-columns:1fr}\n  .right-grid{grid-template-columns:1fr!important}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"c90d4c66-3ffc-4920-aa70-71c4d0a8b46d\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- INTRO BANNER -->\n<section class=\"intro-band\">\n  <div class=\"wrap\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;flex-wrap:wrap\">\n      <div>\n        <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Lei nº 13.709/2018 — Continuação<\u002Fdiv>\n        <h1>LGPD: Artigos 12 a 20<\u002Fh1>\n        <p style=\"margin-top:8px;max-width:540px\">Anonimização, pesquisa, proteção de crianças, término do tratamento e — em destaque — o <strong style=\"color:#fff\">catálogo completo dos direitos do titular<\u002Fstrong> de dados.<\u002Fp>\n        <div class=\"progress-bar\">\n          <span class=\"prog-pill prog-done\">Art. 1–11 ✓<\u002Fspan>\n          <span class=\"prog-pill prog-now\">Art. 12–20 ← você está aqui<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:220px\">\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">9<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Artigos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">9<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Direitos do Titular<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">4<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Hipóteses de Término<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">15<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Dias p/ resposta<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\" aria-label=\"Artigos 12 a 20\">\n  <ul>\n    <li><a href=\"#a12\">Art. 12 — Anonimização<\u002Fa><\u002Fli>\n    <li><a href=\"#a13\">Art. 13 — Pesquisa<\u002Fa><\u002Fli>\n    <li><a href=\"#a14\">Art. 14 — Crianças<\u002Fa><\u002Fli>\n    <li><a href=\"#a15\">Art. 15 — Término<\u002Fa><\u002Fli>\n    <li><a href=\"#a16\">Art. 16 — Conservação<\u002Fa><\u002Fli>\n    <li><a href=\"#a17\">Art. 17 — Titularidade<\u002Fa><\u002Fli>\n    <li><a href=\"#a18\">Art. 18 — Direitos<\u002Fa><\u002Fli>\n    <li><a href=\"#a19\">Art. 19 — Prazo<\u002Fa><\u002Fli>\n    <li><a href=\"#a20\">Art. 20 — Decisões Automatizadas<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- ============ ART. 12 ============ -->\n<section id=\"a12\" class=\"sec\" data-screen-label=\"Art. 12 — Dados Anonimizados\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--blue)\">12<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue)\">Artigo 12º<\u002Fdiv>\n        <h2>Dados Anonimizados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os dados anonimizados não são considerados dados pessoais para os fins da LGPD — <strong>salvo quando o processo de anonimização puder ser revertido.<\u002Fstrong><\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"g2\" style=\"margin-bottom:16px\">\n          <div class=\"card\" style=\"border-top:3px solid var(--blue)\">\n            <h3>Regra Geral<\u002Fh3>\n            <p>Dado anonimizado <strong>não é dado pessoal<\u002Fstrong> e, portanto, não está sujeito à LGPD, desde que a anonimização seja efetiva e irreversível.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n            <h3>Exceção — Reversibilidade<\u002Fh3>\n            <p>Se a anonimização <strong>puder ser revertida<\u002Fstrong> usando meios técnicos razoáveis, o dado volta a ser considerado dado pessoal e se sujeita à LGPD.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lpurp);border-color:var(--purple)\">\n          <h4 style=\"color:var(--purple)\">Perfil Comportamental — §2º<\u002Fh4>\n          <p>Dados utilizados para formação do <strong>perfil comportamental<\u002Fstrong> de determinada pessoa natural podem ser considerados dados pessoais mesmo se referenciados de forma indireta, se a pessoa for identificada.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lblue);border-color:var(--blue)\">\n          <h4 style=\"color:var(--blue)\">Competência da ANPD — §3º<\u002Fh4>\n          <p>A Autoridade Nacional de Proteção de Dados poderá dispor sobre <strong>padrões e técnicas<\u002Fstrong> utilizados em processos de anonimização e realizar verificações acerca de sua segurança.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"background:var(--lblue);border:none;padding:24px\">\n          <h3 style=\"margin-bottom:16px;color:var(--navy)\">Como avaliar a anonimização?<\u002Fh3>\n          <div class=\"flow\">\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--blue)\">1<\u002Fdiv>\n              <div><h3>Meios Técnicos Razoáveis<\u002Fh3><p>Verificar se a re-identificação é possível com os recursos técnicos disponíveis no mercado.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--blue2)\">2<\u002Fdiv>\n              <div><h3>Custo e Tempo<\u002Fh3><p>Avaliar se o esforço para reverter a anonimização é desproporcional — econômica e temporalmente.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--teal)\">3<\u002Fdiv>\n              <div><h3>Tecnologia Disponível<\u002Fh3><p>Considerar o estado atual da tecnologia e a evolução esperada dos meios técnicos no momento do tratamento.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 13 ============ -->\n<section id=\"a13\" class=\"sec\" data-screen-label=\"Art. 13 — Pesquisa em Saúde Pública\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">13<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 13º<\u002Fdiv>\n        <h2>Pseudonimização e Pesquisa em Saúde Pública<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Na realização de estudos em saúde pública, os órgãos de pesquisa poderão ter acesso a bases de dados pessoais — tratados exclusivamente dentro do órgão e <strong>vedado o repasse a terceiros.<\u002Fstrong><\u002Fp>\n    <div class=\"g3\" style=\"margin-bottom:24px\">\n      <div class=\"card\" style=\"border-left:4px solid var(--teal)\">\n        <h3>O que é Pseudonimização? — §1º<\u002Fh3>\n        <p>Tratamento por meio do qual um dado <strong>perde a possibilidade de associação direta ou indireta<\u002Fstrong> a um indivíduo, senão pelo uso de informação adicional mantida separadamente pelo controlador em ambiente controlado e seguro.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--teal)\">\n        <h3>Diferença: Anonimização × Pseudonimização<\u002Fh3>\n        <p>Na <strong>anonimização<\u002Fstrong>, a re-identificação é irreversível. Na <strong>pseudonimização<\u002Fstrong>, a re-identificação é possível mediante acesso à informação adicional mantida separadamente pelo controlador.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--teal)\">\n        <h3>Restrições ao Órgão de Pesquisa — §2º<\u002Fh3>\n        <p>É <strong>vedado ao órgão de pesquisa repassar a terceiros<\u002Fstrong> os dados pessoais acessados. O acesso deve ser estritamente interno, controlado e com segurança adequada.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lteal);border-color:var(--teal)\">\n      <h4 style=\"color:var(--teal)\">Resultado de Pesquisas<\u002Fh4>\n      <p>Os resultados ou quaisquer partes das pesquisas <strong>não poderão ser divulgados de forma a identificar<\u002Fstrong> os titulares dos dados, devendo ser adotadas todas as medidas de segurança adequadas para preservar a privacidade dos indivíduos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 14 ============ -->\n<section id=\"a14\" class=\"sec\" data-screen-label=\"Art. 14 — Crianças e Adolescentes\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--amber)\">14<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lamber);color:var(--amber)\">Artigo 14º<\u002Fdiv>\n        <h2>Proteção de Dados de Crianças e Adolescentes<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"alert-badge\">\n      ⚠️ Atenção especial — Regime mais restritivo e protetivo\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O tratamento de dados pessoais de crianças e adolescentes deverá ser realizado no <strong>melhor interesse do menor<\u002Fstrong>, com medidas específicas de proteção.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"timeline\">\n          <div class=\"tl-item\">\n            <div class=\"tl-dot\" style=\"background:var(--amber)\">§1<\u002Fdiv>\n            <h3>Consentimento do Responsável<\u002Fh3>\n            <p>O tratamento de dados de crianças deve ter o <strong>consentimento específico e em destaque<\u002Fstrong> dado por ao menos um dos pais ou pelo responsável legal.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"tl-item\">\n            <div class=\"tl-dot\" style=\"background:var(--amber)\">§2<\u002Fdiv>\n            <h3>Transparência Pública<\u002Fh3>\n            <p>Os controladores deverão manter <strong>pública a informação<\u002Fstrong> sobre os tipos de dados coletados de crianças e adolescentes, de forma destacada em sua política de privacidade.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"tl-item\">\n            <div class=\"tl-dot\" style=\"background:var(--amber)\">§3<\u002Fdiv>\n            <h3>Dados Mínimos para Contato<\u002Fh3>\n            <p>Poderão ser coletados os dados <strong>estritamente necessários<\u002Fstrong> ao contato com os pais ou responsável legal, usados <strong>uma única vez<\u002Fstrong> e sem armazenamento.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"tl-item\">\n            <div class=\"tl-dot\" style=\"background:var(--amber)\">§4<\u002Fdiv>\n            <h3>Vedação de Uso Adicional<\u002Fh3>\n            <p>Os dados do §3 somente podem ser utilizados para <strong>confirmar a identidade do responsável<\u002Fstrong>, sendo vedada sua utilização para outras finalidades ou repasse a terceiros.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"tl-item\" style=\"margin-bottom:0\">\n            <div class=\"tl-dot\" style=\"background:var(--amber)\">§5<\u002Fdiv>\n            <h3>Verificação do Consentimento<\u002Fh3>\n            <p>O controlador deve realizar todos os <strong>esforços razoáveis<\u002Fstrong> para verificar que o consentimento foi de fato fornecido pelo responsável pela criança.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"background:var(--lamber);border:1px solid #FFCC80\">\n          <h3 style=\"color:var(--amber);margin-bottom:14px\">O que NÃO é permitido<\u002Fh3>\n          <ul style=\"display:flex;flex-direction:column;gap:10px\">\n            <li>Condicionar a participação de crianças a fornecimento de dados além do mínimo necessário<\u002Fli>\n            <li>Repassar dados de crianças a terceiros sem consentimento específico do responsável<\u002Fli>\n            <li>Utilizar os dados para fins de marketing direto direcionado a crianças<\u002Fli>\n            <li>Coletar mais informações do que o estritamente necessário para o serviço prestado<\u002Fli>\n            <li>Reter dados de crianças após o cumprimento da finalidade do tratamento<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lgreen);border-color:var(--green)\">\n          <h4 style=\"color:var(--green)\">Melhor Interesse do Menor<\u002Fh4>\n          <p>Toda decisão sobre tratamento de dados de crianças deve sempre ser orientada pelo <strong>princípio do melhor interesse do menor<\u002Fstrong>, conforme o Estatuto da Criança e do Adolescente (ECA).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 15 ============ -->\n<section id=\"a15\" class=\"sec\" data-screen-label=\"Art. 15 — Término do Tratamento\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--navy)\">15<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lindigo);color:var(--indigo)\">Artigo 15º<\u002Fdiv>\n        <h2>Término do Tratamento de Dados Pessoais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O término do tratamento de dados pessoais ocorrerá nas seguintes hipóteses:<\u002Fp>\n    <div class=\"g4\">\n      <div class=\"card\" style=\"border-top:4px solid var(--navy);text-align:center\">\n        <div style=\"width:52px;height:52px;background:var(--lindigo);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--indigo);font-size:1.1rem\">I<\u002Fdiv>\n        <h3>Finalidade Alcançada<\u002Fh3>\n        <p>Verificação de que a finalidade foi alcançada ou de que os dados deixaram de ser necessários ou pertinentes ao alcance da finalidade específica almejada.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--navy);text-align:center\">\n        <div style=\"width:52px;height:52px;background:var(--lindigo);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--indigo);font-size:1.1rem\">II<\u002Fdiv>\n        <h3>Fim do Período<\u002Fh3>\n        <p>Término do período de tratamento definido previamente no contrato, política de privacidade ou outra base legal.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--navy);text-align:center\">\n        <div style=\"width:52px;height:52px;background:var(--lindigo);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--indigo);font-size:1.1rem\">III<\u002Fdiv>\n        <h3>Revogação pelo Titular<\u002Fh3>\n        <p>Comunicação do titular, inclusive no exercício do direito de revogação do consentimento — resguardado o interesse público.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--navy);text-align:center\">\n        <div style=\"width:52px;height:52px;background:var(--lindigo);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--indigo);font-size:1.1rem\">IV<\u002Fdiv>\n        <h3>Determinação da ANPD<\u002Fh3>\n        <p>Determinação da Autoridade Nacional, quando houver violação ao disposto na LGPD — podendo incluir a imediata eliminação dos dados.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lindigo);border-color:var(--indigo);margin-top:20px\">\n      <h4 style=\"color:var(--indigo)\">O que acontece com os dados após o término?<\u002Fh4>\n      <p>Encerrado o tratamento, os dados devem ser <strong>eliminados<\u002Fstrong> — salvo nas hipóteses de conservação previstas no Artigo 16º, a seguir.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 16 ============ -->\n<section id=\"a16\" class=\"sec\" data-screen-label=\"Art. 16 — Conservação após o Término\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--green)\">16<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgreen);color:var(--green)\">Artigo 16º<\u002Fdiv>\n        <h2>Conservação de Dados após o Término do Tratamento<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Embora encerrado o tratamento, os dados pessoais poderão ser <strong>conservados<\u002Fstrong> nas seguintes hipóteses:<\u002Fp>\n    <div class=\"g2\">\n      <div class=\"icard\" style=\"border-left:4px solid var(--green);background:var(--lgreen)\">\n        <div class=\"icard-num\" style=\"background:var(--green)\">I<\u002Fdiv>\n        <div>\n          <h3>Obrigação Legal ou Regulatória<\u002Fh3>\n          <p>Cumprimento de obrigação legal ou regulatória pelo controlador — por exemplo, retenção de registros fiscais, trabalhistas ou contábeis exigidos por lei.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--green);background:var(--lgreen)\">\n        <div class=\"icard-num\" style=\"background:var(--green)\">II<\u002Fdiv>\n        <div>\n          <h3>Pesquisa por Órgão Competente<\u002Fh3>\n          <p>Estudo por órgão de pesquisa, garantida, sempre que possível, a <strong>anonimização<\u002Fstrong> dos dados pessoais.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--green);background:var(--lgreen)\">\n        <div class=\"icard-num\" style=\"background:var(--green)\">III<\u002Fdiv>\n        <div>\n          <h3>Transferência a Terceiro<\u002Fh3>\n          <p>Transferência a terceiro, desde que <strong>respeitados os requisitos de tratamento<\u002Fstrong> de dados dispostos na LGPD e com base legal adequada.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--green);background:var(--lgreen)\">\n        <div class=\"icard-num\" style=\"background:var(--green)\">IV<\u002Fdiv>\n        <div>\n          <h3>Uso Exclusivo do Controlador<\u002Fh3>\n          <p>Uso exclusivo do controlador, <strong>vedado o acesso por terceiro<\u002Fstrong>, e desde que os dados estejam anonimizados.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 17 ============ -->\n<section id=\"a17\" class=\"sec\" data-screen-label=\"Art. 17 — Titularidade dos Dados\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--purple)\">17<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lpurp);color:var(--purple)\">Artigo 17º<\u002Fdiv>\n        <h2>Titularidade dos Dados Pessoais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:linear-gradient(135deg,#6A1B9A,#4527A0);border-radius:var(--r);padding:36px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center\">\n      <div>\n        <p style=\"color:rgba(255,255,255,.75);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:8px\">Princípio Fundamental<\u002Fp>\n        <h2 style=\"color:#fff;font-size:clamp(1.1rem,2vw,1.5rem);line-height:1.4\">\"Toda pessoa natural tem assegurada a <strong style=\"color:#CE93D8\">titularidade de seus dados pessoais<\u002Fstrong> e garantidos os direitos fundamentais de <strong style=\"color:#CE93D8\">liberdade<\u002Fstrong>, de <strong style=\"color:#CE93D8\">intimidade<\u002Fstrong> e de <strong style=\"color:#CE93D8\">privacidade<\u002Fstrong>.\"<\u002Fh2>\n        <p style=\"color:rgba(255,255,255,.65);margin-top:12px;font-size:.85rem\">Art. 17, Lei nº 13.709/2018 — LGPD<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;min-width:160px\">\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:.8rem;color:rgba(255,255,255,.7);margin-bottom:4px\">Direito à<\u002Fdiv>\n          <div style=\"font-weight:700;color:#fff;font-size:.95rem\">Liberdade<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:.8rem;color:rgba(255,255,255,.7);margin-bottom:4px\">Direito à<\u002Fdiv>\n          <div style=\"font-weight:700;color:#fff;font-size:.95rem\">Intimidade<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:.8rem;color:rgba(255,255,255,.7);margin-bottom:4px\">Direito à<\u002Fdiv>\n          <div style=\"font-weight:700;color:#fff;font-size:.95rem\">Privacidade<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lpurp);border-color:var(--purple)\">\n      <h4 style=\"color:var(--purple)\">Por que este artigo é importante?<\u002Fh4>\n      <p>O Art. 17 estabelece a <strong>base jurídica da titularidade<\u002Fstrong>: os dados pessoais pertencem ao titular, não ao controlador ou operador. Isso fundamenta todos os direitos listados no Art. 18.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 18 ============ -->\n<section id=\"a18\" class=\"sec\" data-screen-label=\"Art. 18 — Direitos do Titular\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">18<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 18º — Artigo Central<\u002Fdiv>\n        <h2>Catálogo de Direitos do Titular de Dados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:24px\">O titular dos dados pessoais tem direito a obter do controlador, <strong>a qualquer momento e mediante requisição<\u002Fstrong>:<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px\" class=\"right-grid\">\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#1565C0,#1976D2)\">\n        <div class=\"right-num\">I<\u002Fdiv>\n        <h3>Confirmação de Existência<\u002Fh3>\n        <p>Confirmação de que há tratamento dos seus dados pessoais pelo controlador.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#00695C,#00897B)\">\n        <div class=\"right-num\">II<\u002Fdiv>\n        <h3>Acesso aos Dados<\u002Fh3>\n        <p>Acesso completo aos dados pessoais tratados pelo controlador.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#E65100,#F57C00)\">\n        <div class=\"right-num\">III<\u002Fdiv>\n        <h3>Correção<\u002Fh3>\n        <p>Correção de dados incompletos, inexatos ou desatualizados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#6A1B9A,#7B1FA2)\">\n        <div class=\"right-num\">IV<\u002Fdiv>\n        <h3>Anonimização, Bloqueio ou Eliminação<\u002Fh3>\n        <p>De dados desnecessários, excessivos ou tratados em desconformidade com a LGPD.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#2E7D32,#388E3C)\">\n        <div class=\"right-num\">V<\u002Fdiv>\n        <h3>Portabilidade<\u002Fh3>\n        <p>Transferência dos dados a outro fornecedor de serviço ou produto, mediante requisição expressa.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#C62828,#D32F2F)\">\n        <div class=\"right-num\">VI<\u002Fdiv>\n        <h3>Eliminação (Consentimento)<\u002Fh3>\n        <p>Eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses do Art. 16.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#283593,#303F9F)\">\n        <div class=\"right-num\">VII<\u002Fdiv>\n        <h3>Informação sobre Compartilhamento<\u002Fh3>\n        <p>Informação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado dos dados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#4E342E,#6D4C41)\">\n        <div class=\"right-num\">VIII<\u002Fdiv>\n        <h3>Informação sobre Não Consentir<\u002Fh3>\n        <p>Informação sobre a possibilidade de não fornecer consentimento e as consequências dessa negativa.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"right-card\" style=\"background:linear-gradient(135deg,#00838F,#00ACC1)\">\n        <div class=\"right-num\">IX<\u002Fdiv>\n        <h3>Revogação do Consentimento<\u002Fh3>\n        <p>Revogação do consentimento a qualquer momento, de forma gratuita e facilitada.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Parágrafos importantes -->\n    <div class=\"cat-h\" style=\"color:var(--red);border-color:var(--lred)\">Disposições Complementares (§§)<\u002Fdiv>\n    <div class=\"g2\">\n      <div class=\"dcard\" style=\"border-left:3px solid var(--red)\">\n        <div class=\"dn\" style=\"color:var(--red)\">§1º<\u002Fdiv>\n        <div class=\"dt\">Petição perante a ANPD<\u002Fdiv>\n        <div class=\"dd\">O titular tem direito a <strong>peticionar<\u002Fstrong> em relação aos seus dados contra o controlador perante a Autoridade Nacional de Proteção de Dados.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--red)\">\n        <div class=\"dn\" style=\"color:var(--red)\">§2º<\u002Fdiv>\n        <div class=\"dt\">Direito de Oposição<\u002Fdiv>\n        <div class=\"dd\">O titular pode <strong>opor-se<\u002Fstrong> a tratamento realizado com fundamento nas hipóteses de dispensa de consentimento, em caso de descumprimento da LGPD.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--red)\">\n        <div class=\"dn\" style=\"color:var(--red)\">§3º<\u002Fdiv>\n        <div class=\"dt\">Requerimento Expresso<\u002Fdiv>\n        <div class=\"dd\">Os direitos serão exercidos mediante requerimento expresso do titular ou de representante legalmente constituído ao agente de tratamento.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--red)\">\n        <div class=\"dn\" style=\"color:var(--red)\">§5º<\u002Fdiv>\n        <div class=\"dt\">Sem Custos ao Titular<\u002Fdiv>\n        <div class=\"dd\">O requerimento será atendido <strong>sem custos para o titular<\u002Fstrong>, nos prazos e termos previstos em regulamento da ANPD.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--red)\">\n        <div class=\"dn\" style=\"color:var(--red)\">§6º<\u002Fdiv>\n        <div class=\"dt\">Propagação das Correções<\u002Fdiv>\n        <div class=\"dd\">O controlador deve informar imediatamente a <strong>todos os agentes parceiros<\u002Fstrong> sobre correções, eliminações, anonimizações ou bloqueios, para que repitam o mesmo procedimento.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--red)\">\n        <div class=\"dn\" style=\"color:var(--red)\">§8º<\u002Fdiv>\n        <div class=\"dt\">Defesa do Consumidor<\u002Fdiv>\n        <div class=\"dd\">O direito de petição também poderá ser exercido perante os <strong>organismos de defesa do consumidor<\u002Fstrong>, como o Procon.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 19 ============ -->\n<section id=\"a19\" class=\"sec\" data-screen-label=\"Art. 19 — Prazo e Forma de Resposta\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--blue)\">19<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue)\">Artigo 19º<\u002Fdiv>\n        <h2>Prazo e Forma de Atendimento ao Titular<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:24px\">A confirmação de existência ou o acesso a dados pessoais serão providenciados mediante requisição do titular:<\u002Fp>\n    <div class=\"g2\" style=\"margin-bottom:24px\">\n      <div style=\"background:linear-gradient(135deg,#1565C0,#42A5F5);border-radius:var(--r);padding:28px;color:#fff\">\n        <div style=\"font-size:2.4rem;font-weight:800;color:#fff;line-height:1\">Imediato<\u002Fdiv>\n        <div style=\"font-size:.8rem;color:rgba(255,255,255,.75);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em\">Inciso I — Formato Simplificado<\u002Fdiv>\n        <p style=\"color:rgba(255,255,255,.85)\">Para confirmação de existência de tratamento e acesso em formato simplificado — resposta imediata, sem necessidade de justificativa.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(135deg,#00695C,#26A69A);border-radius:var(--r);padding:28px;color:#fff\">\n        <div style=\"font-size:2.4rem;font-weight:800;color:#fff;line-height:1\">15 dias<\u002Fdiv>\n        <div style=\"font-size:.8rem;color:rgba(255,255,255,.75);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em\">Inciso II — Declaração Completa<\u002Fdiv>\n        <p style=\"color:rgba(255,255,255,.85)\">Declaração clara e completa com origem dos dados, critérios utilizados e finalidade do tratamento — prazo máximo de 15 dias corridos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--blue)\">\n        <h3>Formato de Armazenamento — §1º<\u002Fh3>\n        <p>Os dados pessoais devem ser armazenados em formato que <strong>favoreça o exercício do direito de acesso<\u002Fstrong> pelo titular.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--blue)\">\n        <h3>Escolha do Titular — §2º<\u002Fh3>\n        <p>As informações poderão ser fornecidas, a critério do titular: por <strong>meio eletrônico seguro<\u002Fstrong> ou <strong>impressa<\u002Fstrong>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--blue)\">\n        <h3>Cópia Integral — §3º<\u002Fh3>\n        <p>O titular pode solicitar <strong>cópia eletrônica integral<\u002Fstrong> de seus dados, observados os segredos comercial e industrial.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lamber);border-color:var(--amber)\">\n      <h4 style=\"color:var(--amber)\">Competência da ANPD — §4º<\u002Fh4>\n      <p>A Autoridade Nacional poderá dispor de forma diferenciada sobre os prazos para <strong>setores específicos<\u002Fstrong>, considerando as particularidades do setor e o volume de tratamento de dados.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 20 ============ -->\n<section id=\"a20\" class=\"sec\" data-screen-label=\"Art. 20 — Decisões Automatizadas\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">20<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 20º<\u002Fdiv>\n        <h2>Revisão de Decisões Automatizadas<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\">\n      <div>\n        <p style=\"margin-bottom:20px\">O titular dos dados tem direito a <strong>solicitar a revisão<\u002Fstrong> de decisões tomadas unicamente com base em <strong>tratamento automatizado<\u002Fstrong> de dados pessoais que afetem seus interesses.<\u002Fp>\n        <div class=\"card\" style=\"background:var(--lteal);border:none;margin-bottom:16px\">\n          <h3 style=\"margin-bottom:10px\">Decisões que se enquadram neste artigo:<\u002Fh3>\n          <ul style=\"display:flex;flex-direction:column;gap:8px\">\n            <li>Definição de <strong>perfil pessoal<\u002Fstrong> e de personalidade<\u002Fli>\n            <li>Definição de <strong>perfil profissional<\u002Fstrong><\u002Fli>\n            <li>Análise de <strong>perfil de consumo<\u002Fstrong><\u002Fli>\n            <li>Avaliação de <strong>perfil de crédito<\u002Fstrong> (score, aprovação de empréstimo)<\u002Fli>\n            <li>Qualquer decisão que afete os <strong>interesses do titular<\u002Fstrong><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"icard\" style=\"border-left:4px solid var(--teal)\">\n          <div class=\"icard-num\" style=\"background:var(--teal)\">§1<\u002Fdiv>\n          <div>\n            <h3>Direito à Explicação<\u002Fh3>\n            <p>O controlador deverá fornecer, sempre que solicitadas, <strong>informações claras e adequadas<\u002Fstrong> sobre os critérios e procedimentos utilizados na decisão automatizada.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"icard\" style=\"border-left:4px solid var(--teal);margin-top:10px\">\n          <div class=\"icard-num\" style=\"background:var(--teal)\">§2<\u002Fdiv>\n          <div>\n            <h3>Auditoria da ANPD<\u002Fh3>\n            <p>Em caso de sigilo comercial ou industrial, a <strong>ANPD poderá realizar auditoria<\u002Fstrong> para verificar aspectos discriminatórios no tratamento automatizado.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:24px\">\n          <h3 style=\"margin-bottom:16px;color:var(--teal)\">Como funciona a revisão?<\u002Fh3>\n          <div class=\"flow\">\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--teal)\">1<\u002Fdiv>\n              <div><h3>Titular Solicita Revisão<\u002Fh3><p>O titular identifica que foi prejudicado por uma decisão totalmente automatizada e formaliza o pedido de revisão ao controlador.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--teal)\">2<\u002Fdiv>\n              <div><h3>Controlador Explica os Critérios<\u002Fh3><p>O controlador deve explicar os critérios, as variáveis utilizadas e a lógica da decisão automatizada, salvo segredo empresarial.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--teal)\">3<\u002Fdiv>\n              <div><h3>Revisão Humana<\u002Fh3><p>Caso necessário, a revisão pode incluir uma análise humana da decisão, especialmente quando for verificada inconsistência ou potencial discriminação.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--green)\">4<\u002Fdiv>\n              <div><h3>ANPD como Árbitro<\u002Fh3><p>Se houver recusa ou insuficiência da explicação por motivo de segredo comercial, a ANPD pode auditar o algoritmo para verificar viés discriminatório.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lred);border-color:var(--red)\">\n          <h4 style=\"color:var(--red)\">Atenção — Discriminação Algorítmica<\u002Fh4>\n          <p>O uso de dados sensíveis em modelos automatizados que gerem <strong>efeitos discriminatórios<\u002Fstrong> — como raça, religião ou condição de saúde para negar crédito — é vedado pela LGPD.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"c90d4c66-3ffc-4920-aa70-71c4d0a8b46d\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei nº 13.709, de 14 de agosto de 2018 — Artigos 12 a 20<\u002Fp>\n  <p style=\"margin-top:12px\">\n    <a href=\"/lgpd/artigos-1-11\" style=\"color:rgba(255,255,255,.6);text-decoration:none;font-size:.8rem;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;\">\n      ← Ver Artigos 1 a 11\n    <\u002Fa>\n  <\u002Fp>\n  <p style=\"margin-top:12px;font-size:.72rem;opacity:.45\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\nconst secs = [...document.querySelectorAll('section[id]')];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = secs[0]?.id;\n  secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n  const active = links.find(a => a.getAttribute('href') === '#' + cur);\n  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth', block: 'nearest' });\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
