document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

auto-fit,minmax(230px,1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}\n.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}\n.tcol{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}\n.tcol img{width:100%;border-radius:var(--r);display:block}\n\n/* Cards */\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.icard{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}\n.icard-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff}\n\n/* Definition mini cards */\n.dcard{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05)}\n.dcard .dn{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}\n.dcard .dt{font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--text)}\n.dcard .dd{font-size:.8rem;color:var(--muted)}\n\n/* Highlight */\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n\n/* Header */\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n\n/* Hero */\n.hero{background:linear-gradient(135deg,#0D1B4B 0%,#1565C0 100%);color:#fff;padding:52px 0 0}\n.hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:end}\n.hero p{color:rgba(255,255,255,.8);font-size:1rem;margin-top:10px;max-width:480px}\n.hero img{width:100%;border-radius:14px 14px 0 0;display:block}\n.hero-stats{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}\n.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 16px;text-align:center}\n.stat-n{font-size:1.5rem;font-weight:800;color:#fff}\n.stat-l{font-size:.7rem;color:rgba(255,255,255,.7)}\n\n/* Nav */\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--blue);color:#fff}\n\n/* Cat headings */\n.cat-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:2px solid;margin:24px 0 12px}\n\n/* Footer */\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\n\n@media(max-width:680px){\n  .hero-inner,.tcol{grid-template-columns:1fr}\n  .hero img{border-radius:var(--r)}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"bae6d517-1900-420d-997f-17291432e5c8\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div class=\"wrap hero-inner\">\n    <div style=\"padding-bottom:52px\">\n      <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff\">Lei nº 13.709/2018<\u002Fdiv>\n      <h1 style=\"color:#fff;margin-top:8px\">Lei Geral de<br>Proteção de Dados<\u002Fh1>\n      <p>Guia didático dos <strong style=\"color:#fff\">artigos 1º ao 11º<\u002Fstrong> da LGPD: fundamentos, aplicação, definições, princípios e bases legais para o tratamento de dados pessoais no Brasil.<\u002Fp>\n      <div class=\"hero-stats\">\n        <div class=\"stat\"><div class=\"stat-n\">11<\u002Fdiv><div class=\"stat-l\">Artigos<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"stat-n\">7<\u002Fdiv><div class=\"stat-l\">Fundamentos<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"stat-n\">19<\u002Fdiv><div class=\"stat-l\">Definições<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"stat-n\">10<\u002Fdiv><div class=\"stat-l\">Princípios<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"stat-n\">10<\u002Fdiv><div class=\"stat-l\">Bases Legais<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div><img src=\"2851e649-3875-409f-8721-dbcbab519c58\" alt=\"LGPD — proteção de dados no Brasil\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\" aria-label=\"Artigos\">\n  <ul>\n    <li><a href=\"#a1\">Art. 1 — Objeto<\u002Fa><\u002Fli>\n    <li><a href=\"#a2\">Art. 2 — Fundamentos<\u002Fa><\u002Fli>\n    <li><a href=\"#a3\">Art. 3 — Aplicação<\u002Fa><\u002Fli>\n    <li><a href=\"#a4\">Art. 4 — Exceções<\u002Fa><\u002Fli>\n    <li><a href=\"#a5\">Art. 5 — Definições<\u002Fa><\u002Fli>\n    <li><a href=\"#a6\">Art. 6 — Princípios<\u002Fa><\u002Fli>\n    <li><a href=\"#a7\">Art. 7 — Bases Legais<\u002Fa><\u002Fli>\n    <li><a href=\"#a8\">Art. 8 — Consentimento<\u002Fa><\u002Fli>\n    <li><a href=\"#a9\">Art. 9 — Acesso<\u002Fa><\u002Fli>\n    <li><a href=\"#a10\">Art. 10 — Leg. Interesse<\u002Fa><\u002Fli>\n    <li><a href=\"#a11\">Art. 11 — Dados Sensíveis<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- ============ ART. 1 ============ -->\n<section id=\"a1\" class=\"sec\" data-screen-label=\"Art. 1 — Objeto\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--blue)\">1<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue)\">Artigo 1º<\u002Fdiv>\n        <h2>Objeto e Finalidade da LGPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\">\n      <div>\n        <p>A <strong>LGPD<\u002Fstrong> dispõe sobre o tratamento de dados pessoais — inclusive nos meios digitais — por pessoa natural ou jurídica de direito público ou privado, com o objetivo de proteger os direitos fundamentais de liberdade e de privacidade e o livre desenvolvimento da personalidade da pessoa natural.<\u002Fp>\n        <div class=\"hl\" style=\"background:var(--lblue);border-color:var(--blue);margin-top:20px\">\n          <h4 style=\"color:var(--blue)\">Objetivo Central<\u002Fh4>\n          <p>Proteger os direitos fundamentais de <strong>liberdade<\u002Fstrong> e de <strong>privacidade<\u002Fstrong>, além do livre desenvolvimento da personalidade da pessoa natural.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"g3\" style=\"margin-top:20px\">\n          <div class=\"card\" style=\"border-top:3px solid var(--blue)\"><h3>Dados Pessoais<\u002Fh3><p>Abrange qualquer meio — físico ou digital<\u002Fp><\u002Fdiv>\n          <div class=\"card\" style=\"border-top:3px solid var(--teal)\"><h3>Qualquer Agente<\u002Fh3><p>Pessoa física ou jurídica, pública ou privada<\u002Fp><\u002Fdiv>\n          <div class=\"card\" style=\"border-top:3px solid var(--green)\"><h3>Direitos Fundamentais<\u002Fh3><p>Liberdade, privacidade e personalidade<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><img src=\"bf068863-1b3a-4f26-90aa-28609c8e33bc\" alt=\"LGPD — proteção da pessoa natural\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 2 ============ -->\n<section id=\"a2\" class=\"sec\" data-screen-label=\"Art. 2 — Fundamentos\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">2<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 2º<\u002Fdiv>\n        <h2>Fundamentos da Proteção de Dados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A disciplina de proteção de dados pessoais tem como fundamentos:<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"icard\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">I<\u002Fdiv>\n        <div><h3>Respeito à Privacidade<\u002Fh3><p>Direito fundamental à proteção da vida privada da pessoa natural.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">II<\u002Fdiv>\n        <div><h3>Autodeterminação Informativa<\u002Fh3><p>Direito do titular de controlar suas próprias informações pessoais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">III<\u002Fdiv>\n        <div><h3>Liberdade de Expressão<\u002Fh3><p>Proteção da liberdade de expressão, informação, comunicação e de opinião.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">IV<\u002Fdiv>\n        <div><h3>Inviolabilidade da Intimidade<\u002Fh3><p>Proteção da honra e da imagem das pessoas naturais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">V<\u002Fdiv>\n        <div><h3>Desenvolvimento Econômico e Tecnológico<\u002Fh3><p>Fomento à inovação com respeito à proteção de dados.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">VI<\u002Fdiv>\n        <div><h3>Livre Iniciativa e Defesa do Consumidor<\u002Fh3><p>Promoção da livre concorrência com proteção ao consumidor.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"grid-column:1/-1;max-width:400px\">\n        <div class=\"icard-num\" style=\"background:var(--teal)\">VII<\u002Fdiv>\n        <div><h3>Direitos Humanos e Cidadania<\u002Fh3><p>Livre desenvolvimento da personalidade, dignidade e exercício da cidadania pelas pessoas naturais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 3 ============ -->\n<section id=\"a3\" class=\"sec\" data-screen-label=\"Art. 3 — Âmbito de Aplicação\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--blue)\">3<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue)\">Artigo 3º<\u002Fdiv>\n        <h2>Âmbito de Aplicação<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\">\n      <div>\n        <p>Aplica-se a qualquer operação de tratamento realizada por pessoa natural ou jurídica, <strong>independentemente do meio, do país de sua sede ou do país onde estejam localizados os dados<\u002Fstrong>, desde que:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:20px\">\n          <div class=\"icard\" style=\"border-left:4px solid var(--blue)\">\n            <div class=\"icard-num\" style=\"background:var(--blue)\">I<\u002Fdiv>\n            <div><h3>Operação no Território Nacional<\u002Fh3><p>A operação de tratamento seja realizada no Brasil.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--blue)\">\n            <div class=\"icard-num\" style=\"background:var(--blue2)\">II<\u002Fdiv>\n            <div><h3>Oferta de Bens ou Serviços no Brasil<\u002Fh3><p>A atividade tenha por objetivo a oferta ou fornecimento de bens/serviços a indivíduos localizados no território nacional.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--blue)\">\n            <div class=\"icard-num\" style=\"background:var(--blue2)\">III<\u002Fdiv>\n            <div><h3>Dados Coletados no País<\u002Fh3><p>Os dados pessoais objeto do tratamento tenham sido coletados no território nacional.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lgreen);border-color:var(--green)\">\n          <h4 style=\"color:var(--green)\">Exceção Territorial<\u002Fh4>\n          <p>Não se aplica quando dados vêm do exterior <strong>sem<\u002Fstrong> comunicação com agentes brasileiros, e o país de origem tem grau de proteção equivalente.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><img src=\"30c5d6bd-65e1-4c7c-967f-85c7895043d5\" alt=\"Âmbito territorial — LGPD\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 4 ============ -->\n<section id=\"a4\" class=\"sec\" data-screen-label=\"Art. 4 — Exceções\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--amber)\">4<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lamber);color:var(--amber)\">Artigo 4º<\u002Fdiv>\n        <h2>Tratamentos Excluídos do Âmbito da LGPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A LGPD <strong>não se aplica<\u002Fstrong> ao tratamento de dados pessoais realizado:<\u002Fp>\n    <div class=\"g4\">\n      <div class=\"card\" style=\"border-top:4px solid var(--amber);text-align:center\">\n        <div style=\"width:48px;height:48px;background:var(--lamber);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--amber);font-size:1.1rem\">I<\u002Fdiv>\n        <h3>Uso Pessoal e Não Econômico<\u002Fh3>\n        <p>Por pessoa natural para fins exclusivamente particulares, sem finalidade econômica.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--amber);text-align:center\">\n        <div style=\"width:48px;height:48px;background:var(--lamber);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--amber);font-size:1.1rem\">II<\u002Fdiv>\n        <h3>Fins Jornalísticos, Artísticos ou Acadêmicos<\u002Fh3>\n        <p>Para fins exclusivamente jornalísticos, artísticos ou acadêmicos, observados os limites da lei.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--amber);text-align:center\">\n        <div style=\"width:48px;height:48px;background:var(--lamber);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--amber);font-size:1.1rem\">III<\u002Fdiv>\n        <h3>Segurança Pública e Defesa Nacional<\u002Fh3>\n        <p>Para fins de segurança pública, defesa nacional, segurança do Estado ou investigação/repressão de infrações penais.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:4px solid var(--amber);text-align:center\">\n        <div style=\"width:48px;height:48px;background:var(--lamber);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-weight:800;color:var(--amber);font-size:1.1rem\">IV<\u002Fdiv>\n        <h3>Dados Provenientes do Exterior<\u002Fh3>\n        <p>Oriundos de fora do Brasil, sem uso compartilhado com agentes de tratamento brasileiros.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:22px\">\n      <img src=\"67bc30a9-42b5-42ab-ac08-b478e255ae5f\" alt=\"Aplicação da LGPD — agentes e hipóteses\" style=\"width:100%;border-radius:var(--r);max-height:200px;object-fit:cover;object-position:center\">\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lamber);border-color:var(--amber)\">\n      <h4 style=\"color:var(--amber)\">Atenção — Inciso III<\u002Fh4>\n      <p>O tratamento de dados para fins de segurança pública será regido por <strong>legislação específica<\u002Fstrong>, que deverá prever medidas proporcionais e estritamente necessárias ao atendimento do interesse público.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 5 ============ -->\n<section id=\"a5\" class=\"sec\" data-screen-label=\"Art. 5 — Definições\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--navy)\">5<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:#E8EAF6;color:#3F51B5\">Artigo 5º<\u002Fdiv>\n        <h2>Definições — 19 Conceitos Fundamentais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\" style=\"margin-bottom:28px;align-items:center\">\n      <p>Para os fins da LGPD, considera-se:<\u002Fp>\n      <img src=\"2413d3a0-8d7f-483b-8375-d2a82615aa15\" alt=\"Definições da LGPD — Art. 5\">\n    <\u002Fdiv>\n\n    <div class=\"cat-h\" style=\"color:var(--blue);border-color:var(--lblue2)\">Tipos de Dados<\u002Fdiv>\n    <div class=\"g4\">\n      <div class=\"dcard\" style=\"border-left:3px solid var(--blue)\">\n        <div class=\"dn\" style=\"color:var(--blue)\">Inciso I<\u002Fdiv>\n        <div class=\"dt\">Dado Pessoal<\u002Fdiv>\n        <div class=\"dd\">Informação relacionada a pessoa natural identificada ou identificável.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid #9C27B0\">\n        <div class=\"dn\" style=\"color:#9C27B0\">Inciso II<\u002Fdiv>\n        <div class=\"dt\">Dado Pessoal Sensível<\u002Fdiv>\n        <div class=\"dd\">Origem racial/étnica, convicção religiosa, opinião política, filiação sindical, saúde, vida sexual, dado genético ou biométrico.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--teal)\">\n        <div class=\"dn\" style=\"color:var(--teal)\">Inciso III<\u002Fdiv>\n        <div class=\"dt\">Dado Anonimizado<\u002Fdiv>\n        <div class=\"dd\">Dado relativo a titular que não possa ser identificado, considerando os meios técnicos razoáveis disponíveis.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--green)\">\n        <div class=\"dn\" style=\"color:var(--green)\">Inciso IV<\u002Fdiv>\n        <div class=\"dt\">Banco de Dados<\u002Fdiv>\n        <div class=\"dd\">Conjunto estruturado de dados pessoais, em suporte eletrônico ou físico, estabelecido em um ou vários locais.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cat-h\" style=\"color:var(--teal);border-color:var(--lteal)\">Agentes de Tratamento<\u002Fdiv>\n    <div class=\"g4\">\n      <div class=\"dcard\" style=\"border-left:3px solid var(--teal)\">\n        <div class=\"dn\" style=\"color:var(--teal)\">Inciso V<\u002Fdiv>\n        <div class=\"dt\">Titular<\u002Fdiv>\n        <div class=\"dd\">Pessoa natural a quem se referem os dados pessoais que são objeto de tratamento.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--teal)\">\n        <div class=\"dn\" style=\"color:var(--teal)\">Inciso VI<\u002Fdiv>\n        <div class=\"dt\">Controlador<\u002Fdiv>\n        <div class=\"dd\">Pessoa natural ou jurídica que toma as decisões referentes ao tratamento de dados pessoais.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--teal)\">\n        <div class=\"dn\" style=\"color:var(--teal)\">Inciso VII<\u002Fdiv>\n        <div class=\"dt\">Operador<\u002Fdiv>\n        <div class=\"dd\">Pessoa natural ou jurídica que realiza o tratamento de dados em nome do controlador.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--teal)\">\n        <div class=\"dn\" style=\"color:var(--teal)\">Inciso VIII<\u002Fdiv>\n        <div class=\"dt\">Encarregado (DPO)<\u002Fdiv>\n        <div class=\"dd\">Canal de comunicação entre o controlador, os titulares dos dados e a ANPD.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--teal)\">\n        <div class=\"dn\" style=\"color:var(--teal)\">Inciso IX<\u002Fdiv>\n        <div class=\"dt\">Agentes de Tratamento<\u002Fdiv>\n        <div class=\"dd\">O controlador e o operador em conjunto.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cat-h\" style=\"color:var(--green);border-color:var(--lgreen)\">Operações com Dados<\u002Fdiv>\n    <div class=\"g4\">\n      <div class=\"dcard\" style=\"border-left:3px solid var(--green)\">\n        <div class=\"dn\" style=\"color:var(--green)\">Inciso X<\u002Fdiv>\n        <div class=\"dt\">Tratamento<\u002Fdiv>\n        <div class=\"dd\">Toda operação realizada com dados: coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação, controle, comunicação, transferência, difusão ou extração.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--green)\">\n        <div class=\"dn\" style=\"color:var(--green)\">Inciso XI<\u002Fdiv>\n        <div class=\"dt\">Anonimização<\u002Fdiv>\n        <div class=\"dd\">Utilização de meios técnicos razoáveis para que o dado não possa ser associado ao titular direta ou indiretamente.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--green)\">\n        <div class=\"dn\" style=\"color:var(--green)\">Inciso XII<\u002Fdiv>\n        <div class=\"dt\">Consentimento<\u002Fdiv>\n        <div class=\"dd\">Manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados para uma finalidade determinada.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--green)\">\n        <div class=\"dn\" style=\"color:var(--green)\">Inciso XIII<\u002Fdiv>\n        <div class=\"dt\">Bloqueio<\u002Fdiv>\n        <div class=\"dd\">Suspensão temporária de qualquer operação de tratamento mediante guarda do dado ou do banco de dados.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--green)\">\n        <div class=\"dn\" style=\"color:var(--green)\">Inciso XIV<\u002Fdiv>\n        <div class=\"dt\">Eliminação<\u002Fdiv>\n        <div class=\"dd\">Exclusão de dado ou conjunto de dados armazenados em banco de dados, independentemente do procedimento empregado.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cat-h\" style=\"color:var(--amber);border-color:#FFD180\">Estruturas e Controle<\u002Fdiv>\n    <div class=\"g4\">\n      <div class=\"dcard\" style=\"border-left:3px solid var(--amber)\">\n        <div class=\"dn\" style=\"color:var(--amber)\">Inciso XV<\u002Fdiv>\n        <div class=\"dt\">Transferência Internacional<\u002Fdiv>\n        <div class=\"dd\">Transferência de dados pessoais para país estrangeiro ou organismo internacional do qual o país seja membro.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--amber)\">\n        <div class=\"dn\" style=\"color:var(--amber)\">Inciso XVI<\u002Fdiv>\n        <div class=\"dt\">Uso Compartilhado de Dados<\u002Fdiv>\n        <div class=\"dd\">Comunicação, difusão, transferência internacional, interconexão de dados pessoais entre controladores distintos.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--amber)\">\n        <div class=\"dn\" style=\"color:var(--amber)\">Inciso XVII<\u002Fdiv>\n        <div class=\"dt\">Relatório de Impacto (RIPD)<\u002Fdiv>\n        <div class=\"dd\">Documentação do controlador com a descrição dos processos de tratamento que podem gerar riscos às liberdades e direitos fundamentais.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--amber)\">\n        <div class=\"dn\" style=\"color:var(--amber)\">Inciso XVIII<\u002Fdiv>\n        <div class=\"dt\">Órgão de Pesquisa<\u002Fdiv>\n        <div class=\"dd\">Entidade da administração pública direta/indireta ou entidade privada sem fins lucrativos legalmente constituída, dedicada à pesquisa básica ou aplicada.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dcard\" style=\"border-left:3px solid var(--amber)\">\n        <div class=\"dn\" style=\"color:var(--amber)\">Inciso XIX<\u002Fdiv>\n        <div class=\"dt\">Autoridade Nacional (ANPD)<\u002Fdiv>\n        <div class=\"dd\">Órgão da administração pública responsável por zelar, implementar e fiscalizar o cumprimento da LGPD em todo o território nacional.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 6 ============ -->\n<section id=\"a6\" class=\"sec\" data-screen-label=\"Art. 6 — Princípios\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">6<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 6º<\u002Fdiv>\n        <h2>Princípios do Tratamento de Dados Pessoais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\" style=\"margin-bottom:28px;align-items:center\">\n      <p>As atividades de tratamento de dados pessoais deverão observar a <strong>boa-fé<\u002Fstrong> e os seguintes princípios:<\u002Fp>\n      <img src=\"a97f445a-3347-476c-ba72-5b1dd6cdf9e1\" alt=\"Princípios da LGPD\">\n    <\u002Fdiv>\n    <div class=\"g2\">\n      <div class=\"icard\" style=\"border-left:4px solid #1565C0\">\n        <div class=\"icard-num\" style=\"background:#1565C0\">I<\u002Fdiv>\n        <div><h3>Finalidade<\u002Fh3><p>Propósitos <strong>legítimos, específicos, explícitos e informados<\u002Fstrong> ao titular, sem tratamento posterior incompatível com essas finalidades.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #1976D2\">\n        <div class=\"icard-num\" style=\"background:#1976D2\">II<\u002Fdiv>\n        <div><h3>Adequação<\u002Fh3><p>Compatibilidade do tratamento com as finalidades informadas ao titular, de acordo com o contexto do tratamento.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #00695C\">\n        <div class=\"icard-num\" style=\"background:#00695C\">III<\u002Fdiv>\n        <div><h3>Necessidade<\u002Fh3><p>Limitação ao <strong>mínimo necessário<\u002Fstrong> para a realização das finalidades — dados pertinentes, proporcionais e não excessivos.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #00897B\">\n        <div class=\"icard-num\" style=\"background:#00897B\">IV<\u002Fdiv>\n        <div><h3>Livre Acesso<\u002Fh3><p>Garantia de consulta <strong>facilitada e gratuita<\u002Fstrong> sobre a forma, a duração do tratamento e a integralidade dos dados.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #2E7D32\">\n        <div class=\"icard-num\" style=\"background:#2E7D32\">V<\u002Fdiv>\n        <div><h3>Qualidade dos Dados<\u002Fh3><p>Garantia de <strong>exatidão, clareza, relevância e atualização<\u002Fstrong> dos dados conforme a necessidade e a finalidade do tratamento.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #388E3C\">\n        <div class=\"icard-num\" style=\"background:#388E3C\">VI<\u002Fdiv>\n        <div><h3>Transparência<\u002Fh3><p>Informações claras, precisas e facilmente acessíveis sobre o tratamento e os respectivos agentes de tratamento.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #E65100\">\n        <div class=\"icard-num\" style=\"background:#E65100\">VII<\u002Fdiv>\n        <div><h3>Segurança<\u002Fh3><p>Uso de <strong>medidas técnicas e administrativas<\u002Fstrong> aptas a proteger os dados de acessos não autorizados e situações acidentais ou ilícitas.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #F57C00\">\n        <div class=\"icard-num\" style=\"background:#F57C00\">VIII<\u002Fdiv>\n        <div><h3>Prevenção<\u002Fh3><p>Adoção de medidas para <strong>prevenir<\u002Fstrong> a ocorrência de danos em virtude do tratamento de dados pessoais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #6A1B9A\">\n        <div class=\"icard-num\" style=\"background:#6A1B9A\">IX<\u002Fdiv>\n        <div><h3>Não Discriminação<\u002Fh3><p>Impossibilidade de realização do tratamento para fins <strong>discriminatórios ilícitos ou abusivos<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid #7B1FA2\">\n        <div class=\"icard-num\" style=\"background:#7B1FA2\">X<\u002Fdiv>\n        <div><h3>Responsabilização e Prestação de Contas<\u002Fh3><p>Demonstração pelo agente da adoção de <strong>medidas eficazes<\u002Fstrong> e capazes de comprovar o cumprimento das normas de proteção de dados.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 7 ============ -->\n<section id=\"a7\" class=\"sec\" data-screen-label=\"Art. 7 — Bases Legais\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--blue)\">7<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue)\">Artigo 7º<\u002Fdiv>\n        <h2>Hipóteses (Bases Legais) para Tratamento de Dados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O tratamento de dados pessoais somente poderá ser realizado nas seguintes hipóteses:<\u002Fp>\n    <div class=\"g2\">\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue)\">I<\u002Fdiv>\n        <div><h3>Consentimento do Titular<\u002Fh3><p>Manifestação livre, informada e inequívoca para finalidade determinada.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue)\">II<\u002Fdiv>\n        <div><h3>Cumprimento de Obrigação Legal<\u002Fh3><p>Para cumprimento de obrigação legal ou regulatória pelo controlador.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">III<\u002Fdiv>\n        <div><h3>Execução de Políticas Públicas<\u002Fh3><p>Pela administração pública, para execução de políticas públicas previstas em leis ou regulamentos.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">IV<\u002Fdiv>\n        <div><h3>Pesquisa Científica<\u002Fh3><p>Para realização de estudos por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">V<\u002Fdiv>\n        <div><h3>Execução de Contrato<\u002Fh3><p>Quando necessário para a execução de contrato ou procedimentos preliminares, a pedido do titular.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">VI<\u002Fdiv>\n        <div><h3>Exercício Regular de Direitos<\u002Fh3><p>Para exercício regular de direitos em processo judicial, administrativo ou arbitral.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">VII<\u002Fdiv>\n        <div><h3>Proteção da Vida<\u002Fh3><p>Para proteção da vida ou da incolumidade física do titular ou de terceiro.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">VIII<\u002Fdiv>\n        <div><h3>Tutela da Saúde<\u002Fh3><p>Exclusivamente em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">IX<\u002Fdiv>\n        <div><h3>Interesses Legítimos<\u002Fh3><p>Quando necessário para atender aos interesses legítimos do controlador ou de terceiro, exceto se prevalecerem direitos e liberdades fundamentais do titular.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"background:var(--lblue);border:none\">\n        <div class=\"icard-num\" style=\"background:var(--blue2)\">X<\u002Fdiv>\n        <div><h3>Proteção do Crédito<\u002Fh3><p>Para proteção do crédito, incluindo o disposto na legislação pertinente.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 8 ============ -->\n<section id=\"a8\" class=\"sec\" data-screen-label=\"Art. 8 — Consentimento\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">8<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 8º<\u002Fdiv>\n        <h2>Validade do Consentimento<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O consentimento referido no Art. 7º, inciso I, deve observar as seguintes condições:<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--teal)\"><h3>Forma Demonstrável<\u002Fh3><p>Deve ser fornecido por <strong>escrito<\u002Fstrong> ou por outro meio que demonstre a manifestação de vontade do titular.<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--teal)\"><h3>Destaque em Contratos<\u002Fh3><p>Se integrante de cláusula contratual, deve estar em <strong>destaque<\u002Fstrong>, separado das demais cláusulas contratuais.<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--teal)\"><h3>Finalidade Específica<\u002Fh3><p>O consentimento deve ser para <strong>finalidade determinada<\u002Fstrong>. Autorizações genéricas para tratamentos não especificados são nulas.<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--amber)\"><h3>Revogação a Qualquer Momento<\u002Fh3><p>O titular pode <strong>revogar o consentimento<\u002Fstrong> a qualquer momento, por manifestação expressa e gratuita, mediante procedimento facilitado.<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--amber)\"><h3>Ônus da Prova<\u002Fh3><p>Cabe ao <strong>controlador<\u002Fstrong> o ônus da prova de que o consentimento foi obtido em conformidade com a lei.<\u002Fp><\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--amber)\"><h3>Nulidade por Vício<\u002Fh3><p>O consentimento obtido com violação da LGPD é <strong>nulo<\u002Fstrong>. O controlador deve arcar com os efeitos do tratamento indevido.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lteal);border-color:var(--teal)\">\n      <h4 style=\"color:var(--teal)\">Mudança de Finalidade<\u002Fh4>\n      <p>Caso o tratamento de dados não corresponda às finalidades que justificaram a obtenção do consentimento, o controlador deverá <strong>comunicar o titular<\u002Fstrong> previamente, que poderá revogar o consentimento caso discorde das alterações.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 9 ============ -->\n<section id=\"a9\" class=\"sec\" data-screen-label=\"Art. 9 — Direito de Acesso\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--blue)\">9<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue)\">Artigo 9º<\u002Fdiv>\n        <h2>Direito de Acesso e Transparência ao Titular<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tcol\">\n      <div>\n        <p>O titular tem direito ao <strong>acesso facilitado<\u002Fstrong> às informações sobre o tratamento de seus dados, que deverão ser disponibilizadas de forma <strong>clara, adequada e ostensiva<\u002Fstrong>.<\u002Fp>\n        <div class=\"cat-h\" style=\"color:var(--blue);border-color:var(--lblue2);margin-top:20px\">Informações Obrigatórias ao Titular<\u002Fdiv>\n        <ul style=\"display:flex;flex-direction:column;gap:8px;margin-top:4px\">\n          <li>Finalidade específica do tratamento<\u002Fli>\n          <li>Forma e duração do tratamento, observados os segredos comercial e industrial<\u002Fli>\n          <li>Identificação do controlador<\u002Fli>\n          <li>Informações de contato do encarregado (DPO)<\u002Fli>\n          <li>Informações sobre o uso compartilhado e a finalidade<\u002Fli>\n          <li>Responsabilidades dos agentes de tratamento<\u002Fli>\n          <li>Direitos do titular, com menção explícita aos previstos na LGPD<\u002Fli>\n        <\u002Ful>\n        <div class=\"hl\" style=\"background:var(--lblue);border-color:var(--blue);margin-top:16px\">\n          <h4 style=\"color:var(--blue)\">Consentimento Vinculado<\u002Fh4>\n          <p>Quando o tratamento é baseado em consentimento, o controlador deve informar ao titular a <strong>possibilidade de não fornecer o consentimento<\u002Fstrong> e as consequências da negativa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><img src=\"51e9cb29-3944-44f0-ade5-f8d8ca4f61ac\" alt=\"Direitos do titular — LGPD\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 10 ============ -->\n<section id=\"a10\" class=\"sec\" data-screen-label=\"Art. 10 — Legítimo Interesse\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--purple)\">10<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lpurp);color:var(--purple)\">Artigo 10º<\u002Fdiv>\n        <h2>Legítimo Interesse do Controlador<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O legítimo interesse do controlador somente poderá ser invocado para finalidades legítimas, consideradas a partir de situações concretas:<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-left:4px solid var(--purple)\">\n        <h3>Finalidades Legítimas<\u002Fh3>\n        <p>O tratamento deve ter como base interesses <strong>legítimos, concretos e razoavelmente esperados<\u002Fstrong> pelo titular no contexto do relacionamento com o controlador.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--purple)\">\n        <h3>Expectativas do Titular<\u002Fh3>\n        <p>Deve ser considerado o <strong>contexto, as expectativas razoáveis<\u002Fstrong> do titular e o impacto previsto sobre seus direitos e liberdades fundamentais.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--purple)\">\n        <h3>RIPD e a ANPD<\u002Fh3>\n        <p>A ANPD poderá solicitar ao controlador o <strong>Relatório de Impacto (RIPD)<\u002Fstrong> quando o tratamento tiver como fundamento o legítimo interesse.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lpurp);border-color:var(--purple);margin-top:20px\">\n      <h4 style=\"color:var(--purple)\">Direito de Oposição do Titular<\u002Fh4>\n      <p>O titular dos dados pode a qualquer momento <strong>opor-se ao tratamento<\u002Fstrong> realizado com fundamento no legítimo interesse, quando houver descumprimento das disposições da LGPD. O controlador deverá cessar o tratamento.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 11 ============ -->\n<section id=\"a11\" class=\"sec\" data-screen-label=\"Art. 11 — Dados Sensíveis\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">11<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 11º<\u002Fdiv>\n        <h2>Tratamento de Dados Pessoais Sensíveis<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Exemplos de dados sensíveis -->\n    <div class=\"card\" style=\"background:var(--lred);border:1px solid #FFCDD2;margin-bottom:24px\">\n      <h3 style=\"color:var(--red);margin-bottom:14px\">Categorias de Dados Sensíveis — Art. 5º, II<\u002Fh3>\n      <div class=\"g5\">\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Origem Racial ou Étnica<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Convicção Religiosa<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Opinião Política<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Filiação Sindical<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Dados de Saúde<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Vida Sexual<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Dados Genéticos<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)\"><div style=\"font-size:1.4rem;margin-bottom:4px\">■<\u002Fdiv><div style=\"font-size:.78rem;font-weight:600;color:var(--red)\">Dados Biométricos<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tcol\">\n      <div>\n        <p style=\"margin-bottom:18px\">O tratamento de dados sensíveis somente poderá ocorrer nas seguintes hipóteses:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">I<\u002Fdiv><div><h3>Consentimento Específico e Destacado<\u002Fh3><p>Do titular ou de seu responsável legal, para finalidade específica.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">II<\u002Fdiv><div><h3>Cumprimento de Obrigação Legal<\u002Fh3><p>Para cumprimento de obrigação legal ou regulatória pelo controlador.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">III<\u002Fdiv><div><h3>Políticas Públicas<\u002Fh3><p>Pela administração pública, para execução de políticas públicas previstas em leis ou regulamentos.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">IV<\u002Fdiv><div><h3>Estudos por Órgão de Pesquisa<\u002Fh3><p>Garantida, sempre que possível, a anonimização dos dados sensíveis.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">V<\u002Fdiv><div><h3>Exercício Regular de Direitos<\u002Fh3><p>Inclusive em contrato e em processo judicial, administrativo e arbitral.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">VI<\u002Fdiv><div><h3>Proteção da Vida<\u002Fh3><p>Proteção da vida ou da incolumidade física do titular ou de terceiro.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">VII<\u002Fdiv><div><h3>Tutela da Saúde<\u002Fh3><p>Exclusivamente por profissional de saúde ou entidade de saúde devidamente habilitados.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:4px solid var(--red)\"><div class=\"icard-num\" style=\"background:var(--red)\">VIII<\u002Fdiv><div><h3>Prevenção à Fraude e Segurança<\u002Fh3><p>Para garantia da prevenção à fraude e à segurança do titular, em processos de identificação e autenticação de cadastro.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <img src=\"a213079f-0d03-46f2-89ba-01dcc369864d\" alt=\"Tipos de dados pessoais — LGPD\">\n        <div class=\"hl\" style=\"background:var(--lred);border-color:var(--red);margin-top:16px\">\n          <h4 style=\"color:var(--red)\">Vedação Importante<\u002Fh4>\n          <p>É <strong>vedado<\u002Fstrong> ao controlador comunicar ou compartilhar dados sensíveis com outros controladores sem o consentimento do titular ou sem hipótese legal que autorize expressamente.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lamber);border-color:var(--amber);margin-top:12px\">\n          <h4 style=\"color:var(--amber)\">Dados de Crianças e Adolescentes<\u002Fh4>\n          <p>O tratamento de dados de crianças e adolescentes é equiparado ao tratamento de dados sensíveis e deve ser realizado no <strong>melhor interesse<\u002Fstrong> do menor, com consentimento específico do responsável legal.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"bae6d517-1900-420d-997f-17291432e5c8\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei nº 13.709, de 14 de agosto de 2018<\u002Fp>\n  <p style=\"margin-top:8px;font-size:.72rem;opacity:.55\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\n// Smooth scroll nav\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\n\n// Highlight active nav link\nconst secs = [...document.querySelectorAll('section[id]')];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = secs[0]?.id;\n  secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n  const active = links.find(a => a.getAttribute('href') === '#' + cur);\n  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth', block: 'nearest' });\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
