document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>LGPD — Artigos 31 a 40 | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--blue2:#1976D2;--lblue:#E3F2FD;--lblue2:#BBDEFB;\n  --teal:#00695C;--lteal:#E0F2F1;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --red:#C62828;--lred:#FFEBEE;\n  --purple:#6A1B9A;--lpurp:#F3E5F5;\n  --cyan:#00838F;--lcyan:#E0F7FA;\n  --gov:#1A237E;--lgov:#E8EAF6;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}\nh1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2}\nh2{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;line-height:1.3}\nh3{font-size:1rem;font-weight:700;line-height:1.4}\nh4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\np{color:var(--muted)}\nstrong{color:var(--text);font-weight:600}\nul{padding-left:18px;color:var(--muted)}\nli+li{margin-top:5px}\n\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n.sec{padding:56px 0}\n.sec:nth-child(odd){background:#fff}\n.sec:nth-child(even){background:var(--bg)}\n\n.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}\n.art-num{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:800;color:#fff}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:5px}\n\n.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}\n.tcol{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}\n\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.icard{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}\n.icard-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff}\n.dcard{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05)}\n.dcard .dn{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}\n.dcard .dt{font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--text)}\n.dcard .dd{font-size:.8rem;color:var(--muted)}\n\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n.cat-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:2px solid;margin:24px 0 12px}\n\n/* Chapter divider */\n.chap-divider{padding:22px 0}\n.chap-divider-inner{display:flex;align-items:center;gap:16px}\n.chap-pill{background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}\n\n/* Vetado card */\n.vetado{background:#F5F5F5;border:2px dashed #BDBDBD;border-radius:var(--r);padding:28px;text-align:center}\n.vetado h3{color:#9E9E9E;font-size:1.2rem;margin-bottom:8px}\n.vetado p{color:#BDBDBD}\n.vetado-badge{display:inline-block;background:#E0E0E0;color:#757575;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:20px;margin-bottom:14px}\n\n/* Transfer mechanism card */\n.mech-card{border-radius:12px;padding:18px;border:1px solid var(--border);background:var(--card);box-shadow:var(--sh)}\n.mech-card h3{margin-bottom:6px}\n.mech-letter{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:#fff;margin-bottom:10px}\n\n/* DPO roles */\n.role-card{display:flex;gap:12px;padding:14px;border-radius:10px;background:var(--card);border:1px solid var(--border);align-items:flex-start}\n.role-num{flex-shrink:0;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff}\n\n/* Flow */\n.flow{display:flex;flex-direction:column;gap:0}\n.flow-step{display:flex;gap:14px;align-items:flex-start;padding:14px 0}\n.flow-step+.flow-step{border-top:1px solid var(--border)}\n.flow-icon{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;color:#fff}\n\n/* Globe visual */\n.globe-wrap{background:linear-gradient(135deg,#006064,#00838F);border-radius:var(--r);padding:28px;color:#fff}\n\n/* Intro band */\n.intro-band{background:linear-gradient(135deg,#0D1B4B 0%,#006064 100%);color:#fff;padding:48px 0}\n.intro-band h1{color:#fff}\n.intro-band p{color:rgba(255,255,255,.8)}\n.progress-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:24px}\n.prog-pill{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700}\n.prog-done{background:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}\n.prog-now{background:#fff;color:var(--navy)}\n\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--cyan);color:#fff}\n\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\nfooter a{color:rgba(255,255,255,.55);text-decoration:none;font-size:.8rem;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;display:inline-block;margin:4px}\n\n@media(max-width:680px){.tcol{grid-template-columns:1fr}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"d8680c4e-b27e-4682-9b38-020130b30005\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- INTRO BANNER -->\n<section class=\"intro-band\">\n  <div class=\"wrap\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;flex-wrap:wrap\">\n      <div>\n        <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Lei nº 13.709/2018 — Continuação<\u002Fdiv>\n        <h1>LGPD: Artigos 31 a 40<\u002Fh1>\n        <p style=\"margin-top:8px;max-width:560px\"><strong style=\"color:#fff\">Capítulo IV:<\u002Fstrong> Transferência Internacional de Dados — regras para envio de dados ao exterior. <strong style=\"color:#fff\">Capítulo V:<\u002Fstrong> Agentes de Tratamento — responsabilidades do controlador, operador e encarregado (DPO).<\u002Fp>\n        <div class=\"progress-bar\">\n          <span class=\"prog-pill prog-done\">Art. 1–11 ✓<\u002Fspan>\n          <span class=\"prog-pill prog-done\">Art. 12–20 ✓<\u002Fspan>\n          <span class=\"prog-pill prog-done\">Art. 21–30 ✓<\u002Fspan>\n          <span class=\"prog-pill prog-now\">Art. 31–40 ← você está aqui<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:220px\">\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">10<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Artigos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">9<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Bases p/ transferência<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">4<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Mecanismos de garantia<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\">\n          <div style=\"font-size:1.6rem;font-weight:800;color:#fff\">5<\u002Fdiv>\n          <div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Atribuições do DPO<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\">\n  <ul>\n    <li><a href=\"#a31\">Art. 31 — Transferência<\u002Fa><\u002Fli>\n    <li><a href=\"#a32\">Art. 32 — ANPD<\u002Fa><\u002Fli>\n    <li><a href=\"#a33\">Art. 33 — Adequação<\u002Fa><\u002Fli>\n    <li><a href=\"#a34\">Art. 34 — Garantias<\u002Fa><\u002Fli>\n    <li><a href=\"#a35\">Art. 35 — Autorização<\u002Fa><\u002Fli>\n    <li><a href=\"#a36\">Art. 36 — Exceções<\u002Fa><\u002Fli>\n    <li><a href=\"#a37\">Art. 37 — Registro<\u002Fa><\u002Fli>\n    <li><a href=\"#a38\">Art. 38 — RIPD<\u002Fa><\u002Fli>\n    <li><a href=\"#a39\">Art. 39 — Encarregado<\u002Fa><\u002Fli>\n    <li><a href=\"#a40\">Art. 40 — ANPD/DPO<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- CHAPTER IV DIVIDER -->\n<div style=\"background:linear-gradient(135deg,#006064,#00838F);padding:22px 0\">\n  <div class=\"wrap chap-divider-inner\">\n    <div class=\"chap-pill\">Capítulo IV<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Da Transferência Internacional de Dados Pessoais<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Regras para envio de dados pessoais a países estrangeiros e organismos internacionais<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 31 ============ -->\n<section id=\"a31\" class=\"sec\" data-screen-label=\"Art. 31 — Transferência Internacional\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--cyan)\">31<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lcyan);color:var(--cyan)\">Artigo 31º<\u002Fdiv>\n        <h2>Condições para Transferência Internacional de Dados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A transferência internacional de dados pessoais somente é permitida nos seguintes casos:<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"globe-wrap\" style=\"margin-bottom:20px\">\n          <h3 style=\"color:#fff;margin-bottom:14px\">Duas Rotas Principais<\u002Fh3>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <div style=\"background:rgba(255,255,255,.15);border-radius:10px;padding:14px\">\n              <div style=\"font-size:.72rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px\">Rota 1<\u002Fdiv>\n              <h3 style=\"color:#fff;font-size:.95rem\">País com Proteção Adequada<\u002Fh3>\n              <p style=\"color:rgba(255,255,255,.8);font-size:.82rem;margin-top:4px\">País de destino avaliado pela ANPD como tendo nível equivalente de proteção.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.15);border-radius:10px;padding:14px\">\n              <div style=\"font-size:.72rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px\">Rota 2<\u002Fdiv>\n              <h3 style=\"color:#fff;font-size:.95rem\">Garantias do Controlador<\u002Fh3>\n              <p style=\"color:rgba(255,255,255,.8);font-size:.82rem;margin-top:4px\">Controlador comprova garantias de cumprimento dos princípios por mecanismo reconhecido.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cat-h\" style=\"color:var(--cyan);border-color:var(--lcyan)\">Demais Hipóteses Permitidas<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">III<\u002Fdiv><div><h3>Cooperação Jurídica Internacional<\u002Fh3><p>Necessária para cooperação jurídica entre órgãos públicos de inteligência, investigação e persecução criminal.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">IV<\u002Fdiv><div><h3>Proteção da Vida<\u002Fh3><p>Necessária para proteção da vida ou da incolumidade física do titular ou de terceiro.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">V<\u002Fdiv><div><h3>Autorização da ANPD<\u002Fh3><p>Quando a Autoridade Nacional de Proteção de Dados autorizar a transferência.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">VI<\u002Fdiv><div><h3>Acordo Internacional<\u002Fh3><p>Quando a transferência resultar de compromisso assumido em acordo de cooperação internacional.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">VII<\u002Fdiv><div><h3>Política Pública<\u002Fh3><p>Necessária para execução de política pública ou atribuição legal de serviço público.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">VIII<\u002Fdiv><div><h3>Consentimento Específico<\u002Fh3><p>Quando o titular fornecer consentimento <strong>específico e em destaque<\u002Fstrong> para a transferência internacional, com informação prévia sobre o país de destino.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--cyan)\"><div class=\"icard-num\" style=\"background:var(--cyan)\">IX<\u002Fdiv><div><h3>Bases do Art. 7º<\u002Fh3><p>Quando necessária para atender as hipóteses de tratamento sem consentimento previstas no Art. 7º da LGPD.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:24px\">\n          <h3 style=\"color:var(--cyan);margin-bottom:16px\">Mecanismos de Garantia — Inciso II<\u002Fh3>\n          <p style=\"margin-bottom:16px\">Quando o controlador optar por oferecer <strong>garantias próprias<\u002Fstrong> (sem depender de avaliação de adequação), poderá utilizar:<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div class=\"mech-card\">\n              <div class=\"mech-letter\" style=\"background:var(--blue)\">a<\u002Fdiv>\n              <h3>Cláusulas Contratuais Específicas<\u002Fh3>\n              <p style=\"font-size:.83rem\">Acordos bilaterais entre as partes da transferência, com cláusulas de proteção adaptadas ao caso concreto.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"mech-card\">\n              <div class=\"mech-letter\" style=\"background:var(--teal)\">b<\u002Fdiv>\n              <h3>Cláusulas-Padrão Contratuais<\u002Fh3>\n              <p style=\"font-size:.83rem\">Modelos de cláusulas pré-aprovados e emitidos pela ANPD ou por autoridades estrangeiras reconhecidas.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"mech-card\">\n              <div class=\"mech-letter\" style=\"background:var(--purple)\">c<\u002Fdiv>\n              <h3>Normas Corporativas Globais (BCR)<\u002Fh3>\n              <p style=\"font-size:.83rem\"><em>Binding Corporate Rules<\u002Fem> — políticas internas de grupos empresariais multinacionais aprovadas pela ANPD.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"mech-card\">\n              <div class=\"mech-letter\" style=\"background:var(--amber)\">d<\u002Fdiv>\n              <h3>Selos, Certificados e Códigos de Conduta<\u002Fh3>\n              <p style=\"font-size:.83rem\">Instrumentos de certificação regularmente emitidos por organismos reconhecidos pela ANPD como garantia de cumprimento.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 32 ============ -->\n<section id=\"a32\" class=\"sec\" data-screen-label=\"Art. 32 — Competência Regulatória da ANPD\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--cyan)\">32<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lcyan);color:var(--cyan)\">Artigo 32º<\u002Fdiv>\n        <h2>Competência da ANPD para Regulamentar Transferências<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A Autoridade Nacional de Proteção de Dados poderá dispor sobre as transferências de dados pessoais para países estrangeiros ou organismos internacionais, podendo:<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--cyan)\">\n        <h3>Dispor sobre Transferências<\u002Fh3>\n        <p>Estabelecer regras complementares sobre quando e como as transferências internacionais podem ocorrer, criando maior segurança jurídica para controladores e operadores.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--cyan)\">\n        <h3>Requisitos Adicionais<\u002Fh3>\n        <p>Impor requisitos adicionais específicos para determinados tipos de transferência, considerando a sensibilidade dos dados ou os riscos ao titular.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--cyan)\">\n        <h3>Avaliação de Países<\u002Fh3>\n        <p>Elaborar e publicar a lista de países e organismos que oferecem <strong>grau de proteção adequado<\u002Fstrong>, bem como atualizar periodicamente essa avaliação.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lcyan);border-color:var(--cyan)\">\n      <h4 style=\"color:var(--cyan)\">Papel da ANPD nas Transferências<\u002Fh4>\n      <p>A ANPD atua como <strong>árbitro central<\u002Fstrong> das transferências internacionais, avaliando países, aprovando mecanismos de garantia, autorizando transferências específicas e fiscalizando o cumprimento das regras — papel equivalente ao das autoridades de proteção de dados europeias sob o GDPR.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 33 ============ -->\n<section id=\"a33\" class=\"sec\" data-screen-label=\"Art. 33 — Critérios de Adequação\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--cyan)\">33<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lcyan);color:var(--cyan)\">Artigo 33º<\u002Fdiv>\n        <h2>Critérios para Avaliação do Grau de Proteção Adequada<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Na avaliação do nível de proteção adequado conferido por país estrangeiro ou organismo internacional, a ANPD levará em consideração:<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">I<\u002Fdiv>\n        <div><h3>Legislação Vigente<\u002Fh3><p>A legislação geral e setorial do país de destino ou da organização internacional sobre proteção de dados pessoais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">II<\u002Fdiv>\n        <div><h3>Natureza dos Dados<\u002Fh3><p>As características dos dados pessoais a serem transferidos, especialmente se incluem dados sensíveis ou de crianças e adolescentes.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">III<\u002Fdiv>\n        <div><h3>Cumprimento dos Princípios<\u002Fh3><p>O cumprimento dos princípios gerais de proteção de dados e dos direitos do titular pelo país receptor.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">IV<\u002Fdiv>\n        <div><h3>Medidas de Segurança<\u002Fh3><p>A adoção de medidas de segurança técnicas e administrativas equivalentes às exigidas pela LGPD.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">V<\u002Fdiv>\n        <div><h3>Garantias Institucionais<\u002Fh3><p>A existência de garantias judiciais e institucionais para o efetivo respeito aos direitos de proteção de dados pessoais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">VI<\u002Fdiv>\n        <div><h3>Circunstâncias Específicas<\u002Fh3><p>Outras circunstâncias relativas à transferência, como o setor de atividade e a finalidade do tratamento no país de destino.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 34 ============ -->\n<section id=\"a34\" class=\"sec\" data-screen-label=\"Art. 34 — Garantias Contratuais\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--cyan)\">34<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lcyan);color:var(--cyan)\">Artigo 34º<\u002Fdiv>\n        <h2>Cláusulas Contratuais e Normas Corporativas Globais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">As <strong>cláusulas contratuais<\u002Fstrong> referidas no Art. 31, II, e as <strong>normas corporativas globais<\u002Fstrong> deverão ser submetidas à análise e aprovação da ANPD, que poderá dispor sobre padrões mínimos e requisitos específicos para cada mecanismo.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"card\" style=\"border-top:3px solid var(--cyan);margin-bottom:14px\">\n          <h3>Cláusulas Contratuais Específicas<\u002Fh3>\n          <p>Acordos bilaterais entre exportador e importador de dados, com obrigações de proteção equivalentes às da LGPD, adaptadas ao caso concreto da transferência.<\u002Fp>\n          <ul style=\"margin-top:10px;display:flex;flex-direction:column;gap:6px\">\n            <li>Negociadas caso a caso entre as partes<\u002Fli>\n            <li>Devem incluir direitos dos titulares<\u002Fli>\n            <li>Preveem medidas de segurança adequadas<\u002Fli>\n            <li>Estabelecem responsabilidades em caso de incidente<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"border-top:3px solid var(--purple)\">\n          <h3>Normas Corporativas Globais (BCR)<\u002Fh3>\n          <p>Políticas internas vinculantes de grupos empresariais multinacionais, aprovadas pela ANPD, que regem todas as transferências intragrupo.<\u002Fp>\n          <ul style=\"margin-top:10px;display:flex;flex-direction:column;gap:6px\">\n            <li>Aplicam-se a todas as entidades do grupo<\u002Fli>\n            <li>Devem ser juridicamente vinculantes<\u002Fli>\n            <li>Exigem aprovação prévia da ANPD<\u002Fli>\n            <li>Dispensam avaliação caso a caso dentro do grupo<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"background:var(--lcyan);border:none;padding:24px\">\n          <h3 style=\"color:var(--cyan);margin-bottom:14px\">Por que usar BCR?<\u002Fh3>\n          <div class=\"flow\">\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--cyan)\">1<\u002Fdiv>\n              <div><h3>Empresa com filiais no exterior<\u002Fh3><p>Grupo multinacional precisa compartilhar dados de clientes brasileiros entre suas subsidiárias globais.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--cyan)\">2<\u002Fdiv>\n              <div><h3>Aprovação única pela ANPD<\u002Fh3><p>O grupo submete suas BCRs à ANPD, que avalia se os padrões internos garantem proteção equivalente à LGPD.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--green)\">3<\u002Fdiv>\n              <div><h3>Transferências simplificadas<\u002Fh3><p>Uma vez aprovadas, as BCRs cobrem todas as transferências intragrupo sem necessidade de aprovação individual para cada fluxo.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 35 ============ -->\n<section id=\"a35\" class=\"sec\" data-screen-label=\"Art. 35 — Autorização Específica da ANPD\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--cyan)\">35<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lcyan);color:var(--cyan)\">Artigo 35º<\u002Fdiv>\n        <h2>Autorização Específica pela ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A ANPD poderá autorizar, mediante petição fundamentada do controlador, a transferência internacional de dados pessoais para países que não dispõem de grau de proteção adequado, desde que atendidos requisitos específicos:<\u002Fp>\n    <div class=\"g2\" style=\"margin-bottom:20px\">\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">I<\u002Fdiv>\n        <div>\n          <h3>Necessidade Específica e Fundamentada<\u002Fh3>\n          <p>O controlador deve demonstrar a <strong>necessidade específica<\u002Fstrong> da transferência, indicando a finalidade concreta e os dados a serem transferidos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">II<\u002Fdiv>\n        <div>\n          <h3>Garantias Adicionais<\u002Fh3>\n          <p>Apresentação de <strong>garantias adicionais<\u002Fstrong> de proteção além dos mecanismos padrão, especialmente para dados sensíveis ou de grupos vulneráveis.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">III<\u002Fdiv>\n        <div>\n          <h3>Interesse Público<\u002Fh3>\n          <p>Quando a transferência atender a <strong>interesse público relevante<\u002Fstrong>, como cooperação científica ou cumprimento de tratados internacionais.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard\" style=\"border-left:4px solid var(--cyan)\">\n        <div class=\"icard-num\" style=\"background:var(--cyan)\">IV<\u002Fdiv>\n        <div>\n          <h3>Não Prejudicar o Titular<\u002Fh3>\n          <p>A transferência não poderá <strong>prejudicar os direitos<\u002Fstrong> e garantias fundamentais do titular previstos na Constituição Federal e na LGPD.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lcyan);border-color:var(--cyan)\">\n      <h4 style=\"color:var(--cyan)\">Autorização Excepcional<\u002Fh4>\n      <p>A autorização específica da ANPD é uma <strong>medida de exceção<\u002Fstrong> para situações concretas que não se enquadrem nas demais hipóteses do Art. 31. A ANPD estabelecerá prazo de validade e condições para a autorização, podendo revogá-la caso cesse o atendimento dos requisitos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 36 ============ -->\n<section id=\"a36\" class=\"sec\" data-screen-label=\"Art. 36 — Exceções ao Regime de Transferência\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--cyan)\">36<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lcyan);color:var(--cyan)\">Artigo 36º<\u002Fdiv>\n        <h2>Responsabilidade nas Transferências Internacionais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">As <strong>garantias suficientes<\u002Fstrong> de cumprimento dos princípios gerais de proteção e dos direitos do titular, previstas no inciso II do Art. 31, deverão ser fornecidas pelo agente de tratamento responsável pela transferência.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-left:4px solid var(--cyan)\">\n        <h3>Responsabilidade do Exportador<\u002Fh3>\n        <p>O controlador ou operador que <strong>transfere os dados<\u002Fstrong> ao exterior é responsável por garantir que o destinatário ofereça proteção equivalente à LGPD, seja qual for o mecanismo utilizado.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--cyan)\">\n        <h3>Obrigação do Importador<\u002Fh3>\n        <p>O destinatário estrangeiro dos dados deve cumprir os termos acordados no mecanismo de garantia e <strong>responder solidariamente<\u002Fstrong> pelo tratamento inadequado que causar dano ao titular.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--cyan)\">\n        <h3>Verificação Contínua<\u002Fh3>\n        <p>A garantia não se esgota no ato da transferência — o exportador deve <strong>monitorar continuamente<\u002Fstrong> se as condições de proteção no país de destino se mantêm adequadas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lamber);border-color:var(--amber)\">\n      <h4 style=\"color:var(--amber)\">Atenção — Mudança nas Condições do País Receptor<\u002Fh4>\n      <p>Se o país receptor mudar sua legislação de forma a reduzir o nível de proteção, o controlador deve <strong>suspender imediatamente<\u002Fstrong> as transferências e notificar a ANPD, adotando medidas alternativas para proteção dos titulares afetados.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CHAPTER V DIVIDER -->\n<div style=\"background:linear-gradient(135deg,#1B5E20,#2E7D32);padding:22px 0\">\n  <div class=\"wrap chap-divider-inner\">\n    <div class=\"chap-pill\">Capítulo V<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Dos Agentes de Tratamento de Dados Pessoais<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Responsabilidades do controlador, operador e encarregado (DPO)<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 37 ============ -->\n<section id=\"a37\" class=\"sec\" data-screen-label=\"Art. 37 — Registro das Atividades de Tratamento\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--green)\">37<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgreen);color:var(--green)\">Artigo 37º — Capítulo V<\u002Fdiv>\n        <h2>Registro das Atividades de Tratamento<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O controlador e o operador devem manter <strong>registro das operações de tratamento de dados pessoais<\u002Fstrong> que realizarem, especialmente quando baseado em legítimo interesse.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"g2\" style=\"margin-bottom:16px\">\n          <div class=\"card\" style=\"border-top:3px solid var(--green)\">\n            <h3>Registro do Controlador<\u002Fh3>\n            <p>Deve registrar <strong>todas as operações<\u002Fstrong> de tratamento, indicando finalidade, base legal, categorias de dados, titulares envolvidos, medidas de segurança e prazos de retenção.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"border-top:3px solid var(--teal)\">\n            <h3>Registro do Operador<\u002Fh3>\n            <p>Deve registrar todas as atividades realizadas <strong>em nome do controlador<\u002Fstrong>, inclusive as subcontratações e os fluxos de dados entre sistemas.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lgreen);border-color:var(--green)\">\n          <h4 style=\"color:var(--green)\">Regulamentação pela ANPD<\u002Fh4>\n          <p>A ANPD poderá dispensar a obrigação de manutenção do registro de atividades para agentes de tratamento cujo porte ou volume de operações <strong>não represente riscos relevantes<\u002Fstrong> aos titulares, observados os critérios estabelecidos em regulamento.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:24px\">\n          <h3 style=\"color:var(--green);margin-bottom:14px\">Conteúdo Mínimo do Registro<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;gap:10px;align-items:center;padding:8px;background:var(--lgreen);border-radius:8px\">\n              <div style=\"flex-shrink:0;width:24px;height:24px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800\">1<\u002Fdiv>\n              <span style=\"font-size:.88rem;font-weight:600\">Nome e contato do controlador e do encarregado<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;padding:8px;background:var(--lgreen);border-radius:8px\">\n              <div style=\"flex-shrink:0;width:24px;height:24px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800\">2<\u002Fdiv>\n              <span style=\"font-size:.88rem;font-weight:600\">Finalidades do tratamento<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;padding:8px;background:var(--lgreen);border-radius:8px\">\n              <div style=\"flex-shrink:0;width:24px;height:24px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800\">3<\u002Fdiv>\n              <span style=\"font-size:.88rem;font-weight:600\">Categorias de titulares e de dados pessoais<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;padding:8px;background:var(--lgreen);border-radius:8px\">\n              <div style=\"flex-shrink:0;width:24px;height:24px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800\">4<\u002Fdiv>\n              <span style=\"font-size:.88rem;font-weight:600\">Destinatários e transferências internacionais<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;padding:8px;background:var(--lgreen);border-radius:8px\">\n              <div style=\"flex-shrink:0;width:24px;height:24px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800\">5<\u002Fdiv>\n              <span style=\"font-size:.88rem;font-weight:600\">Prazos de exclusão e medidas de segurança<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 38 ============ -->\n<section id=\"a38\" class=\"sec\" data-screen-label=\"Art. 38 — Relatório de Impacto (RIPD)\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--green)\">38<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lgreen);color:var(--green)\">Artigo 38º<\u002Fdiv>\n        <h2>Relatório de Impacto à Proteção de Dados Pessoais (RIPD)<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A autoridade nacional poderá determinar ao controlador que elabore <strong>relatório de impacto à proteção de dados pessoais<\u002Fstrong>, incluindo dados sensíveis, referente a suas operações de tratamento de dados, observados os segredos comercial e industrial.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"card\" style=\"background:linear-gradient(135deg,#2E7D32,#43A047);padding:24px;margin-bottom:14px\">\n          <h3 style=\"color:#fff;margin-bottom:12px\">O que é o RIPD?<\u002Fh3>\n          <p style=\"color:rgba(255,255,255,.9)\">Documento elaborado pelo controlador que descreve os processos de tratamento de dados pessoais que <strong style=\"color:#A5D6A7\">podem gerar riscos<\u002Fstrong> às liberdades civis e aos direitos fundamentais dos titulares, bem como as medidas, salvaguardas e mecanismos de mitigação de risco.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"g2\">\n          <div class=\"card\" style=\"border-top:3px solid var(--green)\">\n            <h3>Quando é obrigatório<\u002Fh3>\n            <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n              <li>Tratamentos em larga escala de dados sensíveis<\u002Fli>\n              <li>Monitoramento sistemático de titulares<\u002Fli>\n              <li>Decisões automatizadas com impacto legal<\u002Fli>\n              <li>Quando a ANPD determinar para setores específicos<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"border-top:3px solid var(--green)\">\n            <h3>Conteúdo mínimo<\u002Fh3>\n            <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n              <li>Descrição dos tipos de dados coletados<\u002Fli>\n              <li>Metodologia usada no tratamento<\u002Fli>\n              <li>Análise dos riscos identificados<\u002Fli>\n              <li>Medidas de mitigação adotadas<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:24px\">\n          <h3 style=\"color:var(--green);margin-bottom:14px\">Etapas do RIPD<\u002Fh3>\n          <div class=\"flow\">\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--green)\">1<\u002Fdiv>\n              <div><h3>Identificação dos Fluxos de Dados<\u002Fh3><p>Mapear todos os dados coletados, suas origens, finalidades e destinatários.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--green)\">2<\u002Fdiv>\n              <div><h3>Avaliação de Riscos<\u002Fh3><p>Identificar ameaças aos direitos dos titulares, avaliar probabilidade e impacto de cada risco.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--green)\">3<\u002Fdiv>\n              <div><h3>Medidas de Mitigação<\u002Fh3><p>Definir controles técnicos e organizacionais para reduzir riscos a nível aceitável.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--teal)\">4<\u002Fdiv>\n              <div><h3>Revisão Periódica<\u002Fh3><p>Atualizar o RIPD sempre que houver mudanças significativas nos processos de tratamento ou surgimento de novos riscos.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 39 ============ -->\n<section id=\"a39\" class=\"sec\" data-screen-label=\"Art. 39 — Encarregado (DPO)\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">39<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 39º — Artigo Central<\u002Fdiv>\n        <h2>Encarregado pelo Tratamento de Dados — DPO<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O controlador deverá indicar encarregado pelo tratamento de dados pessoais. A <strong>identidade e as informações de contato<\u002Fstrong> do encarregado deverão ser divulgadas publicamente, de forma clara e objetiva, preferencialmente no sítio eletrônico do controlador.<\u002Fp>\n\n    <div style=\"background:linear-gradient(135deg,#00695C,#00897B);border-radius:var(--r);padding:28px;color:#fff;margin-bottom:24px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px\">\n        <div style=\"text-align:center\">\n          <div style=\"font-size:.75rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px\">Quem é<\u002Fdiv>\n          <div style=\"color:#fff;font-weight:700;font-size:.95rem\">Pessoa natural ou jurídica indicada pelo controlador<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)\">\n          <div style=\"font-size:.75rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px\">O que faz<\u002Fdiv>\n          <div style=\"color:#fff;font-weight:700;font-size:.95rem\">Canal entre controlador, titulares e ANPD<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center\">\n          <div style=\"font-size:.75rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px\">Obrigatório?<\u002Fdiv>\n          <div style=\"color:#fff;font-weight:700;font-size:.95rem\">Sim — para todos os controladores<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cat-h\" style=\"color:var(--teal);border-color:var(--lteal)\">Atribuições do Encarregado — §1º<\u002Fdiv>\n    <div class=\"g2\" style=\"margin-bottom:20px\">\n      <div class=\"role-card\">\n        <div class=\"role-num\" style=\"background:var(--teal)\">I<\u002Fdiv>\n        <div><h3>Aceitar Reclamações e Comunicações<\u002Fh3><p>Receber reclamações e comunicações dos titulares, prestar esclarecimentos e adotar as providências cabíveis.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\" style=\"background:var(--teal)\">II<\u002Fdiv>\n        <div><h3>Receber Comunicações da ANPD<\u002Fh3><p>Receber comunicações da Autoridade Nacional, adotar providências e prestar esclarecimentos nos prazos estabelecidos.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\" style=\"background:var(--teal)\">III<\u002Fdiv>\n        <div><h3>Orientar os Funcionários<\u002Fh3><p>Orientar os funcionários e os contratados da entidade a respeito das práticas a serem tomadas em relação à proteção de dados pessoais.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\" style=\"background:var(--teal)\">IV<\u002Fdiv>\n        <div><h3>Executar Demais Atribuições<\u002Fh3><p>Executar as atribuições determinadas pelo controlador ou estabelecidas em normas complementares da ANPD.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"g2\">\n      <div class=\"hl\" style=\"background:var(--lteal);border-color:var(--teal);margin-top:0\">\n        <h4 style=\"color:var(--teal)\">§2º — Atividades do Encarregado<\u002Fh4>\n        <p>As atividades do encarregado consistem em informar, aconselhar e fiscalizar o controlador, o operador e os funcionários, com base nas instruções fornecidas pelo controlador — <strong>podendo ser exercidas por pessoa jurídica<\u002Fstrong> (empresa especializada).<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"hl\" style=\"background:var(--lgreen);border-color:var(--green);margin-top:0\">\n        <h4 style=\"color:var(--green)\">§3º — Publicidade da Identidade<\u002Fh4>\n        <p>A identidade e o contato do encarregado devem ser <strong>divulgados publicamente<\u002Fstrong>, de forma clara e acessível — normalmente na política de privacidade e no site do controlador — para que titulares e a ANPD possam contatá-lo diretamente.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 40 ============ -->\n<section id=\"a40\" class=\"sec\" data-screen-label=\"Art. 40 — Regulamentação do Encarregado pela ANPD\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--teal)\">40<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lteal);color:var(--teal)\">Artigo 40º<\u002Fdiv>\n        <h2>Regulamentação Complementar do Encarregado pela ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A autoridade nacional poderá estabelecer <strong>normas complementares<\u002Fstrong> sobre a definição e as atribuições do encarregado, inclusive hipóteses de dispensa da necessidade de sua indicação, conforme a natureza e o porte da entidade ou o volume de operações de tratamento de dados.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--teal)\">\n        <h3>Normas Complementares<\u002Fh3>\n        <p>A ANPD pode detalhar as qualificações, competências e forma de atuação do encarregado, bem como os requisitos mínimos para o exercício da função.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--teal)\">\n        <h3>Hipóteses de Dispensa<\u002Fh3>\n        <p>Microempresas e startups com operações de baixo risco podem ser dispensadas da obrigação de indicar encarregado formal, a critério da ANPD, mediante critérios objetivos.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--teal)\">\n        <h3>Porte e Volume<\u002Fh3>\n        <p>A obrigatoriedade e o nível de formalização exigidos levam em conta o porte da organização e o volume e a sensibilidade dos dados tratados — princípio da proporcionalidade regulatória.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lteal);border-color:var(--teal)\">\n      <h4 style=\"color:var(--teal)\">DPO no Brasil × DPO no GDPR Europeu<\u002Fh4>\n      <p>O encarregado da LGPD tem papel semelhante ao <em>Data Protection Officer<\u002Fem> (DPO) do GDPR europeu, mas com escopo mais amplo: <strong>todos os controladores<\u002Fstrong> devem indicar um encarregado no Brasil, enquanto o GDPR restringe a obrigação a casos específicos. A ANPD pode, via regulamento, aproximar as exigências brasileiras dos padrões internacionais.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"d8680c4e-b27e-4682-9b38-020130b30005\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei nº 13.709, de 14 de agosto de 2018 — Artigos 31 a 40<\u002Fp>\n  <div style=\"margin-top:14px\">\n    <a href=\"LGPD - Artigos 1 a 11.html\">Art. 1–11<\u002Fa>\n    <a href=\"LGPD - Artigos 12 a 20.html\">Art. 12–20<\u002Fa>\n    <a href=\"LGPD - Artigos 21 a 30.html\">Art. 21–30<\u002Fa>\n  <\u002Fdiv>\n  <p style=\"margin-top:12px;font-size:.72rem;opacity:.45\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\nconst secs = [...document.querySelectorAll('section[id]')];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = secs[0]?.id;\n  secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n  const active = links.find(a => a.getAttribute('href') === '#' + cur);\n  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth', block: 'nearest' });\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
