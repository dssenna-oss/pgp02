document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>LGPD — Artigos 51 a 65 | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--lblue:#E3F2FD;\n  --teal:#00695C;--lteal:#E0F2F1;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --red:#C62828;--lred:#FFEBEE;\n  --purple:#6A1B9A;--lpurp:#F3E5F5;\n  --safe:#1A237E;--lsafe:#E8EAF6;\n  --fisc:#BF360C;--lfisc:#FBE9E7;\n  --anpd:#004D40;--lanpd:#E0F2F1;\n  --final:#37474F;--lfinal:#ECEFF1;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}\nh1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2}\nh2{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;line-height:1.3}\nh3{font-size:1rem;font-weight:700;line-height:1.4}\nh4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\np{color:var(--muted)}strong{color:var(--text);font-weight:600}\nul{padding-left:18px;color:var(--muted)}li+li{margin-top:5px}\n\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n.sec{padding:56px 0}\n.sec:nth-child(odd){background:#fff}\n.sec:nth-child(even){background:var(--bg)}\n.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}\n.art-num{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:#fff}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:5px}\n\n.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}\n.tcol{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}\n\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.icard{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}\n.icard-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff}\n.dcard{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border)}\n.dcard .dn{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}\n.dcard .dt{font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--text)}\n.dcard .dd{font-size:.8rem;color:var(--muted)}\n\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n.cat-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:2px solid;margin:24px 0 12px}\n\n/* Sanction ladder */\n.sanction{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:10px;margin-bottom:8px}\n.san-num{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff}\n.san-severity{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-bottom:4px;display:inline-block}\n\n/* Org chart */\n.org-box{background:var(--card);border-radius:10px;padding:12px 16px;border:1px solid var(--border);text-align:center;box-shadow:var(--sh)}\n.org-box h3{font-size:.88rem;margin-bottom:4px}\n.org-box p{font-size:.75rem}\n\n/* Parameter cards */\n.param{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border)}\n.param-icon{flex-shrink:0;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;color:#fff}\n\n/* Timeline (disposições finais) */\n.timeline-h{display:flex;gap:0;flex-wrap:wrap}\n.tl-year{flex:1;min-width:140px;padding:16px;text-align:center;border-radius:var(--r)}\n.tl-year h3{color:#fff;font-size:.95rem;margin-bottom:6px}\n.tl-year p{color:rgba(255,255,255,.8);font-size:.8rem}\n\n/* Competence cluster */\n.cluster{border-radius:var(--r);padding:18px;border:1px solid var(--border);background:var(--card);box-shadow:var(--sh)}\n.cluster-head{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:12px}\n.cluster ul{padding-left:14px;font-size:.83rem;display:flex;flex-direction:column;gap:5px}\n\n/* Serie complete */\n.serie-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);display:flex;align-items:center;gap:12px;text-decoration:none;transition:box-shadow .2s}\n.serie-card:hover{box-shadow:0 4px 24px rgba(13,27,75,.14)}\n.serie-dot{flex-shrink:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;color:#fff}\n\n/* Intro band */\n.intro-band{background:linear-gradient(135deg,#004D40,#00695C);color:#fff;padding:48px 0}\n.intro-band h1{color:#fff}\n.intro-band p{color:rgba(255,255,255,.8)}\n.progress-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:24px}\n.prog-done{background:rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700}\n.prog-now{background:#fff;color:var(--navy);padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700}\n\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--anpd);color:#fff}\n\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\nfooter a{color:rgba(255,255,255,.55);text-decoration:none;font-size:.78rem;border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;display:inline-block;margin:3px}\n\n@media(max-width:680px){.tcol{grid-template-columns:1fr}.timeline-h{flex-direction:column}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"243c6404-5ae6-4a3d-82c1-7634f7f71ec7\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- INTRO -->\n<section class=\"intro-band\">\n  <div class=\"wrap\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;flex-wrap:wrap\">\n      <div>\n        <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Lei nº 13.709/2018 — Volume Final<\u002Fdiv>\n        <h1>LGPD: Artigos 51 a 65<\u002Fh1>\n        <p style=\"margin-top:8px;max-width:560px\">Encerramento da LGPD: <strong style=\"color:#fff\">Fiscalização e Sanções<\u002Fstrong> — as multas e penalidades. <strong style=\"color:#fff\">Autoridade Nacional (ANPD)<\u002Fstrong> — estrutura e competências. <strong style=\"color:#fff\">Disposições Finais<\u002Fstrong> — vigência e alterações legislativas.<\u002Fp>\n        <div class=\"progress-bar\">\n          <span class=\"prog-done\">Art. 1–11 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 12–20 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 21–30 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 31–40 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 41–50 ✓<\u002Fspan>\n          <span class=\"prog-now\">Art. 51–65 ← final<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:200px\">\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.4rem;font-weight:800;color:#fff\">R$50M<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Multa máx. por infração<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.4rem;font-weight:800;color:#fff\">2%<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Faturamento (limite)<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.4rem;font-weight:800;color:#fff\">9<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Tipos de sanção<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.4rem;font-weight:800;color:#fff\">5<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Diretores da ANPD<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\">\n  <ul>\n    <li><a href=\"#a51\">Art. 51 — Certificações<\u002Fa><\u002Fli>\n    <li><a href=\"#a52\">Art. 52 — Sanções<\u002Fa><\u002Fli>\n    <li><a href=\"#a53\">Art. 53 — Parâmetros<\u002Fa><\u002Fli>\n    <li><a href=\"#a54\">Art. 54 — Prazo das Sanções<\u002Fa><\u002Fli>\n    <li><a href=\"#a55\">Art. 55 — ANPD (Criação)<\u002Fa><\u002Fli>\n    <li><a href=\"#a55j\">Art. 55-J — Competências<\u002Fa><\u002Fli>\n    <li><a href=\"#a56\">Art. 56–59 — CNPD<\u002Fa><\u002Fli>\n    <li><a href=\"#a60\">Art. 60–65 — Disp. Finais<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- CAP. VI CONCLUSION DIVIDER -->\n<div style=\"background:linear-gradient(135deg,#1A237E,#283593);padding:22px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Cap. VI — Conc.<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Segurança e Boas Práticas — Certificações e Selos<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">ANPD como fomentadora de padrões técnicos e programas reconhecidos<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 51 ============ -->\n<section id=\"a51\" class=\"sec\" data-screen-label=\"Art. 51 — Certificações e Selos ANPD\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--safe)\">51<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lsafe);color:var(--safe)\">Artigo 51º<\u002Fdiv>\n        <h2>Padrões Técnicos, Certificações e Selos da ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A Autoridade Nacional estimulará a adoção de <strong>padrões técnicos<\u002Fstrong> que facilitem o controle pelos titulares sobre suas informações, podendo definir requisitos mínimos e reconhecer formalmente programas, certificações e selos de conformidade.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n        <h3>Padrões Técnicos Mínimos<\u002Fh3>\n        <p>A ANPD define padrões técnicos a serem observados para garantir que os sistemas de informação propiciem segurança e controle adequados pelo titular, conforme o estado da arte.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n        <h3>Reconhecimento de Programas<\u002Fh3>\n        <p>A ANPD pode <strong>reconhecer formalmente<\u002Fstrong> programas de boas práticas e governança elaborados pelos agentes de tratamento, conferindo-lhes credibilidade perante o mercado e reduzindo riscos regulatórios.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n        <h3>Selos e Certificações<\u002Fh3>\n        <p>Organizações que atendam aos requisitos definidos pela ANPD podem obter <strong>selos de conformidade LGPD<\u002Fstrong>, demonstrando compromisso com a proteção de dados para clientes, parceiros e titulares.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lsafe);border-color:var(--safe)\">\n      <h4 style=\"color:var(--safe)\">Incentivo à Autorregulação Responsável<\u002Fh4>\n      <p>O sistema de selos e certificações cria um <strong>mercado de conformidade<\u002Fstrong> onde organizações competem pela melhor governança de dados, reduzindo a necessidade de intervenção regulatória direta e gerando diferencial competitivo para as mais responsáveis.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CAP. VII DIVIDER -->\n<div style=\"background:linear-gradient(135deg,#BF360C,#E64A19);padding:22px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Capítulo VII<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Da Fiscalização<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Sanções administrativas, parâmetros de cálculo e prazos para aplicação<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 52 ============ -->\n<section id=\"a52\" class=\"sec\" data-screen-label=\"Art. 52 — Sanções Administrativas\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--fisc)\">52<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lfisc);color:var(--fisc)\">Artigo 52º — Central<\u002Fdiv>\n        <h2>Sanções Administrativas Aplicáveis pela ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:24px\">Os agentes de tratamento que descumprirem a LGPD ficam sujeitos às seguintes sanções administrativas, aplicáveis pela ANPD — <strong>isolada ou cumulativamente<\u002Fstrong>:<\u002Fp>\n\n    <!-- Sanctions ladder -->\n    <div style=\"margin-bottom:24px\">\n      <div class=\"sanction\" style=\"background:#FFF3E0\">\n        <div class=\"san-num\" style=\"background:#F57C00\">I<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#FFE0B2;color:#E65100\">Advertência<\u002Fdiv>\n          <h3>Advertência com indicação de prazo para adoção de medidas corretivas<\u002Fh3>\n          <p style=\"font-size:.84rem\">Sanção mais leve. Não há multa, mas o agente tem prazo determinado para corrigir a irregularidade sob pena de sanção mais severa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sanction\" style=\"background:#FBE9E7\">\n        <div class=\"san-num\" style=\"background:var(--fisc)\">II<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#FFCCBC;color:var(--fisc)\">Multa Simples<\u002Fdiv>\n          <h3>Até 2% do faturamento no Brasil — limitada a <strong>R$ 50.000.000,00<\u002Fstrong> por infração<\u002Fh3>\n          <p style=\"font-size:.84rem\">Base de cálculo: faturamento no território nacional do último exercício fiscal, excluídos os tributos. O limite de R$ 50M aplica-se por infração — infrações distintas podem gerar multas múltiplas.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sanction\" style=\"background:#FBE9E7\">\n        <div class=\"san-num\" style=\"background:var(--fisc)\">III<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#FFCCBC;color:var(--fisc)\">Multa Diária<\u002Fdiv>\n          <h3>Multa simples cobrada diariamente enquanto persistir a infração<\u002Fh3>\n          <p style=\"font-size:.84rem\">Observado o limite total de R$ 50M. Instrumento de pressão para forçar a adequação imediata — cada dia de descumprimento gera nova multa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sanction\" style=\"background:#FCE4EC\">\n        <div class=\"san-num\" style=\"background:var(--red)\">IV<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#F8BBD9;color:var(--red)\">Publicização<\u002Fdiv>\n          <h3>Publicização da infração após devidamente apurada e confirmada<\u002Fh3>\n          <p style=\"font-size:.84rem\">A ANPD torna pública a infração e o infrator — impacto reputacional severo, especialmente para empresas de varejo e serviços ao consumidor.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sanction\" style=\"background:#EDE7F6\">\n        <div class=\"san-num\" style=\"background:var(--purple)\">V<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#D1C4E9;color:var(--purple)\">Bloqueio<\u002Fdiv>\n          <h3>Bloqueio dos dados pessoais a que se refere a infração até a regularização<\u002Fh3>\n          <p style=\"font-size:.84rem\">Suspensão temporária do uso dos dados — impacta operações dependentes desses dados até que o problema seja corrigido.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sanction\" style=\"background:#EDE7F6\">\n        <div class=\"san-num\" style=\"background:var(--purple)\">VI<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#D1C4E9;color:var(--purple)\">Eliminação<\u002Fdiv>\n          <h3>Eliminação dos dados pessoais a que se refere a infração<\u002Fh3>\n          <p style=\"font-size:.84fim\">Exclusão definitiva dos dados tratados irregularmente — perda irreversível de ativos de dados ilicitamente obtidos ou retidos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sanction\" style=\"background:var(--lred)\">\n        <div class=\"san-num\" style=\"background:var(--red)\">VII–IX<\u002Fdiv>\n        <div>\n          <div class=\"san-severity\" style=\"background:#FFCDD2;color:var(--red)\">Suspensão / Proibição<\u002Fdiv>\n          <h3>Suspensão (até 6 meses) ou proibição parcial/total das atividades de tratamento<\u002Fh3>\n          <p style=\"font-size:.84rem\">Sanções mais graves. A proibição total pode inviabilizar o negócio do infrator reincidente ou que causou danos graves a um grande número de titulares.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hl\" style=\"background:var(--lfisc);border-color:var(--fisc)\">\n      <h4 style=\"color:var(--fisc)\">Microempresas e Startups — §6º<\u002Fh4>\n      <p>Para microempresas, empresas de pequeno porte e startups, a ANPD poderá adotar <strong>sanções mais brandas ou diferenciadas<\u002Fstrong> e procedimentos simplificados, considerando suas especificidades e capacidade econômica.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 53 ============ -->\n<section id=\"a53\" class=\"sec\" data-screen-label=\"Art. 53 — Parâmetros para Cálculo das Sanções\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--fisc)\">53<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lfisc);color:var(--fisc)\">Artigo 53º<\u002Fdiv>\n        <h2>Parâmetros para Cálculo e Aplicação das Sanções<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A ANPD poderá dispor sobre parâmetros e critérios para o cálculo das sanções administrativas. Na dosimetria das sanções, serão considerados:<\u002Fp>\n    <div class=\"g4\">\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--fisc)\">1<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Gravidade e Natureza<\u002Fh3><p style=\"font-size:.8rem\">Gravidade e natureza das infrações e dos direitos pessoais afetados.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--fisc)\">2<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Boa-fé do Agente<\u002Fh3><p style=\"font-size:.8rem\">Boa-fé e abertura à cooperação do infrator com a investigação.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--fisc)\">3<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Vantagem Obtida<\u002Fh3><p style=\"font-size:.8rem\">A vantagem auferida ou pretendida pelo infrator com a infração.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--fisc)\">4<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Condição do Infrator<\u002Fh3><p style=\"font-size:.8rem\">Condição econômica do infrator e especialmente sua capacidade de suportar a sanção.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--red)\">5<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Reincidência<\u002Fh3><p style=\"font-size:.8rem\">Reincidência no cometimento de infrações à legislação de proteção de dados.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--red)\">6<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Grau de Dano<\u002Fh3><p style=\"font-size:.8rem\">Grau do dano causado aos titulares — individual, coletivo, patrimonial ou moral.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--amber)\">7<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Cooperação<\u002Fh3><p style=\"font-size:.8rem\">Cooperação do infrator com a apuração do incidente, inclusive notificação voluntária.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--amber)\">8<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Adoção de Políticas<\u002Fh3><p style=\"font-size:.8rem\">Adoção reiterada e demonstrada de mecanismos e procedimentos internos de proteção de dados antes da infração.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"param\"><div class=\"param-icon\" style=\"background:var(--green)\">9<\u002Fdiv><div><h3 style=\"font-size:.88rem\">Proporcionalidade<\u002Fh3><p style=\"font-size:.8rem\">Proporcionalidade entre a gravidade da falta e a intensidade da sanção.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lfisc);border-color:var(--fisc)\">\n      <h4 style=\"color:var(--fisc)\">Redução pela Boa Governança<\u002Fh4>\n      <p>Organizações que <strong>comprovem possuir programa de governança de dados (Art. 50)<\u002Fstrong> antes da infração têm direito à redução da sanção — o investimento em compliance gera dividendos regulatórios concretos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 54 ============ -->\n<section id=\"a54\" class=\"sec\" data-screen-label=\"Art. 54 — Prazo para Início da Aplicação das Sanções\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--fisc)\">54<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lfisc);color:var(--fisc)\">Artigo 54º<\u002Fdiv>\n        <h2>Prazo Prescricional e Início do Cálculo das Sanções<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">As sanções serão aplicadas após procedimento administrativo que possibilite a oportunidade de <strong>ampla defesa<\u002Fstrong>, de forma gradativa, isolada ou cumulativa, de acordo com as peculiaridades do caso concreto e observados os princípios da proporcionalidade, da razoabilidade e dos demais princípios gerais.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--fisc)\">\n        <h3>Ampla Defesa e Contraditório<\u002Fh3>\n        <p>Antes de aplicar qualquer sanção, a ANPD deve assegurar ao infrator o <strong>direito de defesa<\u002Fstrong>, com prazo razoável para apresentação de manifestações e provas.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--fisc)\">\n        <h3>Gradatividade<\u002Fh3>\n        <p>As sanções devem ser aplicadas de forma <strong>gradativa<\u002Fstrong> — preferindo advertência antes de multa, e multa simples antes de multa diária ou sanções mais severas.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--fisc)\">\n        <h3>Prazo Prescricional<\u002Fh3>\n        <p>O direito da ANPD de apurar infrações prescreve em <strong>5 anos<\u002Fstrong> contados da data do conhecimento da infração ou da data do término da infração continuada ou permanente.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CAP. VIII DIVIDER -->\n<div style=\"background:linear-gradient(135deg,#004D40,#00695C);padding:22px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Capítulo VIII<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Da Autoridade Nacional de Proteção de Dados (ANPD) e do CNPD<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Estrutura, composição e competências da autoridade regulatória brasileira<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 55 ============ -->\n<section id=\"a55\" class=\"sec\" data-screen-label=\"Art. 55 — Criação e Estrutura da ANPD\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--anpd)\">55<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lanpd);color:var(--anpd)\">Artigos 55-A ao 55-L<\u002Fdiv>\n        <h2>Criação e Estrutura da ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">A <strong>Autoridade Nacional de Proteção de Dados (ANPD)<\u002Fstrong> é um órgão da administração pública federal, integrante da estrutura da Presidência da República, com possibilidade de se tornar autarquia especial.<\u002Fp>\n\n    <div class=\"tcol\" style=\"margin-bottom:24px\">\n      <div>\n        <div style=\"background:linear-gradient(135deg,#004D40,#00695C);border-radius:var(--r);padding:24px;color:#fff;margin-bottom:16px\">\n          <h3 style=\"color:#fff;margin-bottom:4px\">ANPD — Autoridade Nacional de Proteção de Dados<\u002Fh3>\n          <p style=\"color:rgba(255,255,255,.75);font-size:.85rem;margin-bottom:16px\">Órgão independente — Art. 55-A a 55-L da LGPD (incluídos pela Lei 13.853/2019)<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <div style=\"background:rgba(255,255,255,.12);border-radius:8px;padding:10px;text-align:center\"><div style=\"font-weight:800;color:#fff\">5<\u002Fdiv><div style=\"font-size:.72rem;color:rgba(255,255,255,.7)\">Diretores do Conselho<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.12);border-radius:8px;padding:10px;text-align:center\"><div style=\"font-weight:800;color:#fff\">4 anos<\u002Fdiv><div style=\"font-size:.72rem;color:rgba(255,255,255,.7)\">Mandato (1 recond.)<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cat-h\" style=\"color:var(--anpd);border-color:var(--lanpd)\">Órgãos da ANPD — Art. 55-C<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n          <div class=\"org-box\"><h3>Conselho Diretor<\u002Fh3><p>5 diretores — máxima autoridade decisória<\u002Fp><\u002Fdiv>\n          <div class=\"org-box\"><h3>Conselho Nacional (CNPD)<\u002Fh3><p>Órgão consultivo com representação ampla<\u002Fp><\u002Fdiv>\n          <div class=\"org-box\"><h3>Corregedoria<\u002Fh3><p>Controle interno e disciplinar<\u002Fp><\u002Fdiv>\n          <div class=\"org-box\"><h3>Ouvidoria<\u002Fh3><p>Canal direto com a sociedade<\u002Fp><\u002Fdiv>\n          <div class=\"org-box\"><h3>Procuradoria<\u002Fh3><p>Assessoria jurídica e representação<\u002Fp><\u002Fdiv>\n          <div class=\"org-box\"><h3>Unidades Especializadas<\u002Fh3><p>Fiscalização, normatização e outros<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:20px\">\n          <h3 style=\"color:var(--anpd);margin-bottom:14px\">Conselho Diretor — Art. 55-D<\u002Fh3>\n          <ul style=\"display:flex;flex-direction:column;gap:8px\">\n            <li>Composto por <strong>5 (cinco) diretores<\u002Fstrong>, sendo um Diretor-Presidente<\u002Fli>\n            <li>Mandato de <strong>4 anos<\u002Fstrong>, permitida 1 recondução<\u002Fli>\n            <li>Indicados pelo Presidente da República e <strong>aprovados pelo Senado Federal<\u002Fstrong><\u002Fli>\n            <li>Brasileiros, de reputação ilibada e com notório conhecimento na área<\u002Fli>\n            <li>Dedicação exclusiva durante o mandato<\u002Fli>\n          <\u002Ful>\n          <div class=\"hl\" style=\"background:var(--lanpd);border-color:var(--anpd)\">\n            <h4 style=\"color:var(--anpd)\">Art. 55-B — Natureza Jurídica<\u002Fh4>\n            <p>A ANPD poderá ter seu enquadramento alterado para <strong>autarquia especial<\u002Fstrong>, dotada de autonomia técnica e decisória, quadro próprio e autonomia patrimonial, financeira e administrativa.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 55-J ============ -->\n<section id=\"a55j\" class=\"sec\" data-screen-label=\"Art. 55-J — Competências da ANPD\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--anpd)\">55J<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lanpd);color:var(--anpd)\">Artigo 55-J<\u002Fdiv>\n        <h2>Competências da ANPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Compete à ANPD zelar pela proteção dos dados pessoais e por <strong>implementar e fiscalizar o cumprimento da LGPD<\u002Fstrong>. Suas competências se organizam em cinco grandes clusters:<\u002Fp>\n    <div class=\"g2\">\n      <div class=\"cluster\">\n        <div class=\"cluster-head\" style=\"color:var(--blue)\">Normatização e Orientação<\u002Fdiv>\n        <ul>\n          <li>Elaborar diretrizes para implementação da LGPD<\u002Fli>\n          <li>Editar regulamentos e procedimentos sobre proteção de dados<\u002Fli>\n          <li>Dispor sobre padrões técnicos e operacionais<\u002Fli>\n          <li>Emitir orientações e recomendações às organizações<\u002Fli>\n          <li>Elaborar relatórios de gestão anuais de suas atividades<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"cluster\">\n        <div class=\"cluster-head\" style=\"color:var(--red)\">Fiscalização e Sanções<\u002Fdiv>\n        <ul>\n          <li>Fiscalizar e aplicar sanções em caso de tratamento irregular<\u002Fli>\n          <li>Investigar infrações à LGPD por iniciativa própria ou reclamação<\u002Fli>\n          <li>Solicitar informações a agentes de tratamento<\u002Fli>\n          <li>Realizar auditorias e inspeções em agentes de tratamento<\u002Fli>\n          <li>Comunicar às autoridades competentes as infrações penais<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"cluster\">\n        <div class=\"cluster-head\" style=\"color:var(--green)\">Educação e Sociedade<\u002Fdiv>\n        <ul>\n          <li>Promover conhecimento das normas de proteção de dados<\u002Fli>\n          <li>Difundir ações educativas para a sociedade<\u002Fli>\n          <li>Estimular a adoção de padrões técnicos e boas práticas<\u002Fli>\n          <li>Receber petições e reclamações de titulares<\u002Fli>\n          <li>Publicar relatórios de atividades e transparência<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"cluster\">\n        <div class=\"cluster-head\" style=\"color:var(--purple)\">Poder Público e Políticas<\u002Fdiv>\n        <ul>\n          <li>Orientar os órgãos públicos sobre a aplicação da LGPD<\u002Fli>\n          <li>Realizar auditorias de aspectos discriminatórios em decisões automatizadas<\u002Fli>\n          <li>Solicitar RIPD a agentes de tratamento do Poder Público<\u002Fli>\n          <li>Consultar órgãos e setores da sociedade em temas relevantes<\u002Fli>\n          <li>Elaborar estudos e pareceres sobre proteção de dados<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"cluster\">\n        <div class=\"cluster-head\" style=\"color:var(--teal)\">Cooperação Internacional<\u002Fdiv>\n        <ul>\n          <li>Promover a cooperação com autoridades de outros países<\u002Fli>\n          <li>Celebrar acordos de cooperação com organismos internacionais<\u002Fli>\n          <li>Participar de fóruns internacionais de proteção de dados<\u002Fli>\n          <li>Avaliar o grau de adequação de países receptores de dados<\u002Fli>\n          <li>Reconhecer mecanismos de transferência internacional<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"cluster\">\n        <div class=\"cluster-head\" style=\"color:var(--amber)\">Titulares e Agentes<\u002Fdiv>\n        <ul>\n          <li>Criar formulários simplificados para exercício de direitos<\u002Fli>\n          <li>Definir requisitos mínimos para o encarregado (DPO)<\u002Fli>\n          <li>Dispor sobre formas simplificadas de registro de tratamento<\u002Fli>\n          <li>Implementar mecanismos de certificação<\u002Fli>\n          <li>Deliberar sobre transferências internacionais específicas<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 56-59 ============ -->\n<section id=\"a56\" class=\"sec\" data-screen-label=\"Art. 56 a 59 — Conselho Nacional (CNPD)\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--anpd)\">56<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lanpd);color:var(--anpd)\">Artigos 56 a 59<\u002Fdiv>\n        <h2>Conselho Nacional de Proteção de Dados e da Privacidade (CNPD)<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O <strong>Conselho Nacional de Proteção de Dados e da Privacidade (CNPD)<\u002Fstrong> é órgão consultivo da ANPD, composto por 23 representantes de variados setores, com mandato de 2 anos.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"cat-h\" style=\"color:var(--anpd);border-color:var(--lanpd);margin-top:0\">Composição — Art. 57<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">6<\u002Fdiv><div><h3>Poder Executivo Federal<\u002Fh3><p>Representantes de ministérios e órgãos federais relevantes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">1<\u002Fdiv><div><h3>Senado Federal<\u002Fh3><p>Um representante do Poder Legislativo Federal.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">1<\u002Fdiv><div><h3>Câmara dos Deputados<\u002Fh3><p>Um representante do Poder Legislativo Federal.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">1<\u002Fdiv><div><h3>Conselho Nacional de Justiça (CNJ)<\u002Fh3><p>Representante do Poder Judiciário.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">1<\u002Fdiv><div><h3>Conselho Nacional do MP (CNMP)<\u002Fh3><p>Representante do Ministério Público.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">3<\u002Fdiv><div><h3>Setor Empresarial e Inovação<\u002Fh3><p>Representantes do setor produtivo e da área de inovação tecnológica.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">3<\u002Fdiv><div><h3>Sociedade Civil<\u002Fh3><p>Representantes de entidades da sociedade civil com atuação em proteção de dados.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"icard\" style=\"border-left:3px solid var(--anpd)\"><div class=\"icard-num\" style=\"background:var(--anpd)\">3<\u002Fdiv><div><h3>Comunidade Científica<\u002Fh3><p>Representantes de instituições científicas, tecnológicas e de inovação.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:20px\">\n          <h3 style=\"color:var(--anpd);margin-bottom:14px\">Competências do CNPD — Art. 58<\u002Fh3>\n          <ul style=\"display:flex;flex-direction:column;gap:8px\">\n            <li>Propor <strong>diretrizes estratégicas<\u002Fstrong> de proteção de dados pessoais e da privacidade<\u002Fli>\n            <li>Elaborar relatórios e estudos sobre a <strong>proteção de dados pessoais<\u002Fstrong><\u002Fli>\n            <li>Avaliar práticas e políticas públicas e privadas de proteção de dados<\u002Fli>\n            <li>Sugerir ações a serem realizadas pela ANPD<\u002Fli>\n            <li>Elaborar estudos e pareceres sobre <strong>questões relevantes<\u002Fstrong> de proteção de dados<\u002Fli>\n            <li>Disseminar o conhecimento sobre a proteção de dados pessoais<\u002Fli>\n            <li>Realizar <strong>debates e audiências públicas<\u002Fstrong> sobre a matéria<\u002Fli>\n          <\u002Ful>\n          <div class=\"hl\" style=\"background:var(--lanpd);border-color:var(--anpd)\">\n            <h4 style=\"color:var(--anpd)\">Natureza Consultiva<\u002Fh4>\n            <p>O CNPD não tem poder decisório — suas manifestações são de natureza <strong>consultiva e orientadora<\u002Fstrong>. As decisões vinculantes são tomadas pelo Conselho Diretor da ANPD.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CAP. IX DIVIDER -->\n<div style=\"background:linear-gradient(135deg,#263238,#37474F);padding:22px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Capítulo IX<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Das Disposições Finais e Transitórias<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Alterações legislativas, vigência, regulamentação e revogações<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 60-65 ============ -->\n<section id=\"a60\" class=\"sec\" data-screen-label=\"Art. 60 a 65 — Disposições Finais e Vigência\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--final)\">60<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lfinal);color:var(--final)\">Artigos 60 a 65<\u002Fdiv>\n        <h2>Disposições Finais, Alterações e Vigência da LGPD<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"g3\" style=\"margin-bottom:28px\">\n      <div class=\"card\" style=\"border-left:4px solid var(--final)\">\n        <div style=\"font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--final);margin-bottom:6px\">Art. 60<\u002Fdiv>\n        <h3>Alteração do Marco Civil da Internet<\u002Fh3>\n        <p>A LGPD alterou o art. 7º, §3º, da Lei nº 12.965/2014 (Marco Civil da Internet) para adequar o tratamento de dados pessoais na internet às novas disposições de proteção de dados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--final)\">\n        <div style=\"font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--final);margin-bottom:6px\">Art. 61<\u002Fdiv>\n        <h3>Alteração do Código de Defesa do Consumidor<\u002Fh3>\n        <p>Acrescentou ao CDC o <strong>direito do consumidor à proteção de dados pessoais<\u002Fstrong> como direito básico, consolidando a proteção de dados como direito de consumo.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--final)\">\n        <div style=\"font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--final);margin-bottom:6px\">Art. 62–63<\u002Fdiv>\n        <h3>Regulamentação e Implementação<\u002Fh3>\n        <p>O prazo para que a ANPD edite as regulamentações necessárias para implementação da LGPD, além de disposições sobre a instalação e funcionamento da ANPD.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Timeline de vigência -->\n    <div class=\"cat-h\" style=\"color:var(--final);border-color:#B0BEC5\">Linha do Tempo — Vigência da LGPD (Art. 65)<\u002Fdiv>\n    <div class=\"timeline-h\" style=\"gap:8px;margin-bottom:20px\">\n      <div class=\"tl-year\" style=\"background:linear-gradient(135deg,#37474F,#455A64)\">\n        <div style=\"font-size:.72rem;color:rgba(255,255,255,.6);margin-bottom:4px\">Publicação<\u002Fdiv>\n        <h3>Ago/2018<\u002Fh3>\n        <p>Lei 13.709 publicada. Início do prazo para adaptação do setor.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl-year\" style=\"background:linear-gradient(135deg,#1565C0,#1976D2)\">\n        <div style=\"font-size:.72rem;color:rgba(255,255,255,.6);margin-bottom:4px\">Entrada em vigor<\u002Fdiv>\n        <h3>Set/2020<\u002Fh3>\n        <p>A LGPD entra em vigor — todos os artigos, exceto sanções.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl-year\" style=\"background:linear-gradient(135deg,#E65100,#F57C00)\">\n        <div style=\"font-size:.72rem;color:rgba(255,255,255,.6);margin-bottom:4px\">Sanções<\u002Fdiv>\n        <h3>Ago/2021<\u002Fh3>\n        <p>Início da aplicação das sanções administrativas pela ANPD (Cap. VII).<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tl-year\" style=\"background:linear-gradient(135deg,#004D40,#00695C)\">\n        <div style=\"font-size:.72rem;color:rgba(255,255,255,.6);margin-bottom:4px\">ANPD Plena<\u002Fdiv>\n        <h3>2021–hoje<\u002Fh3>\n        <p>ANPD operacional — regulamentações, fiscalizações e primeiras sanções.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hl\" style=\"background:var(--lfinal);border-color:var(--final)\">\n      <h4 style=\"color:var(--final)\">Art. 64 — Disposições Gerais<\u002Fh4>\n      <p>Os casos não previstos na LGPD serão submetidos à autoridade nacional, que poderá dispor sobre os mesmos, observados os princípios e fundamentos gerais desta Lei. A LGPD <strong>não exclui<\u002Fstrong> a aplicação de outras legislações específicas sobre proteção de dados, como as normas setoriais do Banco Central, ANVISA e demais reguladores.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SÉRIE COMPLETA -->\n<section class=\"sec\" style=\"background:linear-gradient(135deg,#0D1B4B,#1A237E)\" data-screen-label=\"Série Completa\">\n  <div class=\"wrap\">\n    <div style=\"text-align:center;margin-bottom:32px\">\n      <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Guia Completo<\u002Fdiv>\n      <h2 style=\"color:#fff\">Série LGPD — Todos os Artigos Cobertos<\u002Fh2>\n      <p style=\"color:rgba(255,255,255,.75);margin-top:8px\">Acesse qualquer volume da série abaixo<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <a href=\"/lgpd/artigos-1-11\" class=\"serie-card\">\n        <div class=\"serie-dot\" style=\"background:#1565C0\">1–11<\u002Fdiv>\n        <div><div style=\"font-weight:700;color:var(--text)\">Artigos 1 a 11<\u002Fdiv><div style=\"font-size:.82rem;color:var(--muted)\">Fundamentos, aplicação, definições, princípios e bases legais para tratamento de dados<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"/lgpd/artigos-12-20\" class=\"serie-card\">\n        <div class=\"serie-dot\" style=\"background:#00695C\">12–20<\u002Fdiv>\n        <div><div style=\"font-weight:700;color:var(--text)\">Artigos 12 a 20<\u002Fdiv><div style=\"font-size:.82rem;color:var(--muted)\">Anonimização, pseudonimização, crianças, término do tratamento e direitos do titular<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"/lgpd/artigos-21-30\" class=\"serie-card\">\n        <div class=\"serie-dot\" style=\"background:#C62828\">21–30<\u002Fdiv>\n        <div><div style=\"font-weight:700;color:var(--text)\">Artigos 21 a 30<\u002Fdiv><div style=\"font-size:.82rem;color:var(--muted)\">Proteção dos direitos, defesa em juízo e tratamento pelo Poder Público<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"/lgpd/artigos-31-40\" class=\"serie-card\">\n        <div class=\"serie-dot\" style=\"background:#006064\">31–40<\u002Fdiv>\n        <div><div style=\"font-weight:700;color:var(--text)\">Artigos 31 a 40<\u002Fdiv><div style=\"font-size:.82rem;color:var(--muted)\">Transferência internacional de dados e agentes de tratamento (controlador, operador, DPO)<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"/lgpd/artigos-41-50\" class=\"serie-card\">\n        <div class=\"serie-dot\" style=\"background:#BF360C\">41–50<\u002Fdiv>\n        <div><div style=\"font-weight:700;color:var(--text)\">Artigos 41 a 50<\u002Fdiv><div style=\"font-size:.82rem;color:var(--muted)\">Responsabilidade civil, excludentes, tratamento irregular e segurança / boas práticas<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n      <a href=\"/lgpd/artigos-51-65\" class=\"serie-card\" style=\"border:2px solid var(--blue)\">\n        <div class=\"serie-dot\" style=\"background:#004D40\">51–65<\u002Fdiv>\n        <div><div style=\"font-weight:700;color:var(--text)\">Artigos 51 a 65 — você está aqui<\u002Fdiv><div style=\"font-size:.82rem;color:var(--muted)\">Sanções, ANPD, CNPD e disposições finais<\u002Fdiv><\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"243c6404-5ae6-4a3d-82c1-7634f7f71ec7\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei nº 13.709, de 14 de agosto de 2018 — Artigos 51 a 65<\u002Fp>\n  <p style=\"margin-top:10px;color:rgba(255,255,255,.5);font-size:.8rem\">Série completa: 65 artigos cobertos em 6 volumes didáticos.<\u002Fp>\n  <p style=\"margin-top:12px;font-size:.72rem;opacity:.4\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\nconst secs = [...document.querySelectorAll('section[id]')];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = secs[0]?.id;\n  secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n  const active = links.find(a => a.getAttribute('href') === '#' + cur);\n  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth', block: 'nearest' });\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
