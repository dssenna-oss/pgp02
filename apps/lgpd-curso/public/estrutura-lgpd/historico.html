  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Histórico da LGPD | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--blue2:#1976D2;--lblue:#E3F2FD;--lblue2:#BBDEFB;\n  --teal:#00695C;--lteal:#E0F2F1;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --gold:#F57F17;--lgold:#FFF8E1;\n  --purple:#6A1B9A;--lpurp:#F3E5F5;\n  --red:#C62828;--lred:#FFEBEE;\n  --slate:#37474F;--lslate:#ECEFF1;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}\nh1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2}\nh2{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;line-height:1.3}\nh3{font-size:1rem;font-weight:700;line-height:1.4}\nh4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\np{color:var(--muted)}\nstrong{color:var(--text);font-weight:600}\n\n/* layout */\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n.sec{padding:56px 0}\n.sec:nth-child(odd){background:#fff}\n.sec:nth-child(even){background:var(--bg)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:5px}\n.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n\n/* header */\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n\n/* hero */\n.hero{background:linear-gradient(135deg,#0D1B4B 0%,#1565C0 60%,#00695C 100%);color:#fff;padding:56px 0 48px}\n.hero h1{color:#fff}\n.hero p{color:rgba(255,255,255,.8);max-width:600px;margin-top:10px;font-size:1rem}\n.hero-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}\n.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 18px;text-align:center}\n.stat-n{font-size:1.5rem;font-weight:800;color:#fff}\n.stat-l{font-size:.7rem;color:rgba(255,255,255,.7)}\n\n/* nav */\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--blue);color:#fff}\n\n/* section divider */\n.sec-divider{padding:22px 0}\n.sec-divider-inner{display:flex;align-items:center;gap:14px}\n.div-pill{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 16px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}\n\n/* TIMELINE */\n.timeline{position:relative;padding-left:0}\n.tl-item{display:grid;grid-template-columns:140px 24px 1fr;gap:0 16px;align-items:start;margin-bottom:24px;position:relative}\n.tl-year-col{text-align:right;padding-top:4px}\n.tl-year{font-size:1.5rem;font-weight:800;line-height:1;color:var(--text)}\n.tl-sub{font-size:.72rem;color:var(--muted);margin-top:3px}\n.tl-spine{display:flex;flex-direction:column;align-items:center;padding-top:6px}\n.tl-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff;font-weight:800}\n.tl-line{width:2px;flex:1;min-height:30px;margin-top:4px}\n.tl-item:last-child .tl-line{display:none}\n.tl-content{padding-bottom:4px}\n.tl-org{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\n.tl-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3}\n.tl-desc{font-size:.87rem;color:var(--muted);line-height:1.55}\n\n/* MILESTONE card (⭐) */\n.milestone{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 4px 24px rgba(13,27,75,.12);border:2px solid;position:relative;overflow:hidden}\n.milestone::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}\n.ms-badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:4px 12px;border-radius:20px;margin-bottom:10px}\n.ms-year{font-size:1.8rem;font-weight:800;line-height:1;margin-bottom:4px}\n.ms-title{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3}\n.ms-org{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}\n.ms-desc{font-size:.88rem;color:var(--muted);line-height:1.6}\n\n/* law card */\n.law-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border);display:flex;gap:16px;align-items:flex-start}\n.law-year-badge{flex-shrink:0;padding:8px 12px;border-radius:10px;text-align:center;font-weight:800;font-size:.9rem}\n\n/* summary quote */\n.quote-box{background:linear-gradient(135deg,#0D1B4B,#1565C0);border-radius:var(--r);padding:40px;color:#fff;text-align:center}\n.quote-text{font-size:clamp(1rem,2vw,1.25rem);font-weight:600;color:#fff;line-height:1.7;max-width:700px;margin:0 auto}\n.quote-mark{font-size:4rem;line-height:.5;color:rgba(255,255,255,.3);font-family:Georgia,serif;display:block;margin-bottom:16px}\n\n/* footer */\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\n\n@media(max-width:680px){\n  .tl-item{grid-template-columns:90px 20px 1fr;gap:0 10px}\n  .tl-year{font-size:1.15rem}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"c64a2798-be14-4784-8deb-52f2a10a8327\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Contexto Histórico<\u002Fdiv>\n    <h1>Histórico da LGPD<\u002Fh1>\n    <p>A ideia de proteger dados pessoais não nasceu no Brasil nem em 2018 — é uma construção de <strong style=\"color:#fff\">décadas, no mundo todo<\u002Fstrong>. Entenda o caminho que nos trouxe até a Lei 13.709/2018.<\u002Fp>\n    <div class=\"hero-stats\">\n      <div class=\"stat\"><div class=\"stat-n\">134<\u002Fdiv><div class=\"stat-l\">Anos de história<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"stat-n\">1890<\u002Fdiv><div class=\"stat-l\">Primeira ideia<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"stat-n\">2022<\u002Fdiv><div class=\"stat-l\">Direito fundamental<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"stat-n\">3<\u002Fdiv><div class=\"stat-l\">Marcos centrais BR<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\">\n  <ul>\n    <li><a href=\"#mundo\">No Mundo<\u002Fa><\u002Fli>\n    <li><a href=\"#brasil\">No Brasil<\u002Fa><\u002Fli>\n    <li><a href=\"#leis\">Leis Relacionadas<\u002Fa><\u002Fli>\n    <li><a href=\"#resumo\">Em Uma Frase<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- INTRO -->\n<section class=\"sec\" style=\"padding:36px 0\">\n  <div class=\"wrap\">\n    <div class=\"card\" style=\"background:var(--lblue);border:none;padding:28px;max-width:800px;margin:0 auto\">\n      <h3 style=\"color:var(--blue);margin-bottom:10px\">Por que estudar a história da LGPD?<\u002Fh3>\n      <p style=\"font-size:.95rem\">Antes de mergulhar na lei, vale entender de onde ela veio. Conhecer o percurso histórico ajuda a compreender <strong>o porquê de cada regra<\u002Fstrong> e torna muito mais fácil aplicar a LGPD no dia a dia — especialmente para servidores públicos que lidam com dados de cidadãos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ==== NO MUNDO ==== -->\n<div class=\"sec-divider\" style=\"background:linear-gradient(135deg,#1A237E,#1565C0)\" id=\"mundo\">\n  <div class=\"wrap sec-divider-inner\">\n    <div class=\"div-pill\">Contexto Global<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">No Mundo: Como a Privacidade Virou Direito<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">De 1890 ao GDPR — a evolução da proteção de dados em escala global<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"sec\" data-screen-label=\"No Mundo\">\n  <div class=\"wrap\">\n\n    <!-- 1890 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1890<\u002Fdiv>\n        <div class=\"tl-sub\">EUA<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--slate)\">1<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--slate),var(--blue))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--slate)\">Harvard Law Review<\u002Fdiv>\n        <div class=\"tl-title\">\"The Right to Privacy\" — O Direito à Privacidade<\u002Fdiv>\n        <div class=\"tl-desc\">Os advogados Samuel Warren e Louis Brandeis publicam o artigo que cunha a ideia do <strong>\"direito de ser deixado em paz\"<\u002Fstrong>, diante das invasões da imprensa da época. É considerado o marco que faz a privacidade nascer como conceito jurídico.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1948 MILESTONE -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\"><\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--blue)\">2<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--blue),var(--blue2))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"milestone\" style=\"border-color:var(--blue)\">\n          <div class=\"ms-badge\" style=\"background:var(--lblue);color:var(--blue)\">⭐ Marco Global<\u002Fdiv>\n          <div class=\"ms-year\" style=\"color:var(--blue)\">1948<\u002Fdiv>\n          <div class=\"ms-org\" style=\"color:var(--blue)\">Organização das Nações Unidas (ONU)<\u002Fdiv>\n          <div class=\"ms-title\">Declaração Universal dos Direitos Humanos<\u002Fdiv>\n          <div class=\"ms-desc\">Pela primeira vez, um documento global reconhece a privacidade como direito de todos: <strong>ninguém pode sofrer interferências arbitrárias na sua vida privada<\u002Fstrong> (art. 12). É a semente de tudo — o fundamento ético que inspirou décadas de legislação em todo o planeta.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1970 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1970<\u002Fdiv>\n        <div class=\"tl-sub\">Alemanha<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--blue2)\">3<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--blue2),var(--teal))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--blue2)\">Estado de Hesse, Alemanha<\u002Fdiv>\n        <div class=\"tl-title\">Primeira lei de proteção de dados do mundo<\u002Fdiv>\n        <div class=\"tl-desc\">O estado alemão de Hesse cria a <strong>primeira lei só sobre dados pessoais<\u002Fstrong>. Surge porque os computadores começam a juntar informações de cidadãos em larga escala — e isso assusta. Um marco que antecipa em décadas a preocupação global.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1980 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1980<\u002Fdiv>\n        <div class=\"tl-sub\">Internacional<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--teal)\">4<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--teal),var(--teal))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--teal)\">OCDE<\u002Fdiv>\n        <div class=\"tl-title\">Diretrizes da OCDE sobre Proteção de Dados<\u002Fdiv>\n        <div class=\"tl-desc\">Princípios que inspiram leis no mundo inteiro até hoje: <strong>coletar só o necessário, dizer para quê, manter seguro, deixar a pessoa corrigir seus dados<\u002Fstrong>. A base conceitual do que viria a ser a LGPD — presentes em nosso Art. 6º.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1981 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1981<\u002Fdiv>\n        <div class=\"tl-sub\">Europa<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--teal)\">5<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--teal),var(--purple))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--teal)\">Conselho da Europa<\u002Fdiv>\n        <div class=\"tl-title\">Convenção 108 — Primeiro tratado internacional vinculante<\u002Fdiv>\n        <div class=\"tl-desc\">Primeiro tratado internacional com força de lei sobre proteção de dados. Vários países assinam e se comprometem legalmente a proteger informações pessoais — saindo do campo das boas intenções para o das obrigações jurídicas.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1995 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1995<\u002Fdiv>\n        <div class=\"tl-sub\">Europa<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--purple)\">6<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--purple),var(--amber))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--purple)\">União Europeia<\u002Fdiv>\n        <div class=\"tl-title\">Diretiva 95/46/CE — Referência mundial<\u002Fdiv>\n        <div class=\"tl-desc\">A Europa cria regras comuns para todos os seus países. Vira referência mundial e abre caminho para o GDPR, 20 anos depois. <strong>Muito do vocabulário que usamos hoje na LGPD vem desta diretiva.<\u002Fstrong><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2018 Cambridge Analytica -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">2018<\u002Fdiv>\n        <div class=\"tl-sub\">EUA / UK<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--amber)\">7<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--amber),var(--amber))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"card\" style=\"border-left:4px solid var(--amber)\">\n          <div class=\"tl-org\" style=\"color:var(--amber)\">Escândalo Global<\u002Fdiv>\n          <div class=\"tl-title\">Facebook — Cambridge Analytica<\u002Fdiv>\n          <div class=\"tl-desc\">Vem à tona que dados de <strong>até 87 milhões de usuários<\u002Fstrong> do Facebook foram coletados sem consentimento e usados para influenciar eleições. O caso vira símbolo mundial do perigo do uso indevido de dados pessoais e <strong>acelera a pressão por leis mais duras — inclusive no Brasil.<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2018 GDPR MILESTONE -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\"><\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--amber)\">8<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--amber),var(--green))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"milestone\" style=\"border-color:var(--amber)\">\n          <div class=\"ms-badge\" style=\"background:var(--lgold);color:var(--gold)\">⭐ Marco Central Mundial<\u002Fdiv>\n          <div class=\"ms-year\" style=\"color:var(--amber)\">2018<\u002Fdiv>\n          <div class=\"ms-org\" style=\"color:var(--amber)\">União Europeia<\u002Fdiv>\n          <div class=\"ms-title\">GDPR entra em vigor — A lei mais influente do planeta<\u002Fdiv>\n          <div class=\"ms-desc\">O Regulamento Geral de Proteção de Dados (aprovado em 2016) passa a valer em maio de 2018. É a lei mais influente do tema no planeta e o <strong>principal espelho da nossa LGPD<\u002Fstrong> — multas pesadas, direitos fortes para o cidadão, e o conceito de accountability (prestação de contas).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2018+ -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">2018+<\u002Fdiv>\n        <div class=\"tl-sub\">Global<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--green)\">9<\u002Fdiv>\n        <div class=\"tl-line\" style=\"display:none\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--green)\">EUA, América Latina, Ásia e mais<\u002Fdiv>\n        <div class=\"tl-title\">O mundo todo se mexe<\u002Fdiv>\n        <div class=\"tl-desc\">Califórnia (CCPA), Argentina, Uruguai, Chile, Japão, Coreia e dezenas de outros aprovam ou atualizam suas leis. <strong>Proteger dados pessoais virou padrão internacional<\u002Fstrong> — não mais exceção. O Brasil chega junto com esta onda.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ==== NO BRASIL ==== -->\n<div class=\"sec-divider\" style=\"background:linear-gradient(135deg,#1B5E20,#2E7D32)\" id=\"brasil\">\n  <div class=\"wrap sec-divider-inner\">\n    <div class=\"div-pill\">Contexto Nacional<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">No Brasil: O Caminho até a LGPD<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">De 1988 a 2022 — da Constituição à proteção de dados como direito fundamental<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"sec\" data-screen-label=\"No Brasil\">\n  <div class=\"wrap\">\n\n    <!-- 1988 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1988<\u002Fdiv>\n        <div class=\"tl-sub\">Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--green)\">1<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--green),var(--teal))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--green)\">Assembleia Nacional Constituinte<\u002Fdiv>\n        <div class=\"tl-title\">Constituição Federal — O alicerce de tudo<\u002Fdiv>\n        <div class=\"tl-desc\">A Constituição já protege a <strong>intimidade, a vida privada e o sigilo de dados e comunicações<\u002Fstrong> (art. 5º, X e XII) e cria o habeas data. É a base constitucional que sustenta toda a legislação de proteção de dados no Brasil.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1990 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">1990<\u002Fdiv>\n        <div class=\"tl-sub\">Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--teal)\">2<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--teal),var(--blue))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--teal)\">Lei 8.078/1990<\u002Fdiv>\n        <div class=\"tl-title\">Código de Defesa do Consumidor<\u002Fdiv>\n        <div class=\"tl-desc\">Primeiras regras sobre bancos de dados e cadastros de consumidores (arts. 43 e 44): <strong>a pessoa pode saber o que está registrado sobre ela e exigir correção<\u002Fstrong>. O embrião dos direitos do titular que a LGPD consolidaria décadas depois.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2014 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">2014<\u002Fdiv>\n        <div class=\"tl-sub\">Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--blue)\">3<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--blue),var(--amber))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--blue)\">Lei 12.965/2014<\u002Fdiv>\n        <div class=\"tl-title\">Marco Civil da Internet — A \"Constituição da Internet\"<\u002Fdiv>\n        <div class=\"tl-desc\">Coloca a <strong>proteção de dados pessoais como princípio do uso da rede<\u002Fstrong> e prepara o terreno para uma lei específica. O Marco Civil já sinalizava que o Brasil precisava de uma regulamentação mais robusta — que viria quatro anos depois.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2018 LGPD MILESTONE -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\"><\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--amber)\">4<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--amber),var(--amber))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"milestone\" style=\"border-color:var(--amber)\">\n          <div class=\"ms-badge\" style=\"background:var(--lgold);color:var(--gold)\">⭐ Marco Central — O Centro do Curso<\u002Fdiv>\n          <div class=\"ms-year\" style=\"color:var(--amber)\">2018<\u002Fdiv>\n          <div class=\"ms-org\" style=\"color:var(--amber)\">Lei 13.709/2018 — Sancionada em 14 de agosto<\u002Fdiv>\n          <div class=\"ms-title\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fdiv>\n          <div class=\"ms-desc\">É a nossa lei geral: <strong>define dado pessoal, estabelece bases legais, garante direitos do titular e impõe deveres a quem trata dados<\u002Fstrong>. Inspirada no GDPR europeu, adaptada à realidade brasileira. O centro de toda a capacitação em proteção de dados no Brasil.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2019 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">2019<\u002Fdiv>\n        <div class=\"tl-sub\">Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--amber)\">5<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--amber),var(--blue))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--amber)\">Lei 13.853/2019<\u002Fdiv>\n        <div class=\"tl-title\">ANPD — Autoridade Nacional de Proteção de Dados<\u002Fdiv>\n        <div class=\"tl-desc\">Cria a Autoridade Nacional de Proteção de Dados — o órgão que <strong>fiscaliza, orienta e pode aplicar sanções<\u002Fstrong>. É \"a polícia e o professor\" da LGPD ao mesmo tempo: pune quem descumpre, mas também guia quem quer se adequar.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2020 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">2020<\u002Fdiv>\n        <div class=\"tl-sub\">Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--blue)\">6<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--blue),var(--red))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--blue)\">Setembro de 2020<\u002Fdiv>\n        <div class=\"tl-title\">LGPD entra em vigor<\u002Fdiv>\n        <div class=\"tl-desc\">A maior parte da lei passa a valer. <strong>A partir daí, tratar dados pessoais sem cuidado deixa de ser só má prática — passa a ser descumprimento da lei.<\u002Fstrong> Organizações públicas e privadas precisam se adequar.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2021 -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\">\n        <div class=\"tl-year\">2021<\u002Fdiv>\n        <div class=\"tl-sub\">Brasil<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--red)\">7<\u002Fdiv>\n        <div class=\"tl-line\" style=\"background:linear-gradient(var(--red),var(--gold))\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"tl-org\" style=\"color:var(--red)\">Agosto de 2021<\u002Fdiv>\n        <div class=\"tl-title\">Começam as sanções administrativas<\u002Fdiv>\n        <div class=\"tl-desc\">Entram em vigor as sanções da LGPD (advertência, multa, bloqueio de dados…). <strong>A ANPD passa a poder punir quem não se adequa.<\u002Fstrong> Multa simples pode chegar a 2% do faturamento, limitada a R$ 50 milhões por infração.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2022 MILESTONE -->\n    <div class=\"tl-item\">\n      <div class=\"tl-year-col\"><\u002Fdiv>\n      <div class=\"tl-spine\">\n        <div class=\"tl-dot\" style=\"background:var(--gold)\">8<\u002Fdiv>\n        <div class=\"tl-line\" style=\"display:none\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tl-content\">\n        <div class=\"milestone\" style=\"border-color:var(--gold)\">\n          <div class=\"ms-badge\" style=\"background:var(--lgold);color:var(--gold)\">⭐ Marco Central — Nível Máximo de Proteção<\u002Fdiv>\n          <div class=\"ms-year\" style=\"color:var(--gold)\">2022<\u002Fdiv>\n          <div class=\"ms-org\" style=\"color:var(--gold)\">Emenda Constitucional 115/2022<\u002Fdiv>\n          <div class=\"ms-title\">Proteção de dados vira direito fundamental<\u002Fdiv>\n          <div class=\"ms-desc\">A EC 115 inclui a proteção de dados pessoais entre os direitos fundamentais (art. 5º, LXXIX da Constituição Federal). <strong>Agora é garantia constitucional — o nível mais alto de proteção jurídica existente no ordenamento brasileiro.<\u002Fstrong> A jornada que começou em 1890 chega ao seu ponto mais alto.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ==== LEIS RELACIONADAS ==== -->\n<div class=\"sec-divider\" style=\"background:linear-gradient(135deg,#004D40,#00695C)\" id=\"leis\">\n  <div class=\"wrap sec-divider-inner\">\n    <div class=\"div-pill\">Legislação Relacionada<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Leis que Conversam com a LGPD<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Especialmente importantes para quem trabalha no serviço público<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"sec\" data-screen-label=\"Leis Relacionadas\">\n  <div class=\"wrap\">\n    <div class=\"hl\" style=\"background:var(--lteal);border-color:var(--teal);margin-bottom:24px\">\n      <h4 style=\"color:var(--teal)\">A LGPD não vive sozinha<\u002Fh4>\n      <p>No serviço público, a LGPD convive com outras leis que regulam o uso e acesso às informações. Entender como elas se articulam é essencial para a atuação do servidor.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n\n      <div class=\"law-card\">\n        <div class=\"law-year-badge\" style=\"background:var(--lteal);color:var(--teal)\">2011<\u002Fdiv>\n        <div>\n          <div style=\"font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:4px\">Lei 12.527/2011<\u002Fdiv>\n          <h3>Lei de Acesso à Informação (LAI)<\u002Fh3>\n          <p style=\"margin-top:4px\">Garante o acesso da população às informações públicas (transparência). <strong>Anda de mãos dadas com a LGPD:<\u002Fstrong> transparência do que é público, proteção do que é pessoal. Quando há conflito, a solução está no equilíbrio entre os dois direitos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"law-card\">\n        <div class=\"law-year-badge\" style=\"background:var(--lblue);color:var(--blue)\">2017<\u002Fdiv>\n        <div>\n          <div style=\"font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:4px\">Lei 13.460/2017<\u002Fdiv>\n          <h3>Código de Defesa do Usuário do Serviço Público<\u002Fh3>\n          <p style=\"margin-top:4px\">Define direitos de quem usa serviços públicos, incluindo <strong>o respeito à privacidade e o bom uso das suas informações pelo Estado.<\u002Fstrong> Reforça que o cidadão é mais do que um número — é um titular de direitos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"law-card\">\n        <div class=\"law-year-badge\" style=\"background:var(--lgreen);color:var(--green)\">2021<\u002Fdiv>\n        <div>\n          <div style=\"font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--green);margin-bottom:4px\">Lei 14.129/2021<\u002Fdiv>\n          <h3>Lei do Governo Digital<\u002Fh3>\n          <p style=\"margin-top:4px\">Moderniza e digitaliza os serviços públicos e reforça que essa digitalização <strong>tem que respeitar a proteção de dados pessoais dos cidadãos.<\u002Fstrong> Conecta inovação tecnológica com responsabilidade no tratamento de dados.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"margin-top:24px;background:var(--lslate);border:none;padding:22px\">\n      <h3 style=\"margin-bottom:14px\">Como essas leis se relacionam?<\u002Fh3>\n      <div class=\"g3\">\n        <div style=\"text-align:center;padding:16px;background:#fff;border-radius:10px;border:1px solid var(--border)\">\n          <div style=\"font-weight:800;font-size:1rem;color:var(--teal);margin-bottom:6px\">LAI<\u002Fdiv>\n          <p style=\"font-size:.82rem\">O que o Estado tem deve ser <strong>aberto ao público<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"text-align:center;padding:16px;background:linear-gradient(135deg,var(--blue),var(--teal));border-radius:10px\">\n          <div style=\"font-weight:800;font-size:1rem;color:#fff;margin-bottom:6px\">LGPD<\u002Fdiv>\n          <p style=\"font-size:.82rem;color:rgba(255,255,255,.85)\">O que é pessoal deve ser <strong style=\"color:#fff\">protegido<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"text-align:center;padding:16px;background:#fff;border-radius:10px;border:1px solid var(--border)\">\n          <div style=\"font-weight:800;font-size:1rem;color:var(--green);margin-bottom:6px\">Gov Digital<\u002Fdiv>\n          <p style=\"font-size:.82rem\">A tecnologia deve <strong>respeitar os dois<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ==== RESUMO ==== -->\n<section class=\"sec\" id=\"resumo\" data-screen-label=\"Em Uma Frase\">\n  <div class=\"wrap\">\n    <div class=\"tag\" style=\"background:var(--lblue);color:var(--blue);margin-bottom:20px\">Em Uma Frase<\u002Fdiv>\n    <div class=\"quote-box\">\n      <span class=\"quote-mark\">\"<\u002Fspan>\n      <div class=\"quote-text\">A LGPD não caiu do céu: ela é o ponto de chegada de décadas de evolução — da Declaração dos Direitos Humanos <strong style=\"color:#90CAF9\">(1948)<\u002Fstrong> ao GDPR europeu <strong style=\"color:#90CAF9\">(2018)<\u002Fstrong>, e da nossa Constituição <strong style=\"color:#90CAF9\">(1988)<\u002Fstrong> até a proteção de dados virar direito fundamental <strong style=\"color:#90CAF9\">(2022)<\u002Fstrong>.<\u002Fdiv>\n      <div style=\"margin-top:20px;color:rgba(255,255,255,.6);font-size:.82rem\">Agora que você sabe de onde ela vem, fica muito mais fácil entender o que ela pede.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- visual timeline summary -->\n    <div style=\"margin-top:32px\">\n      <h3 style=\"text-align:center;margin-bottom:20px;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em\">Linha do Tempo Resumida<\u002Fh3>\n      <div style=\"display:flex;gap:0;overflow-x:auto;padding-bottom:8px\">\n        <div style=\"flex:1;min-width:100px;background:var(--lslate);border-radius:10px 0 0 10px;padding:14px;text-align:center;border-right:2px solid white\">\n          <div style=\"font-weight:800;color:var(--slate)\">1890<\u002Fdiv>\n          <div style=\"font-size:.72rem;color:var(--muted);margin-top:2px\">Privacidade como conceito<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:100px;background:var(--lblue2);padding:14px;text-align:center;border-right:2px solid white\">\n          <div style=\"font-weight:800;color:var(--blue)\">1948<\u002Fdiv>\n          <div style=\"font-size:.72rem;color:var(--muted);margin-top:2px\">Direito universal<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:100px;background:var(--lteal);padding:14px;text-align:center;border-right:2px solid white\">\n          <div style=\"font-weight:800;color:var(--teal)\">1988<\u002Fdiv>\n          <div style=\"font-size:.72rem;color:var(--muted);margin-top:2px\">Constituição Federal<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:100px;background:#FFF9C4;padding:14px;text-align:center;border-right:2px solid white\">\n          <div style=\"font-weight:800;color:var(--amber)\">2018<\u002Fdiv>\n          <div style=\"font-size:.72rem;color:var(--muted);margin-top:2px\">LGPD + GDPR<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:100px;background:var(--lgold);border-radius:0 10px 10px 0;padding:14px;text-align:center\">\n          <div style=\"font-weight:800;color:var(--gold)\">2022<\u002Fdiv>\n          <div style=\"font-size:.72rem;color:var(--muted);margin-top:2px\">Direito fundamental ⭐<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"c64a2798-be14-4784-8deb-52f2a10a8327\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">Histórico da LGPD — Clube do Servidor<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei Geral de Proteção de Dados — Lei nº 13.709/2018<\u002Fp>\n  <p style=\"margin-top:8px;font-size:.72rem;opacity:.55\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\nconst sections = ['mundo','brasil','leis','resumo'];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = 'mundo';\n  sections.forEach(id => {\n    const el = document.getElementById(id);\n    if (el && window.scrollY >= el.offsetTop - 80) cur = id;\n  });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
