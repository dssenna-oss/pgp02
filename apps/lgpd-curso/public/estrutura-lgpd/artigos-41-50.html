document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"pt-BR\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>LGPD — Artigos 41 a 50 | Clube do Servidor<\u002Ftitle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --navy:#0D1B4B;--blue:#1565C0;--blue2:#1976D2;--lblue:#E3F2FD;\n  --teal:#00695C;--lteal:#E0F2F1;\n  --green:#2E7D32;--lgreen:#E8F5E9;\n  --amber:#E65100;--lamber:#FFF3E0;\n  --red:#C62828;--lred:#FFEBEE;\n  --purple:#6A1B9A;--lpurp:#F3E5F5;\n  --sec-color:#B71C1C;--lsec:#FFEBEE;\n  --safe:#1A237E;--lsafe:#E8EAF6;\n  --bg:#F0F4FA;--card:#fff;--border:#E0E8F0;\n  --text:#1A1A2E;--muted:#6B7280;\n  --r:14px;--sh:0 2px 16px rgba(13,27,75,.09);\n}\nbody{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}\nh1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;line-height:1.2}\nh2{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:700;line-height:1.3}\nh3{font-size:1rem;font-weight:700;line-height:1.4}\nh4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\np{color:var(--muted)}strong{color:var(--text);font-weight:600}\nul{padding-left:18px;color:var(--muted)}li+li{margin-top:5px}\n\n.wrap{max-width:1080px;margin:0 auto;padding:0 24px}\n.sec{padding:56px 0}\n.sec:nth-child(odd){background:#fff}\n.sec:nth-child(even){background:var(--bg)}\n.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}\n.art-num{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:800;color:#fff}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:20px;margin-bottom:5px}\n\n.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}\n.tcol{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}\n\n.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--border)}\n.card h3{margin-bottom:6px}\n.icard{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border)}\n.icard-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff}\n.dcard{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border)}\n.dcard .dn{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}\n.dcard .dt{font-weight:700;font-size:.9rem;margin-bottom:3px;color:var(--text)}\n.dcard .dd{font-size:.8rem;color:var(--muted)}\n\n.hl{border-left:4px solid;border-radius:0 var(--r) var(--r) 0;padding:14px 18px;margin-top:16px}\n.hl h4{margin-bottom:6px}\n.cat-h{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:2px solid;margin:24px 0 12px}\n\n/* Chain diagram */\n.chain{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}\n.chain-node{flex:1;min-width:160px;padding:18px;border-radius:var(--r);text-align:center;position:relative}\n.chain-arrow{display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:1.4rem;color:var(--muted);flex-shrink:0}\n.chain-node h3{color:#fff;font-size:.9rem;margin-bottom:4px}\n.chain-node p{color:rgba(255,255,255,.8);font-size:.78rem}\n\n/* Excludente card */\n.excl-card{border-radius:var(--r);padding:20px;border:2px solid;display:flex;gap:14px;align-items:flex-start}\n.excl-num{flex-shrink:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff}\n\n/* Breach timeline */\n.breach-tl{position:relative;padding-left:36px}\n.breach-tl::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--border)}\n.breach-item{position:relative;margin-bottom:18px}\n.breach-dot{position:absolute;left:-36px;top:2px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff}\n\n/* Security measure grid */\n.sec-measure{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border);text-align:center}\n.sec-measure-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:800;font-size:.85rem;color:#fff}\n\n/* Flow */\n.flow{display:flex;flex-direction:column;gap:0}\n.flow-step{display:flex;gap:14px;align-items:flex-start;padding:14px 0}\n.flow-step+.flow-step{border-top:1px solid var(--border)}\n.flow-icon{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;color:#fff}\n\n/* Governance pillars */\n.pillar{border-radius:12px;padding:18px;color:#fff;text-align:center}\n.pillar h3{color:#fff;margin-bottom:6px;font-size:.95rem}\n.pillar p{color:rgba(255,255,255,.8);font-size:.8rem}\n\n/* Intro band */\n.intro-band{background:linear-gradient(135deg,#0D1B4B,#B71C1C);color:#fff;padding:48px 0}\n.intro-band h1{color:#fff}\n.intro-band p{color:rgba(255,255,255,.8)}\n.progress-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:24px}\n.prog-done{background:rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700}\n.prog-now{background:#fff;color:var(--navy);padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700}\n\n.site-hdr{background:var(--navy);padding:6px 0}\n.site-hdr img{height:56px;border-radius:4px;display:block}\n.art-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}\n.art-nav ul{display:flex;gap:4px;list-style:none;padding:7px 24px;max-width:1080px;margin:0 auto;white-space:nowrap}\n.art-nav a{display:inline-block;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;color:var(--muted);transition:all .2s}\n.art-nav a:hover,.art-nav a.on{background:var(--safe);color:#fff}\n\nfooter{background:var(--navy);color:rgba(255,255,255,.65);text-align:center;padding:32px 24px;font-size:.82rem}\nfooter img{height:46px;margin:0 auto 12px;display:block;border-radius:4px;opacity:.85}\nfooter a{color:rgba(255,255,255,.55);text-decoration:none;font-size:.78rem;border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;display:inline-block;margin:3px}\n@media(max-width:680px){.tcol,.chain{grid-template-columns:1fr;flex-direction:column}.chain-arrow{transform:rotate(90deg)}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"site-hdr\">\n  <div class=\"wrap\" style=\"padding:6px 24px\">\n    <img src=\"d106c36a-2d69-4079-bb50-947e5d69acbb\" alt=\"Clube do Servidor\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- INTRO -->\n<section class=\"intro-band\">\n  <div class=\"wrap\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;flex-wrap:wrap\">\n      <div>\n        <div class=\"tag\" style=\"background:rgba(255,255,255,.15);color:#fff;margin-bottom:10px\">Lei nº 13.709/2018 — Continuação<\u002Fdiv>\n        <h1>LGPD: Artigos 41 a 50<\u002Fh1>\n        <p style=\"margin-top:8px;max-width:560px\"><strong style=\"color:#fff\">Responsabilidade Civil<\u002Fstrong> — quem responde pelos danos e quando pode se eximir. <strong style=\"color:#fff\">Segurança e Boas Práticas<\u002Fstrong> — medidas técnicas, notificação de incidentes e programas de governança.<\u002Fp>\n        <div class=\"progress-bar\">\n          <span class=\"prog-done\">Art. 1–11 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 12–20 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 21–30 ✓<\u002Fspan>\n          <span class=\"prog-done\">Art. 31–40 ✓<\u002Fspan>\n          <span class=\"prog-now\">Art. 41–50 ←<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:200px\">\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.6rem;font-weight:800;color:#fff\">3<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Excludentes de resp.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.6rem;font-weight:800;color:#fff\">72h<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Ref. p/ notif. incidente<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.6rem;font-weight:800;color:#fff\">2<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Capítulos cobertos<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.12);border-radius:10px;padding:14px;text-align:center\"><div style=\"font-size:1.6rem;font-weight:800;color:#fff\">∞<\u002Fdiv><div style=\"font-size:.7rem;color:rgba(255,255,255,.7)\">Resp. solidária<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NAV -->\n<nav class=\"art-nav\">\n  <ul>\n    <li><a href=\"#a41\">Art. 41 — Resp. Controlador<\u002Fa><\u002Fli>\n    <li><a href=\"#a42\">Art. 42 — Reparação de Danos<\u002Fa><\u002Fli>\n    <li><a href=\"#a43\">Art. 43 — Excludentes<\u002Fa><\u002Fli>\n    <li><a href=\"#a44\">Art. 44 — Tratamento Irregular<\u002Fa><\u002Fli>\n    <li><a href=\"#a45\">Art. 45 — CDC<\u002Fa><\u002Fli>\n    <li><a href=\"#a46\">Art. 46 — Segurança<\u002Fa><\u002Fli>\n    <li><a href=\"#a47\">Art. 47 — Sigilo<\u002Fa><\u002Fli>\n    <li><a href=\"#a48\">Art. 48 — Incidentes<\u002Fa><\u002Fli>\n    <li><a href=\"#a49\">Art. 49 — Sistemas<\u002Fa><\u002Fli>\n    <li><a href=\"#a50\">Art. 50 — Governança<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- CHAPTER DIVIDER — RESPONSABILIDADE -->\n<div style=\"background:linear-gradient(135deg,#7B1C1C,#C62828);padding:22px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Cap. V — Cont.<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Da Responsabilidade e do Ressarcimento de Danos<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Quem responde pelos danos causados no tratamento de dados pessoais<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 41 ============ -->\n<section id=\"a41\" class=\"sec\" data-screen-label=\"Art. 41 — Responsabilidade do Controlador\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">41<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 41º<\u002Fdiv>\n        <h2>Responsabilidade do Controlador pelos Atos do Operador<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:24px\">O controlador que se valer do operador para a realização do tratamento de dados pessoais <strong>permanece responsável<\u002Fstrong> pela conformidade do tratamento com a LGPD, mesmo quando as operações são executadas por terceiro em seu nome.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"card\" style=\"background:linear-gradient(135deg,#B71C1C,#C62828);padding:24px;margin-bottom:16px\">\n          <h3 style=\"color:#fff;margin-bottom:14px\">Cadeia de Responsabilidade<\u002Fh3>\n          <div class=\"chain\">\n            <div class=\"chain-node\" style=\"background:rgba(255,255,255,.15)\">\n              <h3>Controlador<\u002Fh3>\n              <p>Toma decisões sobre o tratamento. Responde perante o titular.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"chain-arrow\" style=\"color:rgba(255,255,255,.6)\">→<\u002Fdiv>\n            <div class=\"chain-node\" style=\"background:rgba(255,255,255,.15)\">\n              <h3>Operador<\u002Fh3>\n              <p>Executa o tratamento conforme instruções do controlador.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"chain-arrow\" style=\"color:rgba(255,255,255,.6)\">→<\u002Fdiv>\n            <div class=\"chain-node\" style=\"background:rgba(255,255,255,.25)\">\n              <h3>Titular<\u002Fh3>\n              <p>Lesado por tratamento inadequado. Pode cobrar de qualquer um.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"g2\">\n          <div class=\"card\" style=\"border-left:4px solid var(--red)\">\n            <h3>Responsabilidade do Controlador<\u002Fh3>\n            <p>O controlador responde pelos danos causados pelo operador quando este <strong>age conforme suas instruções<\u002Fstrong> — ainda que a falha seja operacional.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"border-left:4px solid var(--amber)\">\n            <h3>Responsabilidade Própria do Operador<\u002Fh3>\n            <p>O operador responde diretamente quando age <strong>fora das instruções do controlador<\u002Fstrong> ou em violação expressa à LGPD.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:24px\">\n          <h3 style=\"color:var(--red);margin-bottom:14px\">Implicações Práticas para Contratos<\u002Fh3>\n          <div class=\"flow\">\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--red)\">1<\u002Fdiv>\n              <div><h3>Cláusulas de DPA obrigatórias<\u002Fh3><p>O contrato entre controlador e operador deve incluir <strong>cláusulas de proteção de dados<\u002Fstrong> (Data Processing Agreement) definindo responsabilidades.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--red)\">2<\u002Fdiv>\n              <div><h3>Instrução por escrito<\u002Fh3><p>O controlador deve dar <strong>instruções claras e documentadas<\u002Fstrong> ao operador sobre como tratar os dados, inclusive sobre segurança e subcontratação.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"flow-step\">\n              <div class=\"flow-icon\" style=\"background:var(--amber)\">3<\u002Fdiv>\n              <div><h3>Auditoria e monitoramento<\u002Fh3><p>O controlador deve <strong>monitorar o cumprimento<\u002Fstrong> das instruções pelo operador e realizar auditorias periódicas de conformidade.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 42 ============ -->\n<section id=\"a42\" class=\"sec\" data-screen-label=\"Art. 42 — Responsabilidade e Reparação de Danos\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">42<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 42º — Central<\u002Fdiv>\n        <h2>Responsabilidade e Reparação de Danos<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O controlador ou o operador que, em razão do exercício de atividade de tratamento de dados pessoais, <strong>causar a outrem dano patrimonial, moral, individual ou coletivo<\u002Fstrong>, em violação à LGPD, é obrigado a repará-lo.<\u002Fp>\n    <div class=\"g3\" style=\"margin-bottom:22px\">\n      <div style=\"background:linear-gradient(135deg,#B71C1C,#C62828);border-radius:var(--r);padding:22px;color:#fff\">\n        <div style=\"font-size:.72rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px\">Tipos de Dano Cobertos<\u002Fdiv>\n        <ul style=\"color:rgba(255,255,255,.9);padding-left:16px;display:flex;flex-direction:column;gap:6px\">\n          <li>Dano <strong style=\"color:#fff\">patrimonial<\u002Fstrong> (material)<\u002Fli>\n          <li>Dano <strong style=\"color:#fff\">moral<\u002Fstrong> (extrapatrimonial)<\u002Fli>\n          <li>Dano <strong style=\"color:#fff\">individual<\u002Fstrong> ao titular<\u002Fli>\n          <li>Dano <strong style=\"color:#fff\">coletivo<\u002Fstrong> a grupo de titulares<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <h3>Responsabilidade Solidária — §1º<\u002Fh3>\n        <p>O <strong>operador responde solidariamente<\u002Fstrong> pelos danos causados quando:<\u002Fp>\n        <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:5px\">\n          <li>Descumprir as obrigações da LGPD<\u002Fli>\n          <li>Não seguir as instruções lícitas do controlador<\u002Fli>\n          <li>Agir fora do escopo autorizado<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <h3>Direito de Regresso — §4º<\u002Fh3>\n        <p>O agente que pagar a indenização ao titular tem <strong>direito de regresso<\u002Fstrong> (ação regressiva) contra os demais agentes responsáveis na medida de sua culpabilidade.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lred);border-color:var(--red)\">\n      <h4 style=\"color:var(--red)\">Escolha do Titular — §2º e §3º<\u002Fh4>\n      <p>O titular lesado pode optar por acionar <strong>qualquer um dos agentes de tratamento<\u002Fstrong> (controlador ou operador), independentemente de quem foi o causador direto do dano. Os agentes respondem solidariamente perante o titular — podendo discutir entre si (regressivamente) a divisão do ônus.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 43 ============ -->\n<section id=\"a43\" class=\"sec\" data-screen-label=\"Art. 43 — Excludentes de Responsabilidade\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--amber)\">43<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lamber);color:var(--amber)\">Artigo 43º<\u002Fdiv>\n        <h2>Excludentes de Responsabilidade<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os agentes de tratamento <strong>não serão responsabilizados<\u002Fstrong> quando provarem que:<\u002Fp>\n    <div class=\"g3\" style=\"margin-bottom:22px\">\n      <div class=\"excl-card\" style=\"border-color:var(--green);background:var(--lgreen)\">\n        <div class=\"excl-num\" style=\"background:var(--green)\">I<\u002Fdiv>\n        <div>\n          <h3 style=\"color:var(--green)\">Não realizaram o tratamento<\u002Fh3>\n          <p>Não realizaram o tratamento de dados pessoais que lhes é atribuído — por exemplo, quando o dano decorre de tratamento realizado por terceiro desconhecido.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"excl-card\" style=\"border-color:var(--blue);background:var(--lblue)\">\n        <div class=\"excl-num\" style=\"background:var(--blue)\">II<\u002Fdiv>\n        <div>\n          <h3 style=\"color:var(--blue)\">Não houve violação<\u002Fh3>\n          <p>Embora tenham realizado o tratamento, <strong>não houve violação à legislação<\u002Fstrong> de proteção de dados — o tratamento estava em conformidade com a LGPD.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"excl-card\" style=\"border-color:var(--purple);background:var(--lpurp)\">\n        <div class=\"excl-num\" style=\"background:var(--purple)\">III<\u002Fdiv>\n        <div>\n          <h3 style=\"color:var(--purple)\">Culpa exclusiva de terceiro<\u002Fh3>\n          <p>O dano decorreu de <strong>culpa exclusiva do titular<\u002Fstrong> ou de terceiro — como ataque cibernético sofisticado ou fraude do próprio usuário.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lamber);border-color:var(--amber)\">\n      <h4 style=\"color:var(--amber)\">Ônus da Prova<\u002Fh4>\n      <p>O ônus de <strong>provar as excludentes é do agente de tratamento<\u002Fstrong>, não do titular. O sistema adota responsabilidade objetiva (independente de dolo ou culpa), facilitando a reparação dos titulares lesados.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 44 ============ -->\n<section id=\"a44\" class=\"sec\" data-screen-label=\"Art. 44 — Tratamento Irregular\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">44<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 44º<\u002Fdiv>\n        <h2>O que é Tratamento Irregular de Dados Pessoais<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O tratamento de dados pessoais será <strong>irregular<\u002Fstrong> quando não fornecer a segurança que o titular dele pode esperar, consideradas as circunstâncias relevantes.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <div style=\"font-weight:700;font-size:.8rem;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px\">Critério I<\u002Fdiv>\n        <h3>Forma e Modo de Realização<\u002Fh3>\n        <p>A maneira como o tratamento é conduzido — técnicas utilizadas, nível de cuidado, medidas de segurança adotadas em relação ao estado da arte.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <div style=\"font-weight:700;font-size:.8rem;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px\">Critério II<\u002Fdiv>\n        <h3>Resultado e Riscos Esperados<\u002Fh3>\n        <p>Os resultados e riscos que razoavelmente se esperam do tipo de tratamento realizado — proporcionalidade entre finalidade e risco gerado ao titular.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--red)\">\n        <div style=\"font-weight:700;font-size:.8rem;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px\">Critério III<\u002Fdiv>\n        <h3>Técnicas Disponíveis na Época<\u002Fh3>\n        <p>As técnicas de tratamento de dados disponíveis à época da realização — avalia-se o que era possível e esperado pelo mercado no momento do tratamento.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lred);border-color:var(--red)\">\n      <h4 style=\"color:var(--red)\">Padrão de Segurança Esperado<\u002Fh4>\n      <p>O artigo define um <strong>padrão objetivo de segurança<\u002Fstrong>: o titular tem direito a esperar que seus dados sejam tratados com o nível de proteção que seria razoável para aquele tipo de operação, considerando as melhores práticas disponíveis no mercado — independentemente de contrato ou promessa específica.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 45 ============ -->\n<section id=\"a45\" class=\"sec\" data-screen-label=\"Art. 45 — Aplicação do CDC\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--amber)\">45<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lamber);color:var(--amber)\">Artigo 45º<\u002Fdiv>\n        <h2>Aplicação do Código de Defesa do Consumidor<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Às infrações cometidas pelas pessoas referidas no artigo anterior, <strong>aplica-se o disposto no Código de Defesa do Consumidor (CDC)<\u002Fstrong> quando o tratamento de dados decorrer de relação de consumo.<\u002Fp>\n    <div class=\"g2\">\n      <div class=\"card\" style=\"border-left:4px solid var(--amber)\">\n        <h3>Por que o CDC importa?<\u002Fh3>\n        <p>O CDC prevê mecanismos de proteção ao consumidor robustos, incluindo <strong>responsabilidade objetiva do fornecedor<\u002Fstrong>, inversão do ônus da prova e proteção coletiva via ações de classe — todos aplicáveis quando o tratamento envolve relação de consumo.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-left:4px solid var(--amber)\">\n        <h3>Exemplos de Aplicação Conjunta<\u002Fh3>\n        <ul style=\"display:flex;flex-direction:column;gap:7px;margin-top:8px\">\n          <li>Banco vaza dados de correntistas → CDC + LGPD<\u002Fli>\n          <li>App expõe dados de usuários → CDC + LGPD<\u002Fli>\n          <li>E-commerce compartilha cadastro → CDC + LGPD<\u002Fli>\n          <li>Seguradora usa dados indevidamente → CDC + LGPD<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lamber);border-color:var(--amber)\">\n      <h4 style=\"color:var(--amber)\">Cumulação de Proteções<\u002Fh4>\n      <p>A LGPD <strong>não exclui<\u002Fstrong> a aplicação de outras legislações protetivas. O titular pode se valer simultaneamente da LGPD, do CDC, do Código Civil e de leis setoriais (como a Lei do Cadastro Positivo) para buscar a mais ampla proteção de seus direitos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CHAPTER DIVIDER — SEGURANÇA -->\n<div style=\"background:linear-gradient(135deg,#1A237E,#283593);padding:22px 0\">\n  <div class=\"wrap\" style=\"display:flex;align-items:center;gap:16px\">\n    <div style=\"background:rgba(255,255,255,.18);border-radius:10px;padding:10px 18px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap\">Capítulo VI<\u002Fdiv>\n    <div>\n      <div style=\"color:#fff;font-weight:700;font-size:1rem\">Da Segurança e das Boas Práticas<\u002Fdiv>\n      <div style=\"color:rgba(255,255,255,.7);font-size:.82rem\">Medidas técnicas, comunicação de incidentes e programas de governança em proteção de dados<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ ART. 46 ============ -->\n<section id=\"a46\" class=\"sec\" data-screen-label=\"Art. 46 — Medidas de Segurança\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--safe)\">46<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lsafe);color:var(--safe)\">Artigo 46º — Capítulo VI<\u002Fdiv>\n        <h2>Medidas de Segurança no Tratamento de Dados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os agentes de tratamento devem adotar medidas de segurança, técnicas e administrativas <strong>aptas a proteger os dados pessoais<\u002Fstrong> de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou difusão.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"g2\" style=\"margin-bottom:16px\">\n          <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n            <h3>Medidas Técnicas<\u002Fh3>\n            <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n              <li>Criptografia de dados em trânsito e em repouso<\u002Fli>\n              <li>Controle de acesso baseado em perfis<\u002Fli>\n              <li>Autenticação multifator (MFA)<\u002Fli>\n              <li>Anonimização e pseudonimização<\u002Fli>\n              <li>Monitoramento e logs de auditoria<\u002Fli>\n              <li>Backup e recuperação de desastres<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n            <h3>Medidas Administrativas<\u002Fh3>\n            <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n              <li>Políticas internas de segurança da informação<\u002Fli>\n              <li>Treinamento regular de colaboradores<\u002Fli>\n              <li>Plano de resposta a incidentes<\u002Fli>\n              <li>Due diligence de fornecedores e operadores<\u002Fli>\n              <li>Avaliação periódica de vulnerabilidades<\u002Fli>\n              <li>Gestão de acessos e desligamentos<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lsafe);border-color:var(--safe)\">\n          <h4 style=\"color:var(--safe)\">§1º — Regulamentação pela ANPD<\u002Fh4>\n          <p>A ANPD poderá dispor sobre padrões técnicos mínimos para as medidas de segurança, considerando a <strong>natureza das informações tratadas<\u002Fstrong> e as características específicas do tratamento.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:linear-gradient(135deg,#1A237E,#283593);border-radius:var(--r);padding:24px;color:#fff\">\n          <h3 style=\"color:#fff;margin-bottom:14px\">Segurança desde a Concepção<\u002Fh3>\n          <p style=\"color:rgba(255,255,255,.85);margin-bottom:16px\"><em>Privacy by Design<\u002Fem> — a segurança deve ser incorporada desde o início do projeto do sistema, não adicionada depois.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"background:rgba(255,255,255,.1);border-radius:10px;padding:12px\">\n              <div style=\"font-size:.75rem;color:rgba(255,255,255,.6);margin-bottom:4px\">Preventivo, não Reativo<\u002Fdiv>\n              <p style=\"color:#fff;font-size:.85rem\">Antecipar problemas antes que ocorram, não remediar após os fatos.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.1);border-radius:10px;padding:12px\">\n              <div style=\"font-size:.75rem;color:rgba(255,255,255,.6);margin-bottom:4px\">Privacidade como Padrão<\u002Fdiv>\n              <p style=\"color:#fff;font-size:.85rem\">Configuração padrão dos sistemas deve ser a mais protetiva possível.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.1);border-radius:10px;padding:12px\">\n              <div style=\"font-size:.75rem;color:rgba(255,255,255,.6);margin-bottom:4px\">Visibilidade e Transparência<\u002Fdiv>\n              <p style=\"color:#fff;font-size:.85rem\">Os sistemas devem operar de forma verificável e auditável.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 47 ============ -->\n<section id=\"a47\" class=\"sec\" data-screen-label=\"Art. 47 — Sigilo e Confidencialidade\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--safe)\">47<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lsafe);color:var(--safe)\">Artigo 47º<\u002Fdiv>\n        <h2>Dever de Sigilo dos Agentes e Colaboradores<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os agentes de tratamento ou qualquer outra pessoa que intervenha em uma das fases do tratamento <strong>obriga-se ao sigilo<\u002Fstrong> em relação aos dados pessoais tratados, salvo informação pública ou expresso consentimento do titular.<\u002Fp>\n    <div class=\"g3\">\n      <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n        <h3>Quem está obrigado<\u002Fh3>\n        <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n          <li>Controladores e seus colaboradores<\u002Fli>\n          <li>Operadores e suboperadores<\u002Fli>\n          <li>Encarregados (DPOs)<\u002Fli>\n          <li>Prestadores de serviços com acesso aos dados<\u002Fli>\n          <li>Ex-colaboradores (sigilo permanece após saída)<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n        <h3>Exceções ao Sigilo<\u002Fh3>\n        <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n          <li>Dados de acesso público<\u002Fli>\n          <li>Consentimento expresso do titular<\u002Fli>\n          <li>Cumprimento de obrigação legal<\u002Fli>\n          <li>Ordem judicial fundamentada<\u002Fli>\n          <li>Exercício regular de direitos em processo<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border-top:3px solid var(--safe)\">\n        <h3>Implementação Prática<\u002Fh3>\n        <ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px\">\n          <li>Cláusulas de confidencialidade em contratos<\u002Fli>\n          <li>Termo de responsabilidade para colaboradores<\u002Fli>\n          <li>Treinamento sobre sigilo profissional<\u002Fli>\n          <li>Política de need-to-know (acesso mínimo)<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 48 ============ -->\n<section id=\"a48\" class=\"sec\" data-screen-label=\"Art. 48 — Comunicação de Incidentes de Segurança\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--red)\">48<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lred);color:var(--red)\">Artigo 48º — Crítico<\u002Fdiv>\n        <h2>Comunicação de Incidentes de Segurança (Data Breach)<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">O controlador deverá comunicar à ANPD e ao titular a ocorrência de incidente de segurança que possa acarretar <strong>risco ou dano relevante<\u002Fstrong> aos titulares.<\u002Fp>\n    <div class=\"tcol\">\n      <div>\n        <div class=\"breach-tl\" style=\"margin-bottom:20px\">\n          <div class=\"breach-item\">\n            <div class=\"breach-dot\" style=\"background:var(--red)\">0<\u002Fdiv>\n            <h3>Incidente Ocorre<\u002Fh3>\n            <p style=\"font-size:.85rem\">Acesso indevido, vazamento, destruição ou perda de dados pessoais detectado pelo controlador ou comunicado por terceiro.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"breach-item\">\n            <div class=\"breach-dot\" style=\"background:var(--red)\">1<\u002Fdiv>\n            <h3>Avaliação Interna<\u002Fh3>\n            <p style=\"font-size:.85rem\">O controlador avalia a extensão do incidente, os dados afetados, os titulares impactados e os riscos gerados.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"breach-item\">\n            <div class=\"breach-dot\" style=\"background:var(--amber)\">2<\u002Fdiv>\n            <h3>Comunicação em Prazo Razoável<\u002Fh3>\n            <p style=\"font-size:.85rem\">Notificação à <strong>ANPD<\u002Fstrong> e aos <strong>titulares afetados<\u002Fstrong> — a ANPD referencia o prazo de até 72 horas para aviso inicial em suas regulamentações.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"breach-item\">\n            <div class=\"breach-dot\" style=\"background:var(--green)\">3<\u002Fdiv>\n            <h3>Medidas de Contenção<\u002Fh3>\n            <p style=\"font-size:.85rem\">Adoção de providências imediatas para conter o incidente, preservar evidências e evitar novos danos.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"breach-item\" style=\"margin-bottom:0\">\n            <div class=\"breach-dot\" style=\"background:var(--green)\">4<\u002Fdiv>\n            <h3>Relatório Final à ANPD<\u002Fh3>\n            <p style=\"font-size:.85rem\">Entrega de relatório completo com todas as informações sobre o incidente, medidas adotadas e lições aprendidas.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"card\" style=\"padding:20px;margin-bottom:14px\">\n          <h3 style=\"color:var(--red);margin-bottom:12px\">Conteúdo Mínimo da Comunicação — §1º<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"background:var(--lred);border-radius:8px;padding:10px 12px;font-size:.85rem\"><strong>Natureza dos dados afetados<\u002Fstrong> — quais categorias de dados foram comprometidas<\u002Fdiv>\n            <div style=\"background:var(--lred);border-radius:8px;padding:10px 12px;font-size:.85rem\"><strong>Informações sobre os titulares<\u002Fstrong> — número estimado de pessoas afetadas<\u002Fdiv>\n            <div style=\"background:var(--lred);border-radius:8px;padding:10px 12px;font-size:.85rem\"><strong>Medidas técnicas adotadas<\u002Fstrong> — ações para proteger e mitigar os riscos<\u002Fdiv>\n            <div style=\"background:var(--lred);border-radius:8px;padding:10px 12px;font-size:.85rem\"><strong>Riscos relacionados ao incidente<\u002Fstrong> — impacto potencial para os titulares<\u002Fdiv>\n            <div style=\"background:var(--lred);border-radius:8px;padding:10px 12px;font-size:.85rem\"><strong>Motivos da demora<\u002Fstrong> — caso a comunicação não seja imediata<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hl\" style=\"background:var(--lsafe);border-color:var(--safe)\">\n          <h4 style=\"color:var(--safe)\">Poderes da ANPD — §2º<\u002Fh4>\n          <p>Recebida a comunicação, a ANPD pode: verificar a gravidade do incidente, determinar medidas para proteção dos titulares, divulgar o ocorrido ao público e impor sanções caso o agente tenha agido com negligência.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 49 ============ -->\n<section id=\"a49\" class=\"sec\" data-screen-label=\"Art. 49 — Sistemas de Informação\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--safe)\">49<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lsafe);color:var(--safe)\">Artigo 49º<\u002Fdiv>\n        <h2>Segurança desde a Concepção dos Sistemas<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os sistemas utilizados para o tratamento de dados pessoais deverão ser estruturados de forma a <strong>atender aos requisitos de segurança<\u002Fstrong>, aos padrões de boas práticas e de governança e aos princípios gerais previstos na LGPD, facilitando o controle pelos titulares.<\u002Fp>\n    <div class=\"g4\">\n      <div class=\"sec-measure\">\n        <div class=\"sec-measure-icon\" style=\"background:var(--safe)\">1<\u002Fdiv>\n        <h3>Privacy by Design<\u002Fh3>\n        <p style=\"font-size:.82rem\">Privacidade incorporada à arquitetura do sistema desde o início, não adicionada posteriormente.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-measure\">\n        <div class=\"sec-measure-icon\" style=\"background:var(--safe)\">2<\u002Fdiv>\n        <h3>Privacy by Default<\u002Fh3>\n        <p style=\"font-size:.82rem\">Configurações padrão do sistema devem ser as mais protetivas — o titular decide se quer abrir mais.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-measure\">\n        <div class=\"sec-measure-icon\" style=\"background:var(--safe)\">3<\u002Fdiv>\n        <h3>Controle pelo Titular<\u002Fh3>\n        <p style=\"font-size:.82rem\">O sistema deve facilitar o exercício dos direitos do titular: acesso, correção, portabilidade e revogação.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-measure\">\n        <div class=\"sec-measure-icon\" style=\"background:var(--safe)\">4<\u002Fdiv>\n        <h3>Minimização de Dados<\u002Fh3>\n        <p style=\"font-size:.82rem\">O sistema deve ser projetado para coletar apenas os dados estritamente necessários à finalidade informada.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hl\" style=\"background:var(--lsafe);border-color:var(--safe)\">\n      <h4 style=\"color:var(--safe)\">Obrigação de Resultado<\u002Fh4>\n      <p>O Art. 49 impõe ao controlador uma <strong>obrigação de resultado<\u002Fstrong>: os sistemas precisam efetivamente propiciar segurança e controle, não apenas cumprir formalmente requisitos de papel. A ANPD pode estabelecer padrões técnicos mínimos a serem seguidos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ART. 50 ============ -->\n<section id=\"a50\" class=\"sec\" data-screen-label=\"Art. 50 — Boas Práticas e Governança\">\n  <div class=\"wrap\">\n    <div class=\"art-head\">\n      <div class=\"art-num\" style=\"background:var(--safe)\">50<\u002Fdiv>\n      <div>\n        <div class=\"tag\" style=\"background:var(--lsafe);color:var(--safe)\">Artigo 50º<\u002Fdiv>\n        <h2>Programa de Boas Práticas e Governança em Proteção de Dados<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-bottom:22px\">Os controladores e operadores, no âmbito de suas competências, poderão formular regras de boas práticas e de governança que estabeleçam as condições de organização, o regime de funcionamento, os procedimentos, as normas de segurança, os padrões técnicos, as obrigações específicas para os vários envolvidos no tratamento, as ações educativas, os mecanismos internos de supervisão e de mitigação de riscos e outros aspectos relacionados ao tratamento de dados pessoais.<\u002Fp>\n    <div class=\"g3\" style=\"margin-bottom:24px\">\n      <div class=\"pillar\" style=\"background:linear-gradient(135deg,#1A237E,#283593)\">\n        <div style=\"font-size:1.6rem;margin-bottom:8px\">■<\u002Fdiv>\n        <h3>Estrutura Organizacional<\u002Fh3>\n        <p>Definição clara de papéis, responsabilidades e alçadas para decisões sobre proteção de dados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\" style=\"background:linear-gradient(135deg,#1565C0,#1976D2)\">\n        <div style=\"font-size:1.6rem;margin-bottom:8px\">■<\u002Fdiv>\n        <h3>Políticas e Normas Internas<\u002Fh3>\n        <p>Políticas de privacidade, normas de tratamento de dados e procedimentos operacionais padronizados.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\" style=\"background:linear-gradient(135deg,#00695C,#00897B)\">\n        <div style=\"font-size:1.6rem;margin-bottom:8px\">■<\u002Fdiv>\n        <h3>Gestão de Riscos<\u002Fh3>\n        <p>Avaliação periódica de riscos ao tratamento, planos de ação corretiva e monitoramento contínuo.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\" style=\"background:linear-gradient(135deg,#2E7D32,#388E3C)\">\n        <div style=\"font-size:1.6rem;margin-bottom:8px\">■<\u002Fdiv>\n        <h3>Treinamento e Cultura<\u002Fh3>\n        <p>Programas de capacitação regulares para colaboradores e formação de cultura de privacidade organizacional.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\" style=\"background:linear-gradient(135deg,#E65100,#F57C00)\">\n        <div style=\"font-size:1.6rem;margin-bottom:8px\">■<\u002Fdiv>\n        <h3>Supervisão e Auditoria<\u002Fh3>\n        <p>Mecanismos internos de monitoramento e auditoria para verificar a eficácia do programa de governança.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"pillar\" style=\"background:linear-gradient(135deg,#6A1B9A,#7B1FA2)\">\n        <div style=\"font-size:1.6rem;margin-bottom:8px\">■<\u002Fdiv>\n        <h3>Resposta a Incidentes<\u002Fh3>\n        <p>Plano documentado de resposta a incidentes de segurança, com papéis, fluxos de comunicação e prazos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"g2\">\n      <div class=\"hl\" style=\"background:var(--lsafe);border-color:var(--safe);margin-top:0\">\n        <h4 style=\"color:var(--safe)\">§1º — Avaliação pela ANPD<\u002Fh4>\n        <p>Ao estabelecer as regras de boas práticas, o controlador e o operador deverão considerar a natureza, o escopo, a finalidade e a probabilidade e a gravidade dos riscos e dos benefícios decorrentes do tratamento de dados pessoais. A ANPD estimulará e reconhecerá os programas de boas práticas.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"hl\" style=\"background:var(--lgreen);border-color:var(--green);margin-top:0\">\n        <h4 style=\"color:var(--green)\">§2º — Reconhecimento pela ANPD<\u002Fh4>\n        <p>A ANPD poderá dispor sobre padrões de boas práticas e segurança, bem como <strong>reconhecer formalmente<\u002Fstrong> programas de governança de proteção de dados elaborados por agentes de tratamento que demonstrem compromisso efetivo com a privacidade e a segurança dos dados.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <img src=\"d106c36a-2d69-4079-bb50-947e5d69acbb\" alt=\"Clube do Servidor\">\n  <p><strong style=\"color:#fff\">LGPD — Lei Geral de Proteção de Dados Pessoais<\u002Fstrong><\u002Fp>\n  <p style=\"margin-top:4px\">Lei nº 13.709, de 14 de agosto de 2018 — Artigos 41 a 50<\u002Fp>\n  <div style=\"margin-top:14px\">\n    <a href=\"LGPD - Artigos 1 a 11.html\">Art. 1–11<\u002Fa>\n    <a href=\"LGPD - Artigos 12 a 20.html\">Art. 12–20<\u002Fa>\n    <a href=\"LGPD - Artigos 21 a 30.html\">Art. 21–30<\u002Fa>\n    <a href=\"LGPD - Artigos 31 a 40.html\">Art. 31–40<\u002Fa>\n  <\u002Fdiv>\n  <p style=\"margin-top:12px;font-size:.72rem;opacity:.45\">Conteúdo educativo produzido para fins de estudo e capacitação profissional.<\u002Fp>\n<\u002Ffooter>\n\n<script>\ndocument.querySelectorAll('.art-nav a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const id = a.getAttribute('href').slice(1);\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });\n  });\n});\nconst secs = [...document.querySelectorAll('section[id]')];\nconst links = [...document.querySelectorAll('.art-nav a')];\nfunction updateNav() {\n  let cur = secs[0]?.id;\n  secs.forEach(s => { if (window.scrollY >= s.offsetTop - 80) cur = s.id; });\n  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));\n  const active = links.find(a => a.getAttribute('href') === '#' + cur);\n  if (active) active.scrollIntoView({ inline: 'nearest', behavior: 'smooth', block: 'nearest' });\n}\nwindow.addEventListener('scroll', updateNav, { passive: true });\nupdateNav();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
